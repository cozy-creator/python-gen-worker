name: proto contract

# pgw#944 / th#1562 — proto/worker_scheduler.proto is a VENDORED, byte-for-byte
# copy of tensorhub's canonical copy (resync with scripts/vendor-proto.sh).
# This job proves the generated bindings under src/gen_worker/pb match the
# vendored .proto. Byte-identity with tensorhub is verified on the tensorhub
# side via internal/wirecontract/peers.lock (th#1979); pgw#1582 retired the
# local PROTO_DIGEST copy of that check.
on:
  workflow_dispatch: {}
  pull_request:
    branches: [master]
    paths:
      - "proto/worker_scheduler.proto"
      - "scripts/vendor-proto.sh"
      - "src/gen_worker/pb/**"
      - ".github/workflows/proto-contract.yaml"
      # pgw#952: the second step REGENERATES the bindings with grpc_tools.protoc
      # and diffs them, so the generator's own version is an input to this
      # gate's verdict. A `grpcio-tools` bump moves the generated header and the
      # descriptor bytes while touching none of the paths above — the committed
      # bindings then silently drift from what the pinned toolchain produces.
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: proto-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Layer 1 needs nothing but coreutils — run it before any setup so a
      # hand-edited contract fails in seconds with a readable message.

      # pgw#1477, same layer-1 argument: `uv sync --locked` below is where a
      # stale lock kills this job, with a message naming neither pyproject.toml
      # nor the divergent rev. This one names both, in ~30 ms, before uv exists.
      - name: pgw#1477 guard - uv.lock agrees with pyproject.toml's git pins
        run: python3 scripts/lint_lock_pin_agreement.py

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # The .proto is the contract, but gen_worker imports the GENERATED
      # bindings. A regenerated-and-uncommitted pb/ is the same drift one level
      # down, so prove the committed bindings match the vendored .proto.
      - name: generated bindings match the .proto
        run: |
          uv run --extra dev python -m grpc_tools.protoc \
            -Iproto \
            --python_out=src/gen_worker/pb \
            --grpc_python_out=src/gen_worker/pb \
            --pyi_out=src/gen_worker/pb \
            proto/worker_scheduler.proto
          git diff --exit-code -- src/gen_worker/pb
