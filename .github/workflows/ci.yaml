name: CI

# pgw#952 — this workflow is split into two PARALLEL jobs, and runs the full
# suite on every PR. pgw#977 (2026-08-05) narrowed the trigger back to `master`
# alone, because `dev` was deleted when the three-tier flow retired — lanes now
# PR straight to `master`, so `[master]` IS the every-lane trigger. Both jobs
# are the master ruleset's required contexts (`fast gates`, `tests`).
#
# ─── THE GAP THIS CLOSES, AND WHY IT STAYS CLOSED ──────────────────────────────
#
# Until pgw#952 a lane PR in this repository could run NO CI AT ALL. Verified on
# PR #466 (`950-legacy-hardcut`, 215+/178-): `statusCheckRollup` was `[]`. Not a
# check that passed — no check ran. At the time the cause was `ci.yaml` naming
# only `master` while lanes targeted `dev`; the branch names have since swapped
# roles, and the invariant that matters is the one to preserve:
#
#   **THIS WORKFLOW MUST TRIGGER ON WHATEVER BRANCH LANES ACTUALLY PR INTO.**
#
# If that branch is ever renamed or a second one added, change the list here in
# the same commit. A lane merging with an empty check rollup is the failure this
# file exists to make impossible, and a reader cannot tell it apart from "CI is
# broken". pgw#949 is the same failure already written down: the integration
# branch sat RED on two gw#666 guard tests since PR #455 and nothing said so.
#
# ─── WHY THE FULL SUITE IS PRE-MERGE HERE, UNLIKE TENSORHUB ────────────────────
#
# An older header said "CI spend is metered (WORKSPACE-GIT-POLICY.md)". That is
# true of tensorhub, which is PRIVATE — and it is why tensorhub's `verify` moved
# to a post-merge `push: [master]` trigger (th#1621/th#1114, ~24 runner-hours/day
# at lane volume). **This repository is PUBLIC**
# (`gh repo view --json visibility` -> PUBLIC), and GitHub Actions on standard
# runners is free and unmetered for public repositories. `ubuntu-latest` is a
# standard runner. That constraint does not exist on this repo, so the suite
# stays pre-merge where it can actually block a defect.
#
# What remains real is LATENCY, not spend. That is what the two jobs below are
# for: a lane gets the cheap verdict in ~1m35s and does not wait 15m to learn
# that mypy is unhappy.
#
# ─── MEASURED, ON THE RUNNER ───────────────────────────────────────────────────
#
# Not extrapolated from this 32-core box — a 4-core `ubuntu-latest` behaves
# nothing like it, which is the trap th#1572's lane fell into by a factor of 40.
# Left column: run 30847566437, the last green run of the old single-job shape,
# re-attributed to the two jobs below. Right column: this workflow's OWN PR
# (#467, head 91c73388) — the shape as it actually ships. Both cold; there is no
# cache in either.
#
#                                    old shape   THIS workflow (PR #467)
#   Set up job + checkout                   4s      4s   both jobs
#   Install uv + Set up Python 3.12         3s      2s   both jobs
#   uv sync --locked --extra dev           21s  21-28s   both jobs
#   ------------------------------------------------------- gates
#   Type check (mypy)                      60s     58s
#   Lint (ruff)                             0s      1s
#   HTTP timeout guard                      1s      1s
#   unreached public surface guard          2s      2s
#   config reads guard                      2s      2s
#   Build package                           2s      1s
#                                       -------  ------
#   gates JOB WALL                      1m 35s  1m 42s   observed GREEN, twice
#   ------------------------------------------------------- tests
#   Install llama-server (pinned, CPU)      1s      1s
#   Run tests (v1)                     10m 59s 11m 13s   3092 passed, 2 failed
#   Run tests (v2)                      3m 47s   3m 54s   21 passed
#                                       -------  ------
#   tests JOB WALL                     15m 15s 15m 37s
#
# `tests/` runtime is the only noisy line — 10m 17s and 11m 13s on two runs of
# the same tree. That is runner variance on a 4-core box, not a signal; size the
# 40-minute timeout against the upper figure, not the lower.
#
# The two jobs run concurrently, so a full run is ~15m 40s of WALL time against
# the old serial 16m 22s, while returning the cheap half TEN times sooner
# (1m 42s). The split costs one extra ~25s install and buys that.
#
# NOTE ON THE `Run tests (v2)` LINE. Its first run on this PR reported `skipped`,
# not a duration, because `tests/` was red and a failing step skips every later
# step by default — so the two-step split had never once delivered the property
# its own comment claimed for it since pgw#808 ("a collection error in either
# must not erase the other's answer"). `if: !cancelled()` at the step is the fix,
# and the 3m 54s / 21 passed above is the proof: same red `tests/`, v2 reported
# anyway.
#
# NO CACHE STEP, deliberately, and this is the one place the tensorhub precedent
# (th#1572) does NOT transfer. There, `setup-go`'s cache key was shared across
# workflows, a cheap sibling won the save, and that job paid a 224s compile every
# run — so two explicit `actions/cache` steps were load-bearing. The Python
# equivalent does not bite: `uv sync --locked --extra dev` is 21 SECONDS cold, on
# a runner with no warm cache at all. An `actions/cache` restore of a uv cache
# large enough to matter would cost more than it saves, and would add a key that
# can go stale against `uv.lock`. If this line ever stops being true, measure the
# install step first — it is step 5 in every run.
#
# ─── NO `paths:` / `paths-ignore:` FILTER ──────────────────────────────────────
#
# The old `paths-ignore: ["**.md"]` is gone, and no `paths:` filter replaces it.
# A path filter is precisely what made proto-contract.yaml silently absent from
# #466, and three of the gates below scan the WHOLE TREE:
# `lint_unreached_surface.py` walks the public surface for unreached symbols,
# `lint_config_reads.py` censuses every `os.environ` access against
# `scripts/config_reads_allowlist.txt`, and the gw#666 guards inside the suite
# scan all of `tests/` for fixed-deadline waits. Each is invalidated COLLATERALLY
# — by a change touching none of the files it reads. pgw#949 is exactly that:
# pgw#943 added ONE new test file and broke two guards in a file it never opened.
# Any path filter narrow enough to be useful is the filter that misses these.
#
# A docs-only PR therefore runs the full suite. On an unmetered public repo that
# is the cheaper mistake: "zero checks on this PR" is the state this issue exists
# to make impossible, and a reader cannot tell it apart from "CI is broken".
#
# ─── WHAT THIS GATE DOES NOT CATCH — read this before trusting a green ─────────
#
#   * ANYTHING REQUIRING A GPU. There is no CUDA device on `ubuntu-latest`. Every
#     device path here runs through fakes, skips, or CPU fallbacks. A regression
#     that only manifests on a real card is NOT caught, and green here is not
#     evidence about the fleet. That is the nightly GPU lane's job.
#     native-kernels.yaml proves the kernels COMPILE; it never runs one.
#   * LINT. `Lint` is `continue-on-error` (pre-existing debt) — findings are
#     visible in the log and block nothing.
#   * DEPENDENCY-RESOLUTION DRIFT beyond `--locked`. `uv sync --locked` proves the
#     lock is internally consistent, not that its pins are current.
#   * CROSS-REPO CONTRACT DRIFT against tensorhub's canonical proto. That is
#     proto-contract.yaml layer 1 here and layer 2 in tensorhub, by design.
#
# The list above used to be the only place a reader could learn what a green run
# did not measure, and it could only ever name CLASSES. pgw#966 makes the actual
# set visible per run: the two pytest steps carry `-rs` (reasons in the log) and
# `--skip-census-out=` (the same set as JSON), and the guard after them refuses
# an unclassified skip and refuses a `CI-MUST-RUN` row that skipped. Read
# `scripts/skip_census.txt` for what is deliberately not measured here and where
# each of those IS measured — starting with: nothing on a GPU is, anywhere.
#
# What it DOES catch is the class that has actually been costing lanes time:
# a behavioural regression in the ~3,000-test suite, and the three tree-scanning
# guards. pgw#950's own lane found a 57-failure regression only by running a
# baseline differential BY HAND against a clean base; mypy, ruff and the three
# script guards would every one of them have passed it. That is why the full
# suite is on the PR trigger and not just the cheap half.
#
# pgw#977 (2026-08-05): `dev` is retired and lanes PR straight to `master`, so
# the trigger names `master` alone.
#
# pgw#1264 (2026-08-14, Paul's ruling — SUPERSEDES the paragraph above about both
# jobs being required): `fast gates` is now the master ruleset's ONLY required
# context. `tests` gates nothing, and it no longer runs on `merge_group` at all.
# Measured over ~300 runs before this change: `CI` on `merge_group` p50 911s, of
# which `fast gates` was 122s and `tests` 868s — so the suite WAS the queue's
# wall clock while proving nothing about the merge. With the queue widened to ten
# speculative entries it would also hold ten concurrent 14-minute runners, and
# the required job would queue behind its own workflow.
#
# What replaces it, so nothing is actually lost: `tests` still runs on EVERY PR
# push (a lane sees its own regression before merging), on `workflow_dispatch`,
# and NIGHTLY on `master` via the `schedule:` below. Pre-launch, a regression
# found by tonight's nightly is cheaper than fifteen minutes on every merge.
# pgw#1209 (2026-08-13): `master` has a MERGE QUEUE. A queued PR is validated on
# a `gh-readonly-queue/master/...` ref carrying master's tip plus every entry
# ahead of it — which is the only place the "two PRs green alone, red together"
# collision is visible. Two lines below are what make that work, and BOTH are
# load-bearing:
#
#   1. `merge_group:` in the trigger list. Without it no run is created on the
#      queue ref at all, the required contexts never report, and the queue sits
#      until `check_response_timeout_minutes` expires and evicts the PR.
#   2. `github.event_name == 'merge_group'` in the REQUIRED job's `if:`. On a
#      merge_group event `github.event.pull_request` is NULL, so the draft guard
#      alone evaluates false and the job SKIPS — and GitHub scores a skipped
#      required check as satisfied. That failure is worse than the first: the
#      queue merges having run nothing, and the PR page shows green.
#      pgw#1264: this is why the `merge_group:` trigger STAYS even though `tests`
#      opts out of it. Deleting the trigger to stop `tests` would take `fast
#      gates` with it and hang every entry to the 15-minute response timeout;
#      the opt-out belongs in the job's `if:`, never in the trigger list.
#
# The trigger is deliberately bare (no `branches:`/`paths:` filter). A filter
# that excludes a merge group is indistinguishable from case 1.
#
# TWO THINGS MEASURED WHILE TURNING THIS ON, both of which cost a live queue
# stall and neither of which is in the obvious write-ups:
#
#   * **GitHub reads workflows from the MERGE-GROUP ref, not from `master`.**
#     Verified: with the queue switched on before this trigger had landed, four
#     entries were queued and exactly ONE run existed — the group for the entry
#     that carried this file's own edit. The three ahead of it showed
#     `statusCheckRollup: none` and would have sat until the 60-minute timeout
#     evicted them. So **enable the queue only AFTER the `merge_group:` trigger
#     is already on `master`**, or the first entries queued cannot pass.
#     (Corollary, and the reason the ordering is easy to get wrong: a PR that
#     ADDS the trigger can validate itself in the queue, because its own group
#     contains its own edit. That works and still leaves everyone else stuck.)
#   * **The repo setting "Allow auto-merge" must be ON.** `gh pr merge <n>`
#     routes a queue merge through `enablePullRequestAutoMerge`, so with it off
#     the enqueue fails outright with
#     `Auto merge is not allowed for this repository`. It is a repository
#     setting, not part of the ruleset, so enabling the queue does not turn it on.
on:
  workflow_dispatch: {}
  merge_group:
  # pgw#1264: the nightly is where the full suite lives now that it is off the
  # merge path. 09:17 UTC — an odd minute, because the top of an hour is the
  # busiest slot on GitHub's shared scheduler and a queued cron just runs late.
  # This is the ONLY cron in the repo (native-kernels, proto-contract and
  # publish are event-driven), so nothing collides with it.
  # NOTE: a `schedule` event has no `github.event.pull_request` either — both
  # jobs' `if:` name it explicitly for the same reason `merge_group` is named.
  schedule:
    - cron: '17 9 * * *'
  pull_request:
    branches: [master]
    # `ready_for_review` is NOT a default `pull_request` type, and `tests` below
    # skips drafts. Without it listed here a lane that opens a draft, pushes, then
    # clicks "Ready for review" gets NO run for the head it actually merges —
    # the same invisible-green this issue exists to remove.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  # pgw#1264: superseded PR pushes should stop burning runners, but a merge-queue
  # run must never be cancellable by group — a cancelled required check reports
  # nothing, and the entry then sits until the queue's response timeout evicts it.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # ~1m35s. Everything decidable without running the suite, so a lane learns
  # about a type error or a guard violation in under two minutes instead of
  # behind an 11-minute pytest run.
  gates:
    name: fast gates
    # pgw#1268: this job has NO `if:` and must never grow one. It is the repo's
    # only required context, and GitHub scores a SKIPPED required check as
    # SATISFIED — so any condition here is a false-green generator. Measured on
    # th#1223 (2026-08-14): a run triggered while the PR was a draft evaluated
    # `github.event.pull_request.draft == false` as false, the job skipped, and
    # the PR read fully green having run nothing. Undrafting produced no new run
    # (the sha already had one) and re-running replays the original draft=true
    # payload, so the lane escaped only by force-pushing a no-op amend.
    #
    # It is NOT, contrary to the version of this comment that landed with the
    # guard removal, also false on `merge_group`. `null == false` is TRUE:
    # GitHub coerces both sides of `==` to a number, so it reads `0 == 0`
    # (measured te#199 round 2 on training-endpoints queue ref run 31833225624,
    # where a job guarded by exactly that clause RAN). The explicit
    # `merge_group` / `schedule` / `workflow_dispatch` arms this line used to
    # carry were therefore redundant — they defended a mechanism that does not
    # exist, while the draft failure that does went unnoticed behind them. That
    # is the second argument for no condition at all rather than a carefully
    # armed one: a guard whose behaviour turns on an expression-coercion rule is
    # a guard nobody reads correctly.
    # At ~1m35s the draft guard saved a rounding error; unconditional is the fix.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # pgw#1264: `@v6` HERE ONLY, and the version bump is the point rather than
      # hygiene. The dependency install is 19-21s of this job's ~128s and the
      # rest is mypy, so the download cache is the only cheap win left — but
      # `@v4` bundles `@actions/cache` v3, which speaks the cache API GitHub
      # retired, and asking v4 to cache MEASURABLY fails:
      #   ##[warning]Failed to restore: Cache service responded with 400
      # with nothing saved and no step turning red. So `enable-cache: true` on
      # `@v4` is dead config that reads as a working cache. The other three
      # workflows stay on `@v4` deliberately: none of them is the required
      # context, and an unused action bump is risk without a payoff.
      #
      # Cache scope note: Actions caches are branch-scoped, and a merge-group ref
      # is nobody's child — so the entry that makes queue runs fast is the one
      # written by a run on `master`, i.e. the nightly below. Until the first
      # nightly lands, expect a miss and the full install.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          # Keyed on uv.lock's hash (setup-uv's default glob): a lock bump
          # misses once and repopulates. Only this job asks for the cache —
          # `tests` is off the merge path now, and two jobs writing one key just
          # race to save the same entry.
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # --locked (pgw#524 item 6): resolve exactly what uv.lock pins — the
      # same resolution publish.yaml uses on tag push, so PR-CI green
      # actually implies publish green (fails loudly instead if uv.lock
      # drifts from pyproject.toml, the 0.18.0 silent-publish-failure root
      # cause). Both jobs use this exact line; keep them identical.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # GATING (gw#497): the tree is mypy-clean (zeroed 2026-07-11 — the
      # #356-era 88-error debt is gone; no baseline, no continue-on-error).
      # A new mypy error is a new seam: fix it, don't ignore it.
      #
      # pgw#1202: `strict = true` is now the DEFAULT for every module, so a
      # module added tomorrow is born strict. 101 modules carry a named
      # single-flag exemption; the guard below is what stops that list growing.
      #
      # pgw#1202 PR 2: the TEST tree is checked too. Before that it was not
      # merely unchecked — `mypy tests` REFUSED TO START on a duplicate
      # `conftest` module, so 486 test modules had zero static coverage, which
      # is where the doubles that lied about production contracts lived.
      - name: Type check (mypy, strict by default, src + tests)
        run: uv run mypy src/gen_worker tests tests_v2

      # GATING (pgw#1202): `strict = true` cannot silently stop being true, but
      # a per-module exemption list can grow one reasonable-looking name at a
      # time until the gate means nothing. This refuses that mechanically,
      # because the alternative is remembering, and remembering fails.
      - name: pgw#1202 guard - the mypy strictness ratchet only turns one way
        run: uv run python scripts/lint_mypy_ratchet.py

      - name: Lint
        continue-on-error: true  # Lint debt (mostly worker.py, being rewritten) — visible in logs, doesn't block CI.
        run: uv run ruff check src/gen_worker

      # GATING (no continue-on-error): a bare HTTP call site is the gw#456
      # forever-hang reintroduced. hf_hub network use goes through
      # gen_worker.net.hf(); every httpx/requests call carries a timeout.
      - name: HTTP timeout guard (gw#467)
        run: uv run python scripts/lint_http_timeouts.py

      - name: pgw#849 guard 2 - unreached public surface (aot/mint/serve)
        run: uv run python scripts/lint_unreached_surface.py

      # GATING (pgw#931, ruling §1.18): exactly ONE component reads the
      # environment. Every other os.environ access needs a CLASSIFIED line in
      # scripts/config_reads_allowlist.txt. Also proves the loader's
      # unknown-key refusal set still covers the tree (pgw#929).
      - name: pgw#931 guard - config reads outside the pipeline
        run: uv run python scripts/lint_config_reads.py

      # GATING (pgw#1049): exactly ONE authority writes torch settings
      # (`us -> pytorch settings`). Any write outside the authority modules
      # needs a CLASSIFIED line in scripts/settings_writers_allowlist.txt;
      # stale rows are red too.
      - name: pgw#1049 guard - torch-settings writes outside the authority
        run: uv run python scripts/lint_settings_writers.py

      # GATING (HARDCUT E5): pickles are banned platform-wide, and the two
      # scans enforcing it lived in `tests` — a job that gates nothing since
      # pgw#1264 — and read `src/` only. This one runs here, over every Python
      # tree, with no path allowlist: a site is permitted only where a proof of
      # refusal sits beside it.
      - name: HARDCUT E5 guard - nothing deserializes a pickle
        run: |
          uv run python scripts/lint_pickle_readers.py --selftest
          uv run python scripts/lint_pickle_readers.py

      # GATING (pgw#1316): a test that forks this interpreter inherits gRPC's
      # poller from whichever grpc.aio file shared its xdist worker, and the
      # child SIGABRTs. It reads as a suite failure nobody caused, on master.
      - name: pgw#1316 guard - no test forks this interpreter
        run: |
          uv run python scripts/lint_test_fork_start_method.py --selftest
          uv run python scripts/lint_test_fork_start_method.py

      # GATING (pgw#1308): under mixed-CAS a resident model occupies disk ONCE
      # — non-tensor files are symlinks into the object store and tensor bytes
      # are read, never copied. The hatch that undoes that works perfectly at
      # every individual call site, so no test ever goes red while the
      # architecture erodes; only a census notices. Whole-tree materialization
      # is down to a NAMED residue (one caller, one test), and every
      # `extract()` must say which `docs/mixed-cas-layout.md` §9 row it is.
      - name: pgw#1308 guard - the materialization hatch does not grow
        run: |
          uv run python scripts/lint_materialization_hatch.py --selftest
          uv run python scripts/lint_materialization_hatch.py

      # GATING (pgw#1299): TCG owns the compiled-graph metadata vocabulary and
      # exports it. A respelled `"graph_class"` / `"aot-inductor"` does not fail
      # at import when TCG renames the key — it returns None from a `.get()` on
      # an artifact-metadata dict, the arm reads an un-armed cell as a cache
      # miss, and the fleet silently re-mints. Filed three times (pgw#1288,
      # pgw#1299); remembering failed. AST-based, so prose is not a finding, and
      # a genuinely different vocabulary is classified at the line.
      - name: pgw#1299 guard - nobody respells TCG's metadata vocabulary
        run: |
          uv run python scripts/lint_tcg_vocabulary.py --selftest
          uv run python scripts/lint_tcg_vocabulary.py

      # GATING (pgw#1297): the CAS and compiled-graph libraries were renamed to
      # `tensorfs` and `torchcg`, and BOTH old PyPI projects are permanently
      # deleted — so an old spelling never points at anything that exists. This
      # rename half-landed twice (pgw#1310 repointed every import and left the
      # vendored directory and a dozen docstrings behind), which is why it is a
      # fence and not a sweep. Text-based on purpose, unlike the AST fence
      # above: here the prose IS the defect, because a docstring naming a module
      # nobody can import sends the reader nowhere. `_vendor/` is exempt
      # structurally: a vendored file is fixed upstream and re-vendored, never
      # respelled here, and the digest fence refuses a hand-patch. pgw#1342: the
      # vendored ref namespace is `torchcg/v1` now — the re-key that renaming it
      # would have caused was taken deliberately under tcg#39 and is frozen
      # upstream, so this exemption no longer stands in for an old spelling.
      # The script's own spellings are listed in `RETIRED`; see its docstring.
      - name: pgw#1297 guard - no retired package name survives
        run: |
          uv run python scripts/lint_retired_package_names.py --selftest
          uv run python scripts/lint_retired_package_names.py

      # GATING (th#1987 / HARDCUT A9): the `:tag` ref production is DELETED.
      # A surviving pin fails on a rented pod at the resolve, not at the line
      # that wrote it. The selftest proves the fence can go red, because a
      # sweep that only ever prints "clean" guards nothing.
      - name: th#1987 guard - no retired `owner/repo:tag` pin survives
        run: |
          uv run python scripts/lint_repo_ref_pins.py --selftest
          uv run python scripts/lint_repo_ref_pins.py

      # GATING (A18 / §1.32(d), pgw#1307 -> pgw#1319): the flavor axis is
      # deleted and the residue is now ZERO — `ProducedFlavor.flavor`, the
      # `label` read and `classify_flavor_token` are gone, the class is
      # DECLARED, and the former residue paths get no exemption.
      # `tests/test_flavor_deletion_pgw1148.py` asserts the same deletion and is
      # NOT skipped (its one skipping row died at pgw#1167), but it runs in
      # `tests`, which pgw#1264 took off the merge path — so without this step
      # the required context would have no opinion about the axis at all.
      # Selftest first: the fence must prove it goes red before its green means
      # anything, and its last arm regrows the residue in its own former files.
      - name: A18 guard - the flavor is deleted and its residue is zero
        run: |
          uv run python scripts/lint_flavor_deletion.py --selftest
          uv run python scripts/lint_flavor_deletion.py

      # GATING (pgw#1143, §1.33): `Slot(layouts=...)` is the per-slot layout
      # DEMAND the hub's gate reads. It must be readable by the AST sweep as
      # well as by the import, so a computed declaration is refused where it
      # is written — otherwise the published manifest becomes the only place
      # the demand can be read, which is the dual-declaration hazard.
      - name: pgw#1143 guard - Slot(layouts=) declarations are literals
        run: uv run python scripts/lint_layout_declarations.py

      # GATING (pgw#1143, §1.33 point 5): conversion is UPSTREAM of compute, so
      # no cell-key axis may read the layout demand or a conversion chain — no
      # cell re-keys on a conversion, ever. The fenced module set is DERIVED
      # from who calls a cell-key axis producer, so a new key computation joins
      # the fence without anyone remembering to add it.
      - name: pgw#1143 guard - no cell-key axis reads the layout vocabulary
        run: uv run python scripts/lint_compiled_graph_key_layout_fence.py

      # GATING (pgw#1215 / th#1834 §PHASE 3): th#1299's real invariant, as a
      # fence rather than as a whole extra process tier. `torch.export` and the
      # AOTI compile entry points may only be NAMED by a module that runs
      # inside a compile/trace child; every other module under src/gen_worker
      # is serving-process code by default. `torch.compile` is deliberately
      # NOT banned — th#1834 keeps the dynamo JIT-intake arm, whose half of
      # th#1299 is the turn gate (`hot_swap.RouterNotGated`).
      - name: pgw#1215 guard - no export/AOTI compile in the serving process
        run: uv run python scripts/lint_serving_process_compiles.py

      # GATING (pgw#1328, superseding pgw#1327's narrow precursor): the
      # ADOPT-ONLY serve role adopts by key and refuses or routes on a miss
      # (§4.28/§4.29), so it must not be able to compile. This walks the
      # transitive static import closure of the role's declared module set —
      # function-local imports INCLUDED, which is how `fleet_cells` reached
      # the lane — and reds on any reach into the mint machinery. Both lists
      # are read out of `src/gen_worker/serve/role.py` rather than retyped
      # here, so the role and its fence cannot drift (pgw#1176). Selftest
      # first: it proves the walk still goes red on a mint-reaching root, so
      # the green below means something.
      - name: pgw#1328 guard - the adopt-only serve role cannot reach the mint lane
        run: |
          uv run python scripts/lint_serve_role_closure.py --selftest
          uv run python scripts/lint_serve_role_closure.py

      # GATING (pgw#1176): THE GUARDS ARE GUARDED. A fence names symbols in
      # string literals; when one is renamed or deleted the fence keeps
      # running, keeps exiting 0, and guards NOTHING — it does not go red, so
      # no amount of running things finds it. Measured: this repo shipped
      # `lint_compiled_graph_key_layout_fence.py` naming a deleted symbol, green the
      # whole time. This gate scans ITSELF along with the others, so it is the
      # one guard that cannot rot silently.
      - name: pgw#1176 guard - every symbol a fence names still exists
        run: uv run python scripts/lint_fence_symbols.py

      # GATING (pgw#740 + pgw#1143): the shipped wheel's registries are bare
      # by design and a consumer's declarations populate all six.
      - name: pgw#740 guard - registry contract
        run: uv run python scripts/check_registry_contract.py

      # GATING (pgw#1332): the catalog commits two halves per family — the
      # declaration-time export and the bindings generated from it — and an
      # endpoint compiles against the second while a pod arms what the first
      # describes. Codegen is a pure function of the document, so proving they
      # still agree is a byte comparison with no torch, no GPU and no network:
      # sub-second, which is why it belongs in the REQUIRED job rather than
      # behind the fifteen-minute one.
      - name: pgw#1332 guard - family bindings match their exports
        run: uv run python scripts/check_family_bindings.py

      # GATING (th#1914 / pgw#1237 / cl#56): this public corpus is the
      # authority both sides bind to real path behavior. PGW pins it offline;
      # cozy-local performs the meaningful peer comparison after PGW lands.
      - name: pgw#1237 gate - Cozy runtime env corpus matches its digest
        run: uv run python scripts/check_cozy_runtime_env_digest.py

      # GATING (th#1914 / pgw#1237): public carrier for the exact worker
      # values and bounded relations Tensorhub consumes. PGW pins layer 1;
      # private Tensorhub performs the meaningful peer comparison after PGW
      # lands. Running that peer script here would compare PGW to itself.
      - name: pgw#1237 gate - worker value corpus matches its digest
        run: uv run python scripts/check_worker_value_contracts_digest.py

      # GATING (th#1914 / pgw#1239): public carrier for the launch ABI names
      # the private Hub supplies and this worker consumes. PGW pins layer 1;
      # Tensorhub performs the meaningful peer comparison after PGW lands.
      # Running that peer script here without an explicit candidate would be
      # a local self-comparison, so this required job stays offline.
      - name: pgw#1239 gate - Hub-worker boundary corpus matches its digest
        run: uv run python scripts/check_hub_worker_boundary_contracts_digest.py

      # GATING (th#1897/pgw#1213): the shared grammar corpora are pinned to the
      # digest BOTH repos commit, so a one-sided hand-edit of
      # compiled_graph_key_vectors.json or ref_grammar_vectors.json is red
      # HERE — offline, in the tree where it happened.
      #
      # This is LAYER 1 of the cross-repo fence and it is the half that belongs
      # in this repo. Layer 2 is scripts/grammar-vector-drift.sh, committed
      # verbatim beside it but RUN FROM TENSORHUB: it fetches the peer's copy
      # over raw.githubusercontent, this repo is public and tensorhub is not,
      # and the reverse fetch does not exist. That asymmetry is the same one
      # the proto and worker-constant gates have, and it gives the same law —
      # PGW LANDS FIRST. Running the script here would compare this repo to
      # itself, which is not a gate. It is exercised offline (both green and
      # red) by tests/test_key_grammar_vectors_th1897.py.
      - name: th#1897 gate - the shared grammar corpora match their digest
        run: uv run python scripts/check_grammar_corpus_digest.py

      # GATING (th#1914 / pgw#1236): both languages execute their formula
      # implementation against a vendored corpus. Pin the PGW copy offline;
      # Tensorhub performs the one meaningful peer comparison because this
      # repository is public and Tensorhub is private. No network here.
      - name: pgw#1236 gate - the shared formula corpus matches its digest
        run: uv run python scripts/check_formula_corpus_digest.py

      # GATING (pgw#1122): the compute child holds no worker credential BY
      # CONSTRUCTION, so a gate that reads one to answer "who am I?" or "is
      # there a hub?" refuses on every real serving pod (pgw#1108, then
      # pgw#1122 — a dead function, three pods reaped, two replacements
      # bought). Every credential read needs a CLASSIFIED line in
      # scripts/credential_identity_allowlist.txt, and there is no IDENTITY
      # class: identity comes from gen_worker.worker_identity.viewer().
      - name: pgw#1122 guard - worker-credential reads outside the resolver
        run: uv run python scripts/lint_credential_identity.py

      # GATING (pgw#1152): the ADOPT-PATH half of the same class. Four gates in
      # a row — pgw#1108, pgw#1122, pgw#1141, pgw#1141b — were one defect: a
      # rule written against the SELF-MINT path that the boot-adopt path does
      # not take. `aot_serve._KNOWN_AOT_KEYS` had two feeders, both
      # self-produced routes, so a cell that resolved, materialized and armed
      # was scored on the dynamo ledger and thrown away on a real pod. The rule
      # is structural now (registration happens inside `load_and_wrap`), and
      # this fence keeps it: a production feeder off the seam is red, a stale
      # row is red, a SECOND map into a fenced object is red, and a TEST that
      # hand-feeds one or stubs a lane accessor is red — it drives
      # tests/harness/adopt_rig.py instead. There is no CONVENTION class.
      - name: pgw#1152 guard - arm-state feeders and the adopt-path rig
        run: uv run python scripts/lint_arm_state_feeders.py

      # GATING (pgw#1049): the ambient-input census's structural claims —
      # IMPOSED rows exist in DECLARED_ENV, NEUTRALIZED rows are actually
      # scrub-covered, watched env literals in the tree are classified. The
      # completeness half (against the INSTALLED torch) runs in `tests` as
      # tests/test_ambient_census_pgw1049.py.
      - name: pgw#1049 guard - ambient-input census structural claims
        run: uv run python scripts/lint_ambient_census.py

      # GATING (pgw#891/pgw#904): a connected worker may not reconstruct or
      # substitute a Hub decision. The real repair is pgw#891's exact
      # ExecutionSpec and its schema half is th#1457's, so the deletion cannot
      # land yet — this freezes the SIZE of the job so pgw#904 stays a bounded
      # list instead of an open-ended hunt. Fails on ADDITION only.
      - name: pgw#891 guard - the post-connect resolution surface may not grow
        run: uv run python scripts/lint_post_connect_resolution.py

      # GATING (pgw#1013 / th#1662): a length read off external bytes may not
      # size a read until something bounds it. The §4.24 census enumerated the
      # bounds that EXIST, so it could not see a site that needs one and has
      # none — it walked past two real ones in files it had already swept.
      # Either bound the length with a sanctioned validator, or state why it
      # needs none with a `# bound-justified:` comment.
      - name: pgw#1013 guard - an external length sizes a read with no bound
        run: uv run python scripts/lint_unbounded_reads.py

      # GATING (pgw#1010 rider): a changelog fragment whose name does not
      # parse as <prefix><number>.md refuses the RELEASE CUT, which is weeks
      # after the PR that added it and belongs to whoever is cutting rather
      # than whoever wrote it. Three fragments have now landed misnamed
      # (pgw868-a4, pgw984-pgw985, pgw1002-pgw1005) — the failure was always
      # loud, just at the wrong time. Same check, same script, moved to the PR
      # that introduces the name.
      - name: pgw#968 guard - changelog fragment names parse
        run: uv run python scripts/assemble_changelog.py --check

      # Cheap (2s) and it belongs with the gates, not behind the suite: a
      # broken sdist/wheel build is a publish-time failure, and publish.yaml
      # gates on a green run of THIS workflow.
      - name: Build package
        run: uv build

      # pgw#1310 / ie#738. BUILDING the wheel is not INSTALLING it, and the
      # difference is a whole class of defect this workflow could not see: for
      # Naming what WAS required is the whole point of the sentence below.
      # retired-name: historical rationale, not a live reference.
      # two published releases `gen-worker`'s metadata required `hashrepo`, a
      # PyPI project that had been DELETED, so every unlocked consumer install
      # died at resolution while every check here stayed green. `uv sync
      # --locked` cannot catch it — a lock resolves from sources (git pins
      # included) that a published wheel does not carry.
      #
      # Deliberately in `fast gates` and not in `tests`: `tests` is neither
      # required nor run on the queue ref, so a wheel gate living there proves
      # nothing about what merges. ~40s, unlocked ON PURPOSE — it must resolve
      # the artifact's own metadata against the real index, exactly as a
      # consumer does.
      - name: pgw#1310 gate - the built wheel installs from a clean venv
        run: |
          set -euo pipefail
          rm -rf /tmp/wheelcheck && mkdir -p /tmp/wheelcheck
          uv build --wheel --out-dir /tmp/wheelcheck
          uv venv --python 3.12 /tmp/wheelcheck/venv
          uv pip install --python /tmp/wheelcheck/venv/bin/python \
            /tmp/wheelcheck/gen_worker-*.whl
          /tmp/wheelcheck/venv/bin/python - <<'PY'
          import threading
          from gen_worker._vendor.tensorfs import CASRef, LocalCAS
          from gen_worker._vendor.torchcg import ARTIFACT_KIND
          from gen_worker._vendor.torchcg.contracts import read_contract
          # pgw#1308: the transfer plane is first-party. It still has to be IN
          # THE WHEEL, which is the property this gate exists to prove, and a
          # first-party package can go missing from a wheel exactly as easily
          # as a vendored one -- `[tool.hatch]` decides both.
          from gen_worker.transfer.grants import TransferGrant, _run_parallel, download

          assert LocalCAS and download and ARTIFACT_KIND
          assert read_contract("KEY_GRAMMAR_DIGEST")

          # pgw#1287, asserted on the ARTIFACT: the second object cannot finish
          # until the first object's progress callback has been observed.
          grants = [TransferGrant(digest=CASRef.parse(f"sha256:{i:064x}"),
                                  size_bytes=1024, url="https://e/x")
                    for i in (1, 2)]
          first, seen = threading.Event(), []

          def worker(grant):
              if grant.digest == grants[1].digest:
                  assert first.wait(timeout=10.0), "no mid-batch progress: pgw#1287 fix absent"
              return False

          def progress(digest, size):
              seen.append(size)
              first.set()

          report = _run_parallel(grants, worker, parallel=2, progress=progress)
          assert report.succeeded == 2 and seen == [1024, 1024], (report, seen)
          print("wheel installs clean; transfer path present and emitting")
          PY

  # ~14m30s (measured p50 868s). The only job that can catch a behavioural
  # regression — and, since pgw#1264, NOT a required context and NOT part of the
  # merge path.
  tests:
    name: tests
    # pgw#1264: `!= 'merge_group'` is the whole change. This job proved nothing
    # about a merge (it is not required) while costing the queue ~868s of its
    # ~911s p50, and ten speculative entries would have held ten 14-minute
    # runners in front of the required `fast gates`. It still runs on every PR
    # push, on `workflow_dispatch`, and nightly on `master` via `schedule:`.
    # `schedule` is named explicitly for the same null-`pull_request` reason
    # `merge_group` was: without it the nightly would skip this job silently.
    if: github.event_name != 'merge_group' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Pinned CPU build so the gw#402 llama.cpp runtime tests exercise the
      # real llama-server codepath (tests skip when the binary is absent).
      # Measured 1s on the runner — a ~20 MB tarball fetch, NOT part of what
      # makes this suite expensive, so there is no version of this job worth
      # running without it. Dropping it skips five tests — which, since pgw#966,
      # the census at the end of this job PRINTS and COUNTS rather than swallows.
      #
      # `continue-on-error` (pgw#966): this is the one third party the suite
      # still reaches, and an unreachable third party must degrade to a loud
      # counted skip, never to a red required check. The MODEL those five tests
      # run is no longer fetched at all — it is vendored at
      # tests/testdata/stories260K.gguf, because an `hf_hub_download` here is
      # what put PR #483's tests job red on a `429` from huggingface.co.
      - name: Install llama-server (pinned, CPU)
        continue-on-error: true
        run: |
          curl -sSL --retry 3 -o /tmp/llama.tgz \
            https://github.com/ggml-org/llama.cpp/releases/download/b9964/llama-b9964-bin-ubuntu-x64.tar.gz
          tar xzf /tmp/llama.tgz -C "$HOME"
          echo "$HOME/llama-b9964" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/llama-b9964" >> "$GITHUB_ENV"

      # th#960/pgw#609 greenfield suite (P1-P10 + harness), whole tests/ dir
      # so late additions run automatically without a CI edit.
      #
      # pgw#796: `-n 4` (= ubuntu-latest's vCPU count), `--dist loadfile` so a
      # file's tests — and the module/session fixtures they share — stay in one
      # process. This is TEST-SYSTEM-DESIGN.md §7's wiring, finally landed.
      # `-v` is dropped: xdist's per-worker interleaving makes it unreadable,
      # and failures print in full either way.
      #
      # pgw#966: `-rs` and `--skip-census-out=` are not decoration. Until this
      # issue, a skipped row and a passing row were the same character of
      # nothing in this log, and the pgw#858 container row had been skipping
      # here since it landed — reading as coverage, executing only on developer
      # boxes, which is how the pgw#956 flake reached `dev` behind a green CI.
      # `-rs` puts the reasons in the log for a human; the JSON feeds the guard
      # at the end of this job, which is what makes the NEXT one fail a build.
      - name: Run tests (v1)
        run: uv run pytest tests/ -n 4 --dist loadfile -rs --skip-census-out=.skip-census-v1.json

      # pgw#808: the zero-based suite, as its OWN gate.
      #
      # Both directories run for the whole transition, and the reason is
      # coverage, not caution. `tests_v2/` has 2 of its 14 planned suites
      # (`test_boot`, `test_dispatch`); nine behavior domains — fatal/crash,
      # residency, CAS, lanes, adapters, JIT cells, AOT cells, convert, SDK
      # and telemetry — have ZERO v2 coverage today and `tests/` is their only
      # net. Flipping now would trade a real suite for a partial one.
      #
      # Two steps, not one invocation, deliberately: during a replacement the
      # two suites are two distinct questions ("does the net still hold" /
      # "is the replacement ready"), and a collection error in either must not
      # erase the other's answer. The flip (pgw#808: point CI at `tests_v2/`,
      # `git rm -r tests/`) deletes the step above and this comment with it.
      #
      # pgw#952: `if: !cancelled()` is what makes the paragraph above TRUE. It
      # never was — a failing step skips every later step by default, so a red
      # `tests/` silently erased the `tests_v2/` answer, which is exactly the
      # outcome the two-step split was written to prevent. Observed on this
      # workflow's own PR: `tests/` failed on pgw#949's two guards and
      # `tests_v2/` reported `skipped`, telling a reader nothing about the
      # zero-based suite. `!cancelled()` rather than `always()` so a cancelled
      # run (the concurrency group above cancels superseded pushes) does not
      # spend four more minutes on a result nobody will read.
      - name: Run tests (v2, zero-based — pgw#808)
        if: ${{ !cancelled() }}
        run: uv run pytest tests_v2/ -n 4 --dist loadfile -rs --skip-census-out=.skip-census-v2.json

      # GATING (pgw#966). Two rules: every skip this run took is CLASSIFIED in
      # scripts/skip_census.txt, and no row classified CI-MUST-RUN was among
      # them. The first stops the skip set growing invisibly; the second is the
      # pgw#858 shape stated positively — that row is expected to EXECUTE here,
      # so seeing it skip is a failure and not a note. `!cancelled()` for the
      # same reason as the step above: a red suite must not erase this answer,
      # since a red suite is exactly when the skip set tends to move.
      - name: pgw#966 guard - the skip census
        if: ${{ !cancelled() }}
        run: uv run python scripts/lint_skip_census.py --ci .skip-census-v1.json .skip-census-v2.json
