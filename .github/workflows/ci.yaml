name: CI

# pgw#952 — this workflow is split into two PARALLEL jobs and runs the full
# suite on every PR.
#
#   **THIS WORKFLOW MUST TRIGGER ON WHATEVER BRANCH LANES ACTUALLY PR INTO.**
#
# If that branch is ever renamed or a second one added, change the list here in
# the same commit. A lane merging with an empty check rollup is the failure this
# file exists to make impossible, and a reader cannot tell it apart from "CI is
# broken" — it has happened (pgw#952, `statusCheckRollup: []`; pgw#949, a branch
# red on two guard tests with nothing saying so).
#
# ─── WHY THE FULL SUITE IS PRE-MERGE HERE, UNLIKE TENSORHUB ────────────────────
#
# Tensorhub's `verify` moved to a post-merge `push: [master]` trigger because it
# is PRIVATE and metered (th#1621/th#1114, ~24 runner-hours/day at lane volume).
# **This repository is PUBLIC**, and GitHub Actions on standard runners is free
# and unmetered for public repositories — so the suite stays pre-merge where it
# can actually block a defect. What remains real is LATENCY, not spend, which is
# what the two jobs are for: the cheap verdict in ~1m40s instead of 15m.
#
# ─── MEASURED, ON THE RUNNER ───────────────────────────────────────────────────
#
# Never extrapolate from this 32-core box — a 4-core `ubuntu-latest` behaves
# nothing like it, which is the trap th#1572's lane fell into by a factor of 40.
# Cold, no cache: `gates` 1m 42s · `tests` 15m 37s, of which `uv sync --locked
# --extra dev` is ~21s and mypy ~58s. `tests/` is the only noisy line (10m 17s
# vs 11m 13s on the same tree) — runner variance, so size the 40-minute timeout
# against the upper figure.
#
# NO CACHE STEP, deliberately, and this is the one place the tensorhub precedent
# (th#1572) does NOT transfer: there `setup-go`'s cache key was shared across
# workflows and the job paid a 224s compile every run. `uv sync` is 21 SECONDS
# cold, so an `actions/cache` restore large enough to matter would cost more
# than it saves and would add a key that can go stale against `uv.lock`. If that
# ever stops being true, measure the install step first.
#
# ─── NO `paths:` / `paths-ignore:` FILTER ──────────────────────────────────────
#
# The old `paths-ignore: ["**.md"]` is gone, and no `paths:` filter replaces it.
# A path filter is precisely what made proto-contract.yaml silently absent from
# #466, and the gw#666 guards inside the suite scan all of `tests/` for
# fixed-deadline waits — invalidated COLLATERALLY by a change touching none of
# the files they read (pgw#949: ONE new test file broke two guards in a file it
# never opened). Any path filter narrow enough to be useful is the filter that
# misses these.
#
# A docs-only PR therefore runs the full suite. On an unmetered public repo that
# is the cheaper mistake: "zero checks on this PR" is the state this issue exists
# to make impossible, and a reader cannot tell it apart from "CI is broken".
#
# ─── WHAT THIS GATE DOES NOT CATCH — read this before trusting a green ─────────
#
#   * ANYTHING REQUIRING A GPU. There is no CUDA device on `ubuntu-latest`. Every
#     device path here runs through fakes, skips, or CPU fallbacks. A regression
#     that only manifests on a real card is NOT caught, and green here is not
#     evidence about the fleet. That is the nightly GPU lane's job.
#     native-kernels.yaml proves the kernels COMPILE; it never runs one.
#   * LINT. `Lint` is `continue-on-error` (pre-existing debt) — findings are
#     visible in the log and block nothing.
#   * DEPENDENCY-RESOLUTION DRIFT beyond `--locked`. `uv sync --locked` proves the
#     lock is internally consistent, not that its pins are current.
#   * CROSS-REPO CONTRACT DRIFT against tensorhub's canonical proto. That is
#     proto-contract.yaml layer 1 here and layer 2 in tensorhub, by design.
#
# What it DOES catch is the class that has actually been costing lanes time:
# a behavioural regression in the ~3,000-test suite. pgw#950's own lane found a
# 57-failure regression only by running a baseline differential BY HAND against
# a clean base; mypy and ruff would both have passed it. That is why the full
# suite is on the PR trigger and not just the cheap half.
#
# pgw#1264 (2026-08-14, Paul's ruling): `fast gates` is the master ruleset's
# ONLY required context. `tests` gates nothing and no longer runs on
# `merge_group` at all — measured over ~300 runs, `CI` on `merge_group` was p50
# 911s of which `tests` was 868s, so the suite WAS the queue's wall clock while
# proving nothing about the merge, and ten speculative entries would hold ten
# concurrent 14-minute runners in front of the required job.
#
# What replaces it, so nothing is lost: `tests` still runs on EVERY PR push, on
# `workflow_dispatch`, and NIGHTLY on `master` via the `schedule:` below.
# pgw#1209 (2026-08-13): `master` has a MERGE QUEUE. A queued PR is validated on
# a `gh-readonly-queue/master/...` ref carrying master's tip plus every entry
# ahead of it — which is the only place the "two PRs green alone, red together"
# collision is visible. Two lines below are what make that work, and BOTH are
# load-bearing:
#
#   1. `merge_group:` in the trigger list. Without it no run is created on the
#      queue ref at all, the required contexts never report, and the queue sits
#      until `check_response_timeout_minutes` expires and evicts the PR.
#   2. `github.event_name == 'merge_group'` in the REQUIRED job's `if:`. On a
#      merge_group event `github.event.pull_request` is NULL, so the draft guard
#      alone evaluates false and the job SKIPS — and GitHub scores a skipped
#      required check as satisfied. That failure is worse than the first: the
#      queue merges having run nothing, and the PR page shows green.
#      pgw#1264: this is why the `merge_group:` trigger STAYS even though `tests`
#      opts out of it. Deleting the trigger to stop `tests` would take `fast
#      gates` with it and hang every entry to the 15-minute response timeout;
#      the opt-out belongs in the job's `if:`, never in the trigger list.
#
# The trigger is deliberately bare (no `branches:`/`paths:` filter). A filter
# that excludes a merge group is indistinguishable from case 1.
#
# TWO THINGS THAT COST A LIVE QUEUE STALL, neither in the obvious write-ups:
#
#   * **GitHub reads workflows from the MERGE-GROUP ref, not from `master`**, so
#     **enable the queue only AFTER the `merge_group:` trigger is already on
#     `master`** — entries queued before it produce no run at all and sit until
#     the 60-minute timeout evicts them. The ordering is easy to get wrong
#     because a PR that ADDS the trigger validates itself: its own group carries
#     its own edit, while everyone else is stuck.
#   * **The repo setting "Allow auto-merge" must be ON.** `gh pr merge <n>`
#     routes a queue merge through `enablePullRequestAutoMerge`, so with it off
#     the enqueue fails with `Auto merge is not allowed for this repository`. It
#     is a repository setting, not part of the ruleset, so enabling the queue
#     does not turn it on.
on:
  workflow_dispatch: {}
  merge_group:
  # pgw#1264: the nightly is where the full suite lives now that it is off the
  # merge path. 09:17 UTC — an odd minute, because the top of an hour is the
  # busiest slot on GitHub's shared scheduler and a queued cron just runs late.
  # This is the ONLY cron in the repo (native-kernels, proto-contract and
  # publish are event-driven), so nothing collides with it.
  # NOTE: a `schedule` event has no `github.event.pull_request` either — both
  # jobs' `if:` name it explicitly for the same reason `merge_group` is named.
  schedule:
    - cron: '17 9 * * *'
  pull_request:
    branches: [master]
    # `ready_for_review` is NOT a default `pull_request` type, and `tests` below
    # skips drafts. Without it listed here a lane that opens a draft, pushes, then
    # clicks "Ready for review" gets NO run for the head it actually merges —
    # the same invisible-green this issue exists to remove.
    #
    # `edited` is here for the same reason, measured on pgw#957: a stacked PR
    # RETARGETED from its predecessor's branch onto master fires `edited` and
    # nothing else. Its head never changes, so `synchronize` never comes, and
    # the PR sat at `statusCheckRollup: []` against a base it had never been
    # tested on — the exact invisible-green state above.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ci-${{ github.ref }}
  # pgw#1264: superseded PR pushes should stop burning runners, but a merge-queue
  # run must never be cancellable by group — a cancelled required check reports
  # nothing, and the entry then sits until the queue's response timeout evicts it.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # ~1m35s. Everything decidable without running the suite, so a lane learns
  # about a type error or a guard violation in under two minutes instead of
  # behind an 11-minute pytest run.
  gates:
    name: fast gates
    # pgw#1268: this job has NO `if:` and must never grow one. It is the repo's
    # only required context, and GitHub scores a SKIPPED required check as
    # SATISFIED, so any condition here is a false-green generator. Measured on
    # th#1223: a run triggered while the PR was a draft evaluated
    # `github.event.pull_request.draft == false` as false, the job skipped, and
    # the PR read fully green having run nothing — undrafting produced no new
    # run and re-running replays the draft=true payload, so the lane escaped
    # only by force-pushing a no-op amend.
    #
    # A draft guard is NOT also false on `merge_group`: `null == false` is TRUE,
    # because GitHub coerces both sides of `==` to a number and reads `0 == 0`
    # (measured te#199 round 2, queue-ref run 31833225624). So explicit
    # `merge_group` / `schedule` / `workflow_dispatch` arms defend a mechanism
    # that does not exist while the draft failure that does goes unnoticed
    # behind them — which is the second argument for no condition at all. At
    # ~1m40s the draft guard saves a rounding error.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # pgw#1477 — FIRST, ahead of uv itself, and stdlib-only so it can be.
      # `uv sync --locked` dies on a stale lock with a message that names
      # neither file and no rev, so a re-vendor that moved pyproject.toml's pin
      # and not uv.lock turns every job red at install. ~30 ms, no venv.
      - name: pgw#1477 guard - uv.lock agrees with pyproject.toml's git pins
        run: python3 scripts/lint_lock_pin_agreement.py

      # pgw#1657: same layer, adjacent hole. `uv sync --locked` checks a
      # downloaded wheel against the hashes uv.lock holds for the VERSION, and
      # the cu130 index hashes only some rows — so an unpinned interpreter
      # picks an unhashed wheel and dies half a gigabyte in with `Hash
      # mismatch`, blaming the index. ~30 ms, no venv, no network.
      - name: pgw#1657 guard - .python-version pins an interpreter uv.lock hashes
        run: python3 scripts/lint_locked_interpreter.py

      # pgw#1264: `@v6` HERE ONLY, and the version is the point. `@v4` bundles
      # `@actions/cache` v3, which speaks the cache API GitHub retired, so
      # `enable-cache: true` on `@v4` is dead config that reads as a working
      # cache. The other workflows stay on `@v4`: none is the required context.
      #
      # Cache scope note: Actions caches are branch-scoped, and a merge-group ref
      # is nobody's child — so the entry that makes queue runs fast is the one
      # written by a run on `master`, i.e. the nightly below.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install  # the version is .python-version's (pgw#1657)

      # --locked (pgw#524 item 6): resolve exactly what uv.lock pins — the
      # same resolution publish.yaml uses on tag push, so PR-CI green
      # actually implies publish green. Both jobs use this exact line.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # GATING (gw#497): the tree is mypy-clean; strict by default (pgw#1202),
      # tests included. A new mypy error is a new seam: fix it, don't ignore it.
      - name: Type check (mypy, strict by default, src + tests)
        run: uv run mypy src/gen_worker tests

      - name: Lint
        continue-on-error: true  # Lint debt (mostly worker.py, being rewritten) — visible in logs, doesn't block CI.
        run: uv run ruff check src/gen_worker

      # GATING (HARDCUT E5): pickles are banned platform-wide. Every Python
      # tree, no path allowlist: a site is permitted only where a proof of
      # refusal sits beside it.
      - name: HARDCUT E5 guard - nothing deserializes a pickle
        run: uv run python scripts/lint_pickle_readers.py

      # GATING (pgw#1013 / th#1662): a length read off external bytes may not
      # size a read until something bounds it — a sanctioned validator or a
      # `# bound-justified:` comment.
      - name: pgw#1013 guard - an external length sizes a read with no bound
        run: uv run python scripts/lint_unbounded_reads.py

      # GATING: the shared contract corpora under tests/testdata are pinned to
      # the digest the peer repos (tensorhub, cozy-local, jobs) commit, so a
      # one-sided hand-edit is red HERE, offline. PGW LANDS FIRST; the peer
      # performs the meaningful cross-repo comparison.
      - name: pgw#1237 gate - Cozy runtime env corpus matches its digest
        run: uv run python scripts/check_cozy_runtime_env_digest.py
      - name: pgw#1237 gate - worker value corpus matches its digest
        run: uv run python scripts/check_worker_value_contracts_digest.py
      - name: pgw#1239 gate - Hub-worker boundary corpus matches its digest
        run: uv run python scripts/check_hub_worker_boundary_contracts_digest.py
      - name: th#1897 gate - the shared grammar corpora match their digest
        run: uv run python scripts/check_grammar_corpus_digest.py
      - name: pgw#1236 gate - the shared formula corpus matches its digest
        run: uv run python scripts/check_formula_corpus_digest.py
      - name: pgw#1600 gate - the shared demand corpus is REGENERATED and digested
        run: uv run python scripts/check_demand_corpus_digest.py

      # GATING (pgw#968): a changelog fragment whose name does not parse as
      # <prefix><number>.md would otherwise refuse the RELEASE CUT, weeks after
      # the PR that added it. Same check, on the PR that introduces the name.
      - name: pgw#968 guard - changelog fragment names parse
        run: uv run python scripts/assemble_changelog.py --check

      # Cheap (2s) and it belongs with the gates, not behind the suite: a
      # broken sdist/wheel build is a publish-time failure, and publish.yaml
      # gates on a green run of THIS workflow.
      - name: Build package
        run: uv build

      # pgw#1310 / ie#738. BUILDING the wheel is not INSTALLING it, and that
      # difference is a whole class of defect this workflow could not see.
      # retired-name: historical rationale, not a live reference —
      # `gen-worker`'s metadata once required `hashrepo`, a PyPI project that
      # had been DELETED, so every unlocked consumer install died at resolution
      # while every check here stayed green. `uv sync --locked` cannot catch it:
      # a lock resolves from sources (git pins included) that a published wheel
      # does not carry.
      #
      # Deliberately in `fast gates` and not in `tests`: `tests` is neither
      # required nor run on the queue ref, so a wheel gate living there proves
      # nothing about what merges. ~40s, unlocked ON PURPOSE — it must resolve
      # the artifact's own metadata against the real index, exactly as a
      # consumer does.
      - name: pgw#1310 gate - the built wheel installs from a clean venv
        run: |
          set -euo pipefail
          rm -rf /tmp/wheelcheck && mkdir -p /tmp/wheelcheck
          uv build --wheel --out-dir /tmp/wheelcheck
          uv venv --python 3.12 /tmp/wheelcheck/venv
          uv pip install --python /tmp/wheelcheck/venv/bin/python \
            /tmp/wheelcheck/gen_worker-*.whl
          /tmp/wheelcheck/venv/bin/python - <<'PY'
          import threading
          from gen_worker._vendor.tensorfs import CASRef, LocalCAS
          from gen_worker._vendor.torchcg import ARTIFACT_KIND
          from gen_worker._vendor.torchcg.identity import graph_hash
          # pgw#1308: the transfer plane is first-party. It still has to be IN
          # THE WHEEL, which is the property this gate exists to prove, and a
          # first-party package can go missing from a wheel exactly as easily
          # as a vendored one -- `[tool.hatch]` decides both.
          from gen_worker.transfer.grants import TransferGrant, _run_parallel, download

          assert LocalCAS and download and ARTIFACT_KIND and graph_hash
          # tcg#90: `torchcg.contracts` is gone with the rebuild and had no
          # consumer outside this canary. `identity` replaces it as the proof
          # that the vendored package is really IN the wheel — it is the module
          # every artifact address goes through, so a wheel missing it is a
          # wheel that cannot key anything.

          # pgw#1287, asserted on the ARTIFACT: the second object cannot finish
          # until the first object's progress callback has been observed.
          grants = [TransferGrant(digest=CASRef.parse(f"sha256:{i:064x}"),
                                  size_bytes=1024, url="https://e/x")
                    for i in (1, 2)]
          first, seen = threading.Event(), []

          def worker(grant):
              if grant.digest == grants[1].digest:
                  assert first.wait(timeout=10.0), "no mid-batch progress: pgw#1287 fix absent"
              return False

          def progress(digest, size):
              seen.append(size)
              first.set()

          report = _run_parallel(grants, worker, parallel=2, progress=progress)
          assert report.succeeded == 2 and seen == [1024, 1024], (report, seen)
          print("wheel installs clean; transfer path present and emitting")
          PY

  # ~14m30s (measured p50 868s). The only job that can catch a behavioural
  # regression — and, since pgw#1264, NOT a required context and NOT part of the
  # merge path.
  tests:
    name: tests
    # pgw#1264: `!= 'merge_group'` keeps this job off the queue — it proves
    # nothing about a merge (it is not required) and cost ~868s of the queue's
    # ~911s p50. It still runs on every PR push, on `workflow_dispatch`, and
    # nightly on `master` via `schedule:`. `schedule` is named explicitly for
    # the same null-`pull_request` reason `merge_group` was: without it the
    # nightly would skip this job silently.
    if: github.event_name != 'merge_group' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # pgw#1477: see `fast gates`. Same guard, same reason — this job's
      # `uv sync --locked` is one of the three reds a stale lock produces.
      - name: pgw#1477 guard - uv.lock agrees with pyproject.toml's git pins
        run: python3 scripts/lint_lock_pin_agreement.py

      # pgw#1657: same layer, adjacent hole. `uv sync --locked` checks a
      # downloaded wheel against the hashes uv.lock holds for the VERSION, and
      # the cu130 index hashes only some rows — so an unpinned interpreter
      # picks an unhashed wheel and dies half a gigabyte in with `Hash
      # mismatch`, blaming the index. ~30 ms, no venv, no network.
      - name: pgw#1657 guard - .python-version pins an interpreter uv.lock hashes
        run: python3 scripts/lint_locked_interpreter.py

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install  # the version is .python-version's (pgw#1657)

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # th#960/pgw#609: whole tests/ dir, so late additions run automatically.
      # pgw#796: `-n 4` (= ubuntu-latest's vCPU count), `--dist loadfile` so a
      # file's tests — and the module/session fixtures they share — stay in one
      # process. `-rs` puts skip reasons in the log.
      - name: Run tests
        run: uv run pytest tests/ -n 4 --dist loadfile -rs
