name: CI

# pgw#952 — this workflow is split into two PARALLEL jobs, and runs the full
# suite on every PR. pgw#977 (2026-08-05) narrowed the trigger back to `master`
# alone, because `dev` was deleted when the three-tier flow retired — lanes now
# PR straight to `master`, so `[master]` IS the every-lane trigger. Both jobs
# are the master ruleset's required contexts (`fast gates`, `tests`).
#
# ─── THE GAP THIS CLOSES, AND WHY IT STAYS CLOSED ──────────────────────────────
#
# Until pgw#952 a lane PR in this repository could run NO CI AT ALL. Verified on
# PR #466 (`950-legacy-hardcut`, 215+/178-): `statusCheckRollup` was `[]`. Not a
# check that passed — no check ran. At the time the cause was `ci.yml` naming
# only `master` while lanes targeted `dev`; the branch names have since swapped
# roles, and the invariant that matters is the one to preserve:
#
#   **THIS WORKFLOW MUST TRIGGER ON WHATEVER BRANCH LANES ACTUALLY PR INTO.**
#
# If that branch is ever renamed or a second one added, change the list here in
# the same commit. A lane merging with an empty check rollup is the failure this
# file exists to make impossible, and a reader cannot tell it apart from "CI is
# broken". pgw#949 is the same failure already written down: the integration
# branch sat RED on two gw#666 guard tests since PR #455 and nothing said so.
#
# ─── WHY THE FULL SUITE IS PRE-MERGE HERE, UNLIKE TENSORHUB ────────────────────
#
# An older header said "CI spend is metered (WORKSPACE-GIT-POLICY.md)". That is
# true of tensorhub, which is PRIVATE — and it is why tensorhub's `verify` moved
# to a post-merge `push: [master]` trigger (th#1621/th#1114, ~24 runner-hours/day
# at lane volume). **This repository is PUBLIC**
# (`gh repo view --json visibility` -> PUBLIC), and GitHub Actions on standard
# runners is free and unmetered for public repositories. `ubuntu-latest` is a
# standard runner. That constraint does not exist on this repo, so the suite
# stays pre-merge where it can actually block a defect.
#
# What remains real is LATENCY, not spend. That is what the two jobs below are
# for: a lane gets the cheap verdict in ~1m35s and does not wait 15m to learn
# that mypy is unhappy.
#
# ─── MEASURED, ON THE RUNNER ───────────────────────────────────────────────────
#
# Not extrapolated from this 32-core box — a 4-core `ubuntu-latest` behaves
# nothing like it, which is the trap th#1572's lane fell into by a factor of 40.
# Left column: run 30847566437, the last green run of the old single-job shape,
# re-attributed to the two jobs below. Right column: this workflow's OWN PR
# (#467, head 91c73388) — the shape as it actually ships. Both cold; there is no
# cache in either.
#
#                                    old shape   THIS workflow (PR #467)
#   Set up job + checkout                   4s      4s   both jobs
#   Install uv + Set up Python 3.12         3s      2s   both jobs
#   uv sync --locked --extra dev           21s  21-28s   both jobs
#   ------------------------------------------------------- gates
#   Type check (mypy)                      60s     58s
#   Lint (ruff)                             0s      1s
#   HTTP timeout guard                      1s      1s
#   unreached public surface guard          2s      2s
#   config reads guard                      2s      2s
#   Build package                           2s      1s
#                                       -------  ------
#   gates JOB WALL                      1m 35s  1m 42s   observed GREEN, twice
#   ------------------------------------------------------- tests
#   Install llama-server (pinned, CPU)      1s      1s
#   Run tests (v1)                     10m 59s 11m 13s   3092 passed, 2 failed
#   Run tests (v2)                      3m 47s   3m 54s   21 passed
#                                       -------  ------
#   tests JOB WALL                     15m 15s 15m 37s
#
# `tests/` runtime is the only noisy line — 10m 17s and 11m 13s on two runs of
# the same tree. That is runner variance on a 4-core box, not a signal; size the
# 40-minute timeout against the upper figure, not the lower.
#
# The two jobs run concurrently, so a full run is ~15m 40s of WALL time against
# the old serial 16m 22s, while returning the cheap half TEN times sooner
# (1m 42s). The split costs one extra ~25s install and buys that.
#
# NOTE ON THE `Run tests (v2)` LINE. Its first run on this PR reported `skipped`,
# not a duration, because `tests/` was red and a failing step skips every later
# step by default — so the two-step split had never once delivered the property
# its own comment claimed for it since pgw#808 ("a collection error in either
# must not erase the other's answer"). `if: !cancelled()` at the step is the fix,
# and the 3m 54s / 21 passed above is the proof: same red `tests/`, v2 reported
# anyway.
#
# NO CACHE STEP, deliberately, and this is the one place the tensorhub precedent
# (th#1572) does NOT transfer. There, `setup-go`'s cache key was shared across
# workflows, a cheap sibling won the save, and that job paid a 224s compile every
# run — so two explicit `actions/cache` steps were load-bearing. The Python
# equivalent does not bite: `uv sync --locked --extra dev` is 21 SECONDS cold, on
# a runner with no warm cache at all. An `actions/cache` restore of a uv cache
# large enough to matter would cost more than it saves, and would add a key that
# can go stale against `uv.lock`. If this line ever stops being true, measure the
# install step first — it is step 5 in every run.
#
# ─── NO `paths:` / `paths-ignore:` FILTER ──────────────────────────────────────
#
# The old `paths-ignore: ["**.md"]` is gone, and no `paths:` filter replaces it.
# A path filter is precisely what made proto-contract.yml silently absent from
# #466, and three of the gates below scan the WHOLE TREE:
# `lint_unreached_surface.py` walks the public surface for unreached symbols,
# `lint_config_reads.py` censuses every `os.environ` access against
# `scripts/config_reads_allowlist.txt`, and the gw#666 guards inside the suite
# scan all of `tests/` for fixed-deadline waits. Each is invalidated COLLATERALLY
# — by a change touching none of the files it reads. pgw#949 is exactly that:
# pgw#943 added ONE new test file and broke two guards in a file it never opened.
# Any path filter narrow enough to be useful is the filter that misses these.
#
# A docs-only PR therefore runs the full suite. On an unmetered public repo that
# is the cheaper mistake: "zero checks on this PR" is the state this issue exists
# to make impossible, and a reader cannot tell it apart from "CI is broken".
#
# ─── WHAT THIS GATE DOES NOT CATCH — read this before trusting a green ─────────
#
#   * ANYTHING REQUIRING A GPU. There is no CUDA device on `ubuntu-latest`. Every
#     device path here runs through fakes, skips, or CPU fallbacks. A regression
#     that only manifests on a real card is NOT caught, and green here is not
#     evidence about the fleet. That is the nightly GPU lane's job.
#     native-kernels.yml proves the kernels COMPILE; it never runs one.
#   * LINT. `Lint` is `continue-on-error` (pre-existing debt) — findings are
#     visible in the log and block nothing.
#   * DEPENDENCY-RESOLUTION DRIFT beyond `--locked`. `uv sync --locked` proves the
#     lock is internally consistent, not that its pins are current.
#   * CROSS-REPO CONTRACT DRIFT against tensorhub's canonical proto. That is
#     proto-contract.yml layer 1 here and layer 2 in tensorhub, by design.
#
# The list above used to be the only place a reader could learn what a green run
# did not measure, and it could only ever name CLASSES. pgw#966 makes the actual
# set visible per run: the two pytest steps carry `-rs` (reasons in the log) and
# `--skip-census-out=` (the same set as JSON), and the guard after them refuses
# an unclassified skip and refuses a `CI-MUST-RUN` row that skipped. Read
# `scripts/skip_census.txt` for what is deliberately not measured here and where
# each of those IS measured — starting with: nothing on a GPU is, anywhere.
#
# What it DOES catch is the class that has actually been costing lanes time:
# a behavioural regression in the ~3,000-test suite, and the three tree-scanning
# guards. pgw#950's own lane found a 57-failure regression only by running a
# baseline differential BY HAND against a clean base; mypy, ruff and the three
# script guards would every one of them have passed it. That is why the full
# suite is on the PR trigger and not just the cheap half.
#
# pgw#977 (2026-08-05): `dev` is retired and lanes PR straight to `master`, so
# the trigger names `master` alone. Both jobs here are the master ruleset's
# REQUIRED contexts (`fast gates`, `tests`) — they gate the merge, and unlike
# tensorhub this repo keeps its full suite pre-merge because it is public,
# unmetered, and ~10m rather than ~18m.
# pgw#1209 (2026-08-13): `master` has a MERGE QUEUE. A queued PR is validated on
# a `gh-readonly-queue/master/...` ref carrying master's tip plus every entry
# ahead of it — which is the only place the "two PRs green alone, red together"
# collision is visible. Two lines below are what make that work, and BOTH are
# load-bearing:
#
#   1. `merge_group:` in the trigger list. Without it no run is created on the
#      queue ref at all, the required contexts never report, and the queue sits
#      until `check_response_timeout_minutes` expires and evicts the PR.
#   2. `github.event_name == 'merge_group'` in each job's `if:`. On a merge_group
#      event `github.event.pull_request` is NULL, so the draft guard alone
#      evaluates false and the job SKIPS — and GitHub scores a skipped required
#      check as satisfied. That failure is worse than the first: the queue merges
#      having run nothing, and the PR page shows green.
#
# The trigger is deliberately bare (no `branches:`/`paths:` filter). A filter
# that excludes a merge group is indistinguishable from case 1.
on:
  workflow_dispatch: {}
  merge_group:
  pull_request:
    branches: [master]
    # `ready_for_review` is NOT a default `pull_request` type, and the jobs below
    # skip drafts. Without it listed here a lane that opens a draft, pushes, then
    # clicks "Ready for review" gets NO run for the head it actually merges —
    # the same invisible-green this issue exists to remove.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ~1m35s. Everything decidable without running the suite, so a lane learns
  # about a type error or a guard violation in under two minutes instead of
  # behind an 11-minute pytest run.
  gates:
    name: fast gates
    # `merge_group` is listed FIRST and explicitly: on that event
    # `github.event.pull_request` is null, so the draft clause alone skips the
    # job and GitHub scores the skip as a satisfied required check (pgw#1209).
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # --locked (pgw#524 item 6): resolve exactly what uv.lock pins — the
      # same resolution publish.yml uses on tag push, so PR-CI green
      # actually implies publish green (fails loudly instead if uv.lock
      # drifts from pyproject.toml, the 0.18.0 silent-publish-failure root
      # cause). Both jobs use this exact line; keep them identical.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # GATING (gw#497): the tree is mypy-clean (zeroed 2026-07-11 — the
      # #356-era 88-error debt is gone; no baseline, no continue-on-error).
      # A new mypy error is a new seam: fix it, don't ignore it.
      #
      # pgw#1202: `strict = true` is now the DEFAULT for every module, so a
      # module added tomorrow is born strict. 101 modules carry a named
      # single-flag exemption; the guard below is what stops that list growing.
      #
      # pgw#1202 PR 2: the TEST tree is checked too. Before that it was not
      # merely unchecked — `mypy tests` REFUSED TO START on a duplicate
      # `conftest` module, so 486 test modules had zero static coverage, which
      # is where the doubles that lied about production contracts lived.
      - name: Type check (mypy, strict by default, src + tests)
        run: uv run mypy src/gen_worker tests tests_v2

      # GATING (pgw#1202): `strict = true` cannot silently stop being true, but
      # a per-module exemption list can grow one reasonable-looking name at a
      # time until the gate means nothing. This refuses that mechanically,
      # because the alternative is remembering, and remembering fails.
      - name: pgw#1202 guard - the mypy strictness ratchet only turns one way
        run: uv run python scripts/lint_mypy_ratchet.py

      - name: Lint
        continue-on-error: true  # Lint debt (mostly worker.py, being rewritten) — visible in logs, doesn't block CI.
        run: uv run ruff check src/gen_worker

      # GATING (no continue-on-error): a bare HTTP call site is the gw#456
      # forever-hang reintroduced. hf_hub network use goes through
      # gen_worker.net.hf(); every httpx/requests call carries a timeout.
      - name: HTTP timeout guard (gw#467)
        run: uv run python scripts/lint_http_timeouts.py

      - name: pgw#849 guard 2 - unreached public surface (aot/mint/serve)
        run: uv run python scripts/lint_unreached_surface.py

      # GATING (pgw#931, ruling §1.18): exactly ONE component reads the
      # environment. Every other os.environ access needs a CLASSIFIED line in
      # scripts/config_reads_allowlist.txt. Also proves the loader's
      # unknown-key refusal set still covers the tree (pgw#929).
      - name: pgw#931 guard - config reads outside the pipeline
        run: uv run python scripts/lint_config_reads.py

      # GATING (pgw#1049): exactly ONE authority writes torch settings
      # (`us -> pytorch settings`). Any write outside the authority modules
      # needs a CLASSIFIED line in scripts/settings_writers_allowlist.txt;
      # stale rows are red too.
      - name: pgw#1049 guard - torch-settings writes outside the authority
        run: uv run python scripts/lint_settings_writers.py

      # GATING (pgw#1143, §1.33): `Slot(layouts=...)` is the per-slot layout
      # DEMAND the hub's gate reads. It must be readable by the AST sweep as
      # well as by the import, so a computed declaration is refused where it
      # is written — otherwise the published manifest becomes the only place
      # the demand can be read, which is the dual-declaration hazard.
      - name: pgw#1143 guard - Slot(layouts=) declarations are literals
        run: uv run python scripts/lint_layout_declarations.py

      # GATING (pgw#1143, §1.33 point 5): conversion is UPSTREAM of compute, so
      # no cell-key axis may read the layout demand or a conversion chain — no
      # cell re-keys on a conversion, ever. The fenced module set is DERIVED
      # from who calls a cell-key axis producer, so a new key computation joins
      # the fence without anyone remembering to add it.
      - name: pgw#1143 guard - no cell-key axis reads the layout vocabulary
        run: uv run python scripts/lint_cell_key_layout_fence.py

      # GATING (pgw#1176): THE GUARDS ARE GUARDED. A fence names symbols in
      # string literals; when one is renamed or deleted the fence keeps
      # running, keeps exiting 0, and guards NOTHING — it does not go red, so
      # no amount of running things finds it. Measured: this repo shipped
      # `lint_cell_key_layout_fence.py` naming a deleted symbol, green the
      # whole time. This gate scans ITSELF along with the others, so it is the
      # one guard that cannot rot silently.
      - name: pgw#1176 guard - every symbol a fence names still exists
        run: uv run python scripts/lint_fence_symbols.py

      # GATING (pgw#740 + pgw#1143): the shipped wheel's registries are bare
      # by design and a consumer's declarations populate all six.
      - name: pgw#740 guard - registry contract
        run: uv run python scripts/check_registry_contract.py

      # GATING (pgw#1122): the compute child holds no worker credential BY
      # CONSTRUCTION, so a gate that reads one to answer "who am I?" or "is
      # there a hub?" refuses on every real serving pod (pgw#1108, then
      # pgw#1122 — a dead function, three pods reaped, two replacements
      # bought). Every credential read needs a CLASSIFIED line in
      # scripts/credential_identity_allowlist.txt, and there is no IDENTITY
      # class: identity comes from gen_worker.worker_identity.viewer().
      - name: pgw#1122 guard - worker-credential reads outside the resolver
        run: uv run python scripts/lint_credential_identity.py

      # GATING (pgw#1152): the ADOPT-PATH half of the same class. Four gates in
      # a row — pgw#1108, pgw#1122, pgw#1141, pgw#1141b — were one defect: a
      # rule written against the SELF-MINT path that the boot-adopt path does
      # not take. `aot_serve._KNOWN_AOT_KEYS` had two feeders, both
      # self-produced routes, so a cell that resolved, materialized and armed
      # was scored on the dynamo ledger and thrown away on a real pod. The rule
      # is structural now (registration happens inside `load_and_wrap`), and
      # this fence keeps it: a production feeder off the seam is red, a stale
      # row is red, a SECOND map into a fenced object is red, and a TEST that
      # hand-feeds one or stubs a lane accessor is red — it drives
      # tests/harness/adopt_rig.py instead. There is no CONVENTION class.
      - name: pgw#1152 guard - arm-state feeders and the adopt-path rig
        run: uv run python scripts/lint_arm_state_feeders.py

      # GATING (pgw#1049): the ambient-input census's structural claims —
      # IMPOSED rows exist in DECLARED_ENV, NEUTRALIZED rows are actually
      # scrub-covered, watched env literals in the tree are classified. The
      # completeness half (against the INSTALLED torch) runs in `tests` as
      # tests/test_ambient_census_pgw1049.py.
      - name: pgw#1049 guard - ambient-input census structural claims
        run: uv run python scripts/lint_ambient_census.py

      # GATING (pgw#891/pgw#904): a connected worker may not reconstruct or
      # substitute a Hub decision. The real repair is pgw#891's exact
      # ExecutionSpec and its schema half is th#1457's, so the deletion cannot
      # land yet — this freezes the SIZE of the job so pgw#904 stays a bounded
      # list instead of an open-ended hunt. Fails on ADDITION only.
      - name: pgw#891 guard - the post-connect resolution surface may not grow
        run: uv run python scripts/lint_post_connect_resolution.py

      # GATING (pgw#1013 / th#1662): a length read off external bytes may not
      # size a read until something bounds it. The §4.24 census enumerated the
      # bounds that EXIST, so it could not see a site that needs one and has
      # none — it walked past two real ones in files it had already swept.
      # Either bound the length with a sanctioned validator, or state why it
      # needs none with a `# bound-justified:` comment.
      - name: pgw#1013 guard - an external length sizes a read with no bound
        run: uv run python scripts/lint_unbounded_reads.py

      # GATING (pgw#1010 rider): a changelog fragment whose name does not
      # parse as <prefix><number>.md refuses the RELEASE CUT, which is weeks
      # after the PR that added it and belongs to whoever is cutting rather
      # than whoever wrote it. Three fragments have now landed misnamed
      # (pgw868-a4, pgw984-pgw985, pgw1002-pgw1005) — the failure was always
      # loud, just at the wrong time. Same check, same script, moved to the PR
      # that introduces the name.
      - name: pgw#968 guard - changelog fragment names parse
        run: uv run python scripts/assemble_changelog.py --check

      # Cheap (2s) and it belongs with the gates, not behind the suite: a
      # broken sdist/wheel build is a publish-time failure, and publish.yml
      # gates on a green run of THIS workflow.
      - name: Build package
        run: uv build

  # ~15m15s. The only job that can catch a behavioural regression — see the
  # header on why that is worth a dev trigger rather than master-only.
  tests:
    name: tests
    # `merge_group` is listed FIRST and explicitly: on that event
    # `github.event.pull_request` is null, so the draft clause alone skips the
    # job and GitHub scores the skip as a satisfied required check (pgw#1209).
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Pinned CPU build so the gw#402 llama.cpp runtime tests exercise the
      # real llama-server codepath (tests skip when the binary is absent).
      # Measured 1s on the runner — a ~20 MB tarball fetch, NOT part of what
      # makes this suite expensive, so there is no version of this job worth
      # running without it. Dropping it skips five tests — which, since pgw#966,
      # the census at the end of this job PRINTS and COUNTS rather than swallows.
      #
      # `continue-on-error` (pgw#966): this is the one third party the suite
      # still reaches, and an unreachable third party must degrade to a loud
      # counted skip, never to a red required check. The MODEL those five tests
      # run is no longer fetched at all — it is vendored at
      # tests/testdata/stories260K.gguf, because an `hf_hub_download` here is
      # what put PR #483's tests job red on a `429` from huggingface.co.
      - name: Install llama-server (pinned, CPU)
        continue-on-error: true
        run: |
          curl -sSL --retry 3 -o /tmp/llama.tgz \
            https://github.com/ggml-org/llama.cpp/releases/download/b9964/llama-b9964-bin-ubuntu-x64.tar.gz
          tar xzf /tmp/llama.tgz -C "$HOME"
          echo "$HOME/llama-b9964" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/llama-b9964" >> "$GITHUB_ENV"

      # th#960/pgw#609 greenfield suite (P1-P10 + harness), whole tests/ dir
      # so late additions run automatically without a CI edit.
      #
      # pgw#796: `-n 4` (= ubuntu-latest's vCPU count), `--dist loadfile` so a
      # file's tests — and the module/session fixtures they share — stay in one
      # process. This is TEST-SYSTEM-DESIGN.md §7's wiring, finally landed.
      # `-v` is dropped: xdist's per-worker interleaving makes it unreadable,
      # and failures print in full either way.
      #
      # pgw#966: `-rs` and `--skip-census-out=` are not decoration. Until this
      # issue, a skipped row and a passing row were the same character of
      # nothing in this log, and the pgw#858 container row had been skipping
      # here since it landed — reading as coverage, executing only on developer
      # boxes, which is how the pgw#956 flake reached `dev` behind a green CI.
      # `-rs` puts the reasons in the log for a human; the JSON feeds the guard
      # at the end of this job, which is what makes the NEXT one fail a build.
      - name: Run tests (v1)
        run: uv run pytest tests/ -n 4 --dist loadfile -rs --skip-census-out=.skip-census-v1.json

      # pgw#808: the zero-based suite, as its OWN gate.
      #
      # Both directories run for the whole transition, and the reason is
      # coverage, not caution. `tests_v2/` has 2 of its 14 planned suites
      # (`test_boot`, `test_dispatch`); nine behavior domains — fatal/crash,
      # residency, CAS, lanes, adapters, JIT cells, AOT cells, convert, SDK
      # and telemetry — have ZERO v2 coverage today and `tests/` is their only
      # net. Flipping now would trade a real suite for a partial one.
      #
      # Two steps, not one invocation, deliberately: during a replacement the
      # two suites are two distinct questions ("does the net still hold" /
      # "is the replacement ready"), and a collection error in either must not
      # erase the other's answer. The flip (pgw#808: point CI at `tests_v2/`,
      # `git rm -r tests/`) deletes the step above and this comment with it.
      #
      # pgw#952: `if: !cancelled()` is what makes the paragraph above TRUE. It
      # never was — a failing step skips every later step by default, so a red
      # `tests/` silently erased the `tests_v2/` answer, which is exactly the
      # outcome the two-step split was written to prevent. Observed on this
      # workflow's own PR: `tests/` failed on pgw#949's two guards and
      # `tests_v2/` reported `skipped`, telling a reader nothing about the
      # zero-based suite. `!cancelled()` rather than `always()` so a cancelled
      # run (the concurrency group above cancels superseded pushes) does not
      # spend four more minutes on a result nobody will read.
      - name: Run tests (v2, zero-based — pgw#808)
        if: ${{ !cancelled() }}
        run: uv run pytest tests_v2/ -n 4 --dist loadfile -rs --skip-census-out=.skip-census-v2.json

      # GATING (pgw#966). Two rules: every skip this run took is CLASSIFIED in
      # scripts/skip_census.txt, and no row classified CI-MUST-RUN was among
      # them. The first stops the skip set growing invisibly; the second is the
      # pgw#858 shape stated positively — that row is expected to EXECUTE here,
      # so seeing it skip is a failure and not a note. `!cancelled()` for the
      # same reason as the step above: a red suite must not erase this answer,
      # since a red suite is exactly when the skip set tends to move.
      - name: pgw#966 guard - the skip census
        if: ${{ !cancelled() }}
        run: uv run python scripts/lint_skip_census.py --ci .skip-census-v1.json .skip-census-v2.json
