name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Triggers on v0.2.0, v1.0.0, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read   # Required for checkout on private repos
      id-token: write  # Required for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # --locked (pgw#524 item 6): fail loudly if uv.lock drifts from
      # pyproject.toml instead of silently re-resolving newer dependency
      # versions than what PR CI (ci.yml, also --locked) validated — the
      # 0.18.0 root cause: a tag's publish run resolved different versions
      # than the merged PR did and failed AFTER the tag was already cut.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # mypy already gates ci.yml on every push/PR to master (gw#497); tags are
      # cut from master after CI passes, so re-running it here is redundant.
      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Build package
        run: uv build

      # pgw#740 gate: assert the registry CONTRACT of the artifact we are about
      # to ship — mechanisms work from a clean venv install of the built wheel,
      # bare state matches the documented empty-by-design contract, and a
      # representative consumer's declarations register via the documented
      # load path. The suite imports the source tree; only this step tests the
      # wheel.
      - name: Registry contract on the built wheel (pgw#740)
        run: |
          uv venv --python 3.12 /tmp/wheel-contract
          uv pip install --python /tmp/wheel-contract/bin/python dist/gen_worker-*.whl
          cd /tmp && /tmp/wheel-contract/bin/python "$GITHUB_WORKSPACE/scripts/check_registry_contract.py" --installed

      # pgw#770 gate: the svdq layout fix must be in the ARTIFACT, and CORRECT
      # there. 0.77.0 shipped without `pack_lowrank`/`pack_vector` and the
      # conversion endpoint — which installs the pinned wheel with no source
      # overlay — died on the import; nothing caught it, because the suite
      # imports src/. The wheel is force-installed over the project venv (which
      # already has torch, so the oracle cannot importorskip itself green) and
      # the test runs from a scratch dir, where pyproject's pythonpath=["src"]
      # and tests/conftest.py cannot resolve the checkout instead.
      # test_svdq_official_layout_pgw770.py is the ONLY independent oracle in
      # this area: it asserts our inverses against deepcompressor's forward
      # packers transcribed verbatim. Every other svdq suite is an
      # encoder/decoder round trip that a shared wrong convention passes —
      # which is how the original bug survived a "bit-exact, 4573 tensors"
      # claim that was a name/shape census.
      - name: svdq layout oracle on the built wheel (pgw#770)
        run: |
          uv pip install --python .venv/bin/python --force-reinstall --no-deps dist/gen_worker-*.whl
          mkdir -p /tmp/wheel-svdq
          cp tests/test_svdq_official_layout_pgw770.py /tmp/wheel-svdq/
          cd /tmp/wheel-svdq
          "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/check_svdq_wheel_pgw770.py"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
            test_svdq_official_layout_pgw770.py -v -p no:cacheprovider -o addopts=

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - no token needed
        # Configure at: https://pypi.org/manage/project/gen-worker/settings/publishing/
