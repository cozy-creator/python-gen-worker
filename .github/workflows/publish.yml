name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Triggers on v0.2.0, v1.0.0, etc.
  # MANUAL RECOVERY PATH. The tag push above was this workflow's ONLY trigger,
  # so when GitHub stops delivering tag push events the release lane has no
  # way forward at all — observed 2026-08-03, when v0.91.3 was pushed (and
  # re-pushed, and recreated through the refs API) without a single run being
  # created, while `workflow_dispatch` on ci.yml kept working normally.
  #
  # This is NOT a way around the provenance gate below: a dispatched run
  # asserts the SAME "some green CI run carries this exact tree" property, and
  # refuses identically when it does not. It only restores a way to ASK.
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    # pgw#795: this job had NO timeout, so a hang ran to GitHub's 6-hour cap.
    # It no longer runs the suite, so it should finish in a couple of minutes;
    # this is a hang bound, not a budget for work.
    timeout-minutes: 20
    permissions:
      contents: read   # Required for checkout on private repos
      actions: read    # Required to look up this tree's CI run (below)
      id-token: write  # Required for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # --locked (pgw#524 item 6): fail loudly if uv.lock drifts from
      # pyproject.toml instead of silently re-resolving newer dependency
      # versions than what PR CI (ci.yml, also --locked) validated — the
      # 0.18.0 root cause: a tag's publish run resolved different versions
      # than the merged PR did and failed AFTER the tag was already cut.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # pgw#795 / th#1314: the publish gate asserts PROVENANCE, it does not
      # re-derive it.
      #
      # This step used to be `pytest tests/` — the same suite, on the same tree,
      # with the same `--locked` resolution that ci.yml had already run green.
      # A second identical run cannot produce new information; its only possible
      # novel outcomes are infrastructure flake and timing flake, and it produced
      # three of those in a row for v0.78.0 at ~22 minutes each, on top of a 4.6h
      # scheduling stall, blocking three downstream lanes. So: ci.yml's full
      # suite at -n 4 is THE test gate, and this job runs only what is
      # artifact-facing (build + the pgw#740 wheel contract) once the tree it is
      # about to ship is known to have passed it.
      #
      # STRICT, and deliberately so: an unproven tree REFUSES to publish. It
      # never silently skips testing, because a publish that skips both the
      # suite and the proof is worse than the duplication it replaced.
      - name: Assert this exact tree passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag_sha=$(git rev-parse HEAD)
          tag_tree=$(git rev-parse "HEAD^{tree}")
          echo "publishing $tag_sha (tree $tag_tree)"
          # Trees, not commit SHAs: a release branch, a squash merge and a
          # cherry-pick all produce different commits for identical content, and
          # what CI proved is the CONTENT.
          for sha in $(gh api "repos/$REPO/actions/workflows/ci.yml/runs?per_page=100" \
                        --jq '.workflow_runs[] | select(.conclusion=="success") | .head_sha' \
                       | awk '!seen[$0]++'); do
            tree=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.tree.sha' 2>/dev/null) || continue
            if [ "$tree" = "$tag_tree" ]; then
              echo "PROVEN: green CI run on $sha carries this exact tree"
              exit 0
            fi
          done
          cat >&2 <<EOF
          ::error::No successful CI run carries this tree ($tag_tree).
          This tag's content has never been tested AS TAGGED, so it will not be
          published. Two ways to satisfy it, both one CI run:
            * before tagging: gh workflow run ci.yml --ref <branch-you-will-tag>
              and tag that exact commit once it is green; or
            * after tagging:  gh workflow run ci.yml --ref <this-tag>
              and re-run this publish job once it is green.
          Do NOT relax this check to unblock a release: pgw#795 found that
          v0.78.0 was published from a chaos commit whose tree no CI run had
          ever seen -- the promotion PR tested master plus cherry-picks, which
          is a different tree. That gap is what this step closes.
          EOF
          exit 1

      - name: Build package
        run: uv build

      # pgw#740 gate: assert the registry CONTRACT of the artifact we are about
      # to ship — mechanisms work from a clean venv install of the built wheel,
      # bare state matches the documented empty-by-design contract, and a
      # representative consumer's declarations register via the documented
      # load path. The suite imports the source tree; only this step tests the
      # wheel.
      - name: Registry contract on the built wheel (pgw#740)
        run: |
          uv venv --python 3.12 /tmp/wheel-contract
          uv pip install --python /tmp/wheel-contract/bin/python dist/gen_worker-*.whl
          cd /tmp && /tmp/wheel-contract/bin/python "$GITHUB_WORKSPACE/scripts/check_registry_contract.py" --installed

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - no token needed
        # Configure at: https://pypi.org/manage/project/gen-worker/settings/publishing/
