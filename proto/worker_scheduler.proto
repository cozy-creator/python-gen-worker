syntax = "proto3";

// DESIGN-RULINGS §1.27(b): the MAJOR lives in the package, and therefore in the
// gRPC service path (/cozy.scheduler.v1.WorkerScheduler/Connect). Routing picks
// the contract before a byte of the message body is interpreted, so an
// unsupported major is refused by gRPC itself with UNIMPLEMENTED and serving
// several majors at once is several registrations, not a branch in a handler.
// §1.27(g): the first package is v1 — nothing pre-launch may claim a history it
// does not have. See docs/wire-protocol-versioning.md.
package cozy.scheduler.v1;

option go_package = "github.com/cozy-creator/tensorhub/internal/orchestrator/grpc/pb/schedulerv1;schedulerv1";

// ============================================================================
// Worker <-> Orchestrator wire protocol.
//
// ONE bidi stream: WorkerScheduler.Connect. The worker sends WorkerMessage
// envelopes; the orchestrator sends SchedulerMessage envelopes.
//
// Identity is per CONNECTION: the worker attaches `authorization: Bearer
// <worker JWT>` gRPC metadata when dialing. JWT claims (sub = worker_id,
// release_id) are authoritative; Hello echoes them only for the no-auth dev
// mode and for cross-checking.
//
// Liveness is a 3-layer contract (th#965, CONTRACT.md §3): transport
// keepalive (dead peer), a periodic app-level StateDelta beat emitted from
// the worker's control loop (hung process), and the hub-side obligation
// invariant (loading function with no open activity = stalled).
//
// Fencing is a single `attempt` integer bumped only by the orchestrator.
//
// Full field-by-field semantics: CONTRACT.md next to this file.
//
// CANONICAL COPY (th#1562). This file is the single source of truth for the
// worker<->orchestrator schema. python-gen-worker carries a VENDORED copy at
// proto/worker_scheduler.proto that must stay byte-for-byte identical to this
// one — do not edit it by hand. To change the contract: edit THIS file, then
// run scripts/vendor-proto.sh in python-gen-worker to resync and regenerate.
// scripts/proto-drift-check.sh gates the two copies in both repos' CI.
// ============================================================================

// The major is the package (above). This enum is the SECOND, redundant-by-design
// gate on it: a peer that reached this service path but disagrees about the
// contract is refused with a TYPED reason (protocol_version_mismatch) instead of
// the bare UNIMPLEMENTED routing gives a peer that never reached it at all.
// Redundant is the point — the two failures are distinguishable, and a hub
// operator reading a rejection can tell "dialled the wrong major" from "dialled
// the right major with the wrong build".
//
// Exactly one live major. Hello.protocol_version must equal
// PROTOCOL_VERSION_CURRENT or the orchestrator closes the stream with
// FAILED_PRECONDITION. No minor versions and no negotiation YET — the minor
// field and the overlap arithmetic land with the first major that needs them
// (docs/wire-protocol-versioning.md §3); building them now would be machinery
// with nothing to negotiate.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT     = 1;
}

service WorkerScheduler {
  rpc Connect (stream WorkerMessage) returns (stream SchedulerMessage);
}

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------

message WorkerMessage {
  oneof msg {
    Hello              hello               = 1;
    StateDelta         state_delta         = 2;
    JobAccepted        job_accepted        = 3;
    JobResult          job_result          = 4;
    JobProgress        job_progress        = 5;
    ModelEvent         model_event         = 6;
    FnUnavailable      fn_unavailable      = 7;
    FnDegraded         fn_degraded         = 8;
    ActivityUpdate     activity_update     = 9;
    // gw#619/th#988: sent INSTEAD OF Hello, as the only message on the
    // stream, when the worker's boot-time hardware probe (gen_worker
    // cuda_probe, gw#529) fails. Authenticated identically to Hello (worker
    // JWT in Connect metadata, checked before the first message is read);
    // the worker exits immediately after this send (or after a bounded
    // retry budget if the hub is unreachable/rejects the connection).
    HardwareUnsuitable hardware_unsuitable = 10;
    // th#1085 lifecycle shadow state. GoalReceipt is the typed command
    // receipt edge; LifecycleSnapshot is the full current projection and is
    // also replayed in Hello on every reconnect.
    GoalReceipt        goal_receipt        = 11;
    LifecycleSnapshot  lifecycle_snapshot  = 12;
    // pgw#764/th#1293: per-phase BOOT telemetry. Deliberately NOT an
    // ActivityUpdate kind: every ActivityUpdate folds into the hub's
    // `info.Activities[kind]` map, which the th#965 liveness layers,
    // SelfMintActivityRunning (th#1169 cap turnover) and the stall/condemn
    // sweep all read. A measurement stream must not be able to satisfy or
    // break pod-condemnation logic, and phases carry numbers (duration,
    // bytes) that a text `detail` could only smuggle as JSON.
    BootPhase          boot_phase          = 13;
  }
}

message SchedulerMessage {
  // th#1457/pgw#891's staged dispatch cutover is ABANDONED (th#1842), so the
  // half-landed `RunAttempt run_attempt = 7` that existed only to be switched
  // to is gone. RunJob (field 2) was and remains the live dispatch — nothing
  // ever produced or consumed field 7, so no peer observes this.
  //
  // BOTH markers are required, and the number is the one that matters:
  // §1.27(f) scopes reserved markers to ONE major and this is a WITHIN-major
  // retirement. An unreserved 7 lets the next field added here silently
  // inherit a live wire number — the one failure mode a deletion can leave
  // behind that no test in either repo would see.
  reserved 7;
  reserved "run_attempt";

  oneof msg {
    HelloAck     hello_ack     = 1;
    RunJob       run_job       = 2;
    CancelJob    cancel_job    = 3;
    ModelOp      model_op      = 4;
    Drain        drain         = 5;
    TokenRefresh token_refresh = 6;
    // §4.32 item 4 / th#1808 / pgw#1142: the operator's eager-only command.
    ServePosture serve_posture = 8;
  }
}

// ---------------------------------------------------------------------------
// Connection lifecycle
// ---------------------------------------------------------------------------

// First message on every stream, worker -> orchestrator. Full snapshot of
// static resources, dynamic state, model residency, and in-flight work.
message Hello {
  ProtocolVersion protocol_version = 1;
  string worker_id  = 2; // must equal JWT `sub` when auth is enabled
  string release_id = 3; // must equal JWT `release_id` claim when auth is enabled
  WorkerResources resources = 4;   // static hardware/build identity
  StateDelta      state     = 5;   // initial dynamic state snapshot
  repeated ModelResidency models = 6; // full residency snapshot (reconcile baseline)
  repeated InFlightJob in_flight = 7; // running + completed-with-unshipped-result
  // th#965 layer 2: the worker's promised heartbeat cadence. A worker that
  // declares it MUST re-send StateDelta at least this often in EVERY state
  // (idle, loading, serving, mid-activity); K consecutive misses and the hub
  // declares the worker dead (worker_heartbeat_lost). 0 = no promise: the
  // worker is never heartbeat-reaped (pre-th#965 builds).
  uint64 heartbeat_interval_ms = 8;
  // Stable for one worker process across transport reconnects. The hub
  // echoes it on DesiredStateCommand and rejects cross-session shadow state.
  string worker_session_id = 9;
  // Full current lifecycle shadow projection. Legacy fields above remain
  // authoritative until the later dispatch/remediation cutover.
  LifecycleSnapshot lifecycle_snapshot = 10;
}

// Static per-boot facts. Sent once in Hello; never updated mid-connection.
message WorkerResources {
  int32  gpu_count        = 1;
  int64  vram_total_bytes = 2; // total VRAM across GPUs
  string gpu_name         = 3; // e.g. "NVIDIA GeForce RTX 4090"
  string gpu_sm           = 4; // compute capability, e.g. "89"
  repeated string installed_libs = 5; // e.g. "torchao"
  string image_digest     = 6; // docker image sha256
  string git_commit       = 7;
  string instance_id      = 8; // cloud provider instance id (e.g. runpod pod id)

  // gw#550: one-shot boot host-quality measurement. Zeros = axis not
  // measurable (CPU-only build, probe failure). Additive: old orchestrators
  // ignore it; old workers send it unset.
  HostCanary host_canary  = 9;
  // Exact runtime evidence used to select torch.compile cells. Full version
  // (for example 2.13.0+cu130); consumers compare the major.minor key while
  // artifact metadata remains responsible for stricter compatibility checks.
  string torch_version = 10;
  // gw#587/th#910: this worker's gen-worker library version (for example
  // "0.39.0"). Additive: old workers send it unset; the hub's self-mint cell
  // publish attestation FAILS CLOSED on the gen_worker axis when absent —
  // which is harmless for old workers, because they never call the publish
  // route at all.
  string gen_worker_version = 11;
  // §4.28 / th#1751 W4 + pgw#1092: `worker_mode` is RETIRED with the forge.
  // There is one pod class — a serving pod that mints in the background on a
  // cell miss — so there is no mode to declare. §1.27(f): a within-major
  // retirement reserves the number AND the name. Wheels <= 0.112.0 still SEND
  // field 12; proto3 drops unknown fields at decode, so those workers connect
  // and serve exactly as before.
  reserved 12;
  reserved "worker_mode";
  // th#1798: the HOST's NVIDIA driver version (nvidia-smi/NVML), e.g.
  // "580.159.04". The one fact that decides whether this pod's CUDA line can
  // run at all, and until now the hub only ever saw it on the FAILURE carrier
  // (HardwareUnsuitable) — so a fleet that is fine and a fleet that is one
  // placement-filter bug away from burning launches looked identical from the
  // hub's own data. Read from NVML, not torch: it must be readable exactly
  // when the CUDA runtime is not. Additive: old workers send it unset and the
  // hub records the census verdict as "unknown", never as "fine".
  string driver_version = 13;
}

// Worker -> orchestrator: this worker's boot-time hardware suitability probe
// failed and it is reporting WHY before it exits (gw#619/th#988), instead of
// dying silently pre-hello (the th#986/gw#618 blindness — a pod that never
// says hello left the orchestrator with zero attributable evidence). Sent as
// the ONLY message on a Connect stream, in place of Hello; the orchestrator
// persists it as a pod_events row and closes the stream (no reply message —
// the worker owns exiting on its own timeline after the send completes).
message HardwareUnsuitable {
  string worker_id  = 1; // must equal JWT `sub` when auth is enabled, as Hello
  string release_id = 2; // must equal JWT `release_id` claim when auth is enabled
  // Typed probe-failure class, derived by the worker from its own probe
  // result — never free-form. Vocabulary: torch_unavailable |
  // cuda_unavailable | driver_too_old | cuda_error | unknown.
  string reason_class = 3;
  string detail       = 4; // the probe's raw human-readable reason, verbatim
  // Machine-visible context for reschedule/blacklist decisions. Read
  // independently of a working CUDA runtime (nvidia-smi/NVML, not
  // torch.cuda) so a "driver too old" report still carries real driver/gpu
  // identity — exactly the evidence a broken CUDA runtime cannot self-report.
  string driver_version     = 5; // nvidia-smi/NVML driver version, "" if unread
  string gpu_name           = 6;
  string torch_version      = 7;
  string torch_cuda_version = 8; // torch.version.cuda (the build's CUDA runtime)
  string gen_worker_version = 9;
  string image_digest       = 10; // docker image sha256
  string instance_id        = 11; // cloud provider instance id (e.g. runpod pod id)
  int64  reported_at_unix_ms = 12; // worker clock, informational
}

// Boot host canary (gw#550): the host properties the CPU-bound video tail
// depends on (ie#484: 4-10x decode/encode spread at identical GPU step-ms).
// Measured once per process in a bounded ~1.5 s before the first Hello.
message HostCanary {
  double memcpy_gbps     = 1; // host-RAM copy bandwidth, 256 MiB buffer
  double d2h_gbps        = 2; // pinned device->host PCIe bandwidth
  bool   pinned_alloc_ok = 3; // cudaHostAlloc of the staging buffer worked
  double cpu_single_mbps = 4; // sha256 throughput, one thread
  double cpu_multi_mbps  = 5; // sha256 throughput, min(vcpus,16) threads
  int32  vcpus           = 6; // os.cpu_count() as seen in the container
  double ram_total_gb    = 7; // cgroup-capped host RAM total
  int64  duration_ms     = 8; // canary wall time (self-audit)

  // pgw#748 2-GPU leg. The SKU says SXM; only the pod can say whether ITS
  // cards have peer access, and that is what decides whether a
  // sequence-parallel release meets its latency SLO. Inert on 1-GPU pods
  // (gpu_count<=1 => interconnect "" and peer_gbps 0 = "not measured").
  // Additive: old orchestrators ignore these; old workers send them unset.
  string interconnect  = 9;  // "" | host-staged | pcie-p2p | nvlink
  double peer_gbps     = 10; // measured device->device copy bandwidth
  bool   peer_access   = 11; // cudaDeviceCanAccessPeer(0,1)
  string topo_link     = 12; // raw nvidia-smi topo code (NV18 / PIX / SYS / ...)
}

message ModelResidency {
  string ref = 1;              // canonical model ref string
  ResidencyTier tier = 2;      // highest tier the model currently occupies
  int64 vram_bytes = 3;        // measured footprint; set when tier = VRAM, else 0
  // Exact immutable bytes and the DesiredResidency generation that caused
  // their materialization. Both are legacy residency evidence: older
  // workers leave them zero/empty, which means identity is unknown rather
  // than inferred from the mutable ref.
  string snapshot_digest = 4;
  uint64 residency_generation = 5;
}

enum ResidencyTier {
  RESIDENCY_TIER_UNSPECIFIED = 0;
  RESIDENCY_TIER_DISK        = 1;
  RESIDENCY_TIER_RAM         = 2;
  RESIDENCY_TIER_VRAM        = 3;
}

message InFlightJob {
  string request_id = 1;
  int64  attempt    = 2;
}

// Orchestrator -> worker reply to Hello. Also re-sent mid-connection whenever
// the release config changes (full-replace semantics).
message HelloAck {
  ProtocolVersion protocol_version = 1; // orchestrator's version, for symmetric validation
  string file_base_url = 2;  // tensorhub base URL for capability-token HTTP calls (uploads, blob refs)
  // th#697 precision ladder: per-model flavor resolutions for THIS worker's
  // card. The worker applies each entry to bindings whose wire ref equals
  // `ref` (a bare declared ref): download/load `resolved_ref` and apply the
  // `cast` transform at load. Full-replace with the ack. Additive: old
  // workers ignore it and load their declared bindings.
  repeated ModelResolution resolutions = 3;
  // Legacy full-replace desired model residency for this worker.
  DesiredResidency desired_residency = 4;
  // th#1085 causally identified shadow command. It rides beside
  // DesiredResidency during migration; workers must reject malformed or
  // unsupported mandatory intents instead of silently falling back.
  DesiredStateCommand desired_state_command = 5;
}

// Declarative worker model state. Lists are ordered by orchestrator priority;
// snapshots cover every disk/hot ref the worker may need.
message DesiredResidency {
  uint64 generation = 1;
  repeated string disk_refs = 2;
  repeated DesiredInstance hot = 3;
  map<string, Snapshot> snapshots = 4;
  // th#1087/th#1085: hub-authoritative desired state is the PAIR
  // (release_id, config_generation). config_generation is the release's
  // mutable-config counter — distinct from `generation`, the per-worker
  // transport sequence number above. The worker echoes the config gen it
  // loaded via StateDelta.observed_config_generation.
  string release_id = 5;
  uint64 config_generation = 6;
}

// ---------------------------------------------------------------------------
// Lifecycle shadow state (th#1085)
// ---------------------------------------------------------------------------

// Hub-authored full desired target. During Slice 1 this is observational and
// rides beside DesiredResidency; later slices make it the control authority.
message DesiredStateCommand {
  string worker_session_id = 1;
  uint64 command_seq = 2;
  string goal_id = 3;
  string release_id = 4;
  uint64 config_generation = 5;
  bytes config_digest = 6;
  int64 issued_at_unix_ms = 7;
  int64 accept_by_unix_ms = 8;
  int64 first_action_by_unix_ms = 9;
  repeated DesiredIntent intents = 10;
  bool mandatory = 11;
  // Classes changed since this worker's preceding target. Boot convergence
  // always comes from the pod-launch generation stamp, including first target.
  ConfigClassMask changed_config_classes = 12;
  // Full function -> declared parameter -> value snapshot, encoded as
  // msgpack. Receipt and durable application remain separate worker states.
  bytes parameter_snapshot = 13;
}

message DesiredIntent {
  string intent_id = 1;
  DesiredIntentKind kind = 2;
  DesiredIntentCause cause = 3;
  string function_name = 4;
  string ref = 5;
  bytes snapshot_digest = 6;
  ResidencyTier desired_tier = 7;
  bytes binding_digest = 8;
  string parent_intent_id = 9;
  repeated RequestAttempt waiting_requests = 10;
  int32 priority = 11;
  bool mandatory = 12;
}

message RequestAttempt {
  string request_id = 1;
  int64 attempt = 2;
}

enum DesiredIntentKind {
  DESIRED_INTENT_KIND_UNSPECIFIED = 0;
  DESIRED_INTENT_KIND_MATERIALIZE = 1;
  DESIRED_INTENT_KIND_FUNCTION_READY = 2;
  DESIRED_INTENT_KIND_CONFIG_APPLY = 3;
  DESIRED_INTENT_KIND_COMPILE_ADOPT = 4;
  DESIRED_INTENT_KIND_DRAIN = 5;
}

enum DesiredIntentCause {
  DESIRED_INTENT_CAUSE_UNSPECIFIED = 0;
  DESIRED_INTENT_CAUSE_COLD_BOOT = 1;
  DESIRED_INTENT_CAUSE_REQUEST = 2;
  DESIRED_INTENT_CAUSE_PREPOSITION = 3;
  DESIRED_INTENT_CAUSE_CONFIG_CHANGE = 4;
  DESIRED_INTENT_CAUSE_REPLACEMENT = 5;
  DESIRED_INTENT_CAUSE_RETIRE = 6;
}

message GoalReceipt {
  string worker_session_id = 1;
  uint64 command_seq = 2;
  string goal_id = 3;
  string release_id = 4;
  GoalReceiptStatus status = 5;
  LifecycleErrorCode error_code = 6;
  repeated IntentRejection rejections = 7;
  string detail = 8;
  int64 received_at_unix_ms = 9;
  bytes command_digest = 10;
}

message IntentRejection {
  string intent_id = 1;
  LifecycleErrorCode error_code = 2;
  string detail = 3;
}

enum GoalReceiptStatus {
  GOAL_RECEIPT_STATUS_UNSPECIFIED = 0;
  GOAL_RECEIPT_STATUS_ACCEPTED = 1;
  GOAL_RECEIPT_STATUS_REJECTED = 2;
}

message LifecycleProgress {
  double done = 1;
  double total = 2;
  string unit = 3;
  double rate_per_s = 4;
}

message IntentState {
  string worker_session_id = 1;
  uint64 state_seq = 2;
  string goal_id = 3;
  string intent_id = 4;
  string release_id = 5;
  uint64 config_generation = 6;
  LifecycleIntentStatus status = 7;
  LifecycleIntentStage stage = 8;
  LifecycleWaitReason reason = 9;
  int64 since_unix_ms = 10;
  int64 updated_at_unix_ms = 11;
  int64 next_retry_at_unix_ms = 12;
  int64 deadline_at_unix_ms = 13;
  string blocker_intent_id = 14;
  RequestAttempt blocker_request = 15;
  LifecycleProgress progress = 16;
  LifecycleErrorCode error_code = 17;
  string detail = 18;
  bytes actual_digest = 19;
}

enum LifecycleIntentStatus {
  LIFECYCLE_INTENT_STATUS_UNSPECIFIED = 0;
  LIFECYCLE_INTENT_STATUS_ACCEPTED = 1;
  LIFECYCLE_INTENT_STATUS_WAITING = 2;
  LIFECYCLE_INTENT_STATUS_RUNNING = 3;
  LIFECYCLE_INTENT_STATUS_SUCCEEDED = 4;
  LIFECYCLE_INTENT_STATUS_FAILED = 5;
  LIFECYCLE_INTENT_STATUS_CANCELED = 6;
  LIFECYCLE_INTENT_STATUS_SUPERSEDED = 7;
}

enum LifecycleIntentStage {
  LIFECYCLE_INTENT_STAGE_UNSPECIFIED = 0;
  LIFECYCLE_INTENT_STAGE_VALIDATING = 1;
  LIFECYCLE_INTENT_STAGE_WAIT_TENANT_IDLE = 2;
  LIFECYCLE_INTENT_STAGE_WAIT_REF_LOCK = 3;
  LIFECYCLE_INTENT_STAGE_WAIT_LOAD_LOCK = 4;
  LIFECYCLE_INTENT_STAGE_WAIT_GPU_SLOT = 5;
  LIFECYCLE_INTENT_STAGE_WAIT_SNAPSHOT = 6;
  LIFECYCLE_INTENT_STAGE_WAIT_DISK_HEADROOM = 7;
  LIFECYCLE_INTENT_STAGE_WAIT_HOST_RAM = 8;
  LIFECYCLE_INTENT_STAGE_WAIT_NETWORK_RETRY = 9;
  LIFECYCLE_INTENT_STAGE_WAIT_REPLACEMENT = 10;
  LIFECYCLE_INTENT_STAGE_FETCHING = 11;
  LIFECYCLE_INTENT_STAGE_VERIFYING = 12;
  LIFECYCLE_INTENT_STAGE_ON_DISK = 13;
  LIFECYCLE_INTENT_STAGE_LOADING_HOST = 14;
  LIFECYCLE_INTENT_STAGE_LOADING_DEVICE = 15;
  LIFECYCLE_INTENT_STAGE_WARMING = 16;
  LIFECYCLE_INTENT_STAGE_COMPILING = 17;
  LIFECYCLE_INTENT_STAGE_ADOPTING = 18;
  LIFECYCLE_INTENT_STAGE_CONFIG_MATERIALIZING = 19;
  LIFECYCLE_INTENT_STAGE_CONFIG_BINDINGS_APPLYING = 20;
  LIFECYCLE_INTENT_STAGE_CONFIG_BOOT_STALE = 21;
  LIFECYCLE_INTENT_STAGE_READY = 22;
  LIFECYCLE_INTENT_STAGE_DRAINING = 23;
  LIFECYCLE_INTENT_STAGE_FINALIZING = 24;
  LIFECYCLE_INTENT_STAGE_FLUSHING = 25;
}

enum LifecycleWaitReason {
  LIFECYCLE_WAIT_REASON_UNSPECIFIED = 0;
  LIFECYCLE_WAIT_REASON_TENANT_WORK = 1;
  LIFECYCLE_WAIT_REASON_REF_LOCK = 2;
  LIFECYCLE_WAIT_REASON_LOAD_LOCK = 3;
  LIFECYCLE_WAIT_REASON_GPU_SLOT = 4;
  LIFECYCLE_WAIT_REASON_SNAPSHOT = 5;
  LIFECYCLE_WAIT_REASON_DISK_HEADROOM = 6;
  LIFECYCLE_WAIT_REASON_HOST_RAM = 7;
  LIFECYCLE_WAIT_REASON_NETWORK_RETRY = 8;
  LIFECYCLE_WAIT_REASON_REPLACEMENT = 9;
  LIFECYCLE_WAIT_REASON_SINGLE_FLIGHT_OWNER = 10;
}

enum LifecycleErrorCode {
  LIFECYCLE_ERROR_CODE_UNSPECIFIED = 0;
  LIFECYCLE_ERROR_CODE_MISSING_MANDATORY_FIELD = 1;
  LIFECYCLE_ERROR_CODE_WORKER_SESSION_MISMATCH = 2;
  LIFECYCLE_ERROR_CODE_RELEASE_MISMATCH = 3;
  LIFECYCLE_ERROR_CODE_COMMAND_SEQ_REGRESSION = 4;
  LIFECYCLE_ERROR_CODE_COMMAND_SEQ_CONFLICT = 5;
  LIFECYCLE_ERROR_CODE_CONFIG_REGRESSION = 6;
  LIFECYCLE_ERROR_CODE_UNKNOWN_FUNCTION = 7;
  LIFECYCLE_ERROR_CODE_SNAPSHOT_IDENTITY_MISSING = 8;
  LIFECYCLE_ERROR_CODE_UNSUPPORTED_INTENT = 9;
  LIFECYCLE_ERROR_CODE_UNKNOWN_MANDATORY_COMMAND = 10;
  LIFECYCLE_ERROR_CODE_PROTOCOL_UNREPORTED_WAIT = 11;
  LIFECYCLE_ERROR_CODE_CONFIG_SNAPSHOT_WRITE_FAILED = 12;
  LIFECYCLE_ERROR_CODE_DRAIN_FAILED = 13;
}

message ModelIdentity {
  string ref = 1;
  bytes snapshot_digest = 2;
  ResidencyTier tier = 3;
  uint64 residency_generation = 4;
}

message FunctionCapability {
  string function_name = 1;
  string release_id = 2;
  uint64 config_generation = 3;
  bytes binding_digest = 4;
  string lane = 5;
  repeated ModelIdentity models = 6;
  string compile_target_incarnation_id = 7;
  FunctionCapabilityState state = 8;
  // th#1187/pgw#671 eager-first boot. Execution tier this READY capability
  // serves at: "" (pre-0.65 worker / unknown) | "eager" | "compiled". A TIER
  // FIELD, never a new FunctionCapabilityState value: an unknown enum makes an
  // old hub's switch refuse a genuinely serving worker (starvation), an
  // unknown field is ignored and the old hub dispatches on state=READY exactly
  // as today. The hub validates vocabulary loosely — an unrecognized tier
  // reads as unknown, never as a shadow-state rejection. Flips
  // eager->compiled on hot-swap (own mint arming or peer-cell adoption) with
  // NO state flap; "serving eager while minting" is the hub-derived pair
  // (state=READY, serving_tier=eager, self_mint_compile activity running).
  string serving_tier = 9;
}

enum FunctionCapabilityState {
  FUNCTION_CAPABILITY_STATE_UNSPECIFIED = 0;
  FUNCTION_CAPABILITY_STATE_READY = 1;
  FUNCTION_CAPABILITY_STATE_APPLYING = 2;
  FUNCTION_CAPABILITY_STATE_BOOT_STALE = 3;
  FUNCTION_CAPABILITY_STATE_FAILED = 4;
}

message ConfigClassMask {
  bool parameters = 1;
  bool bindings = 2;
  bool boot = 3;
}

message ConfigApplication {
  string release_id = 1;
  uint64 target_generation = 2;
  uint64 received_generation = 3;
  uint64 parameter_snapshot_generation = 4;
  uint64 binding_ready_generation = 5;
  uint64 boot_generation = 6;
  ConfigApplicationState state = 7;
  ConfigClassMask pending_classes = 8;
  LifecycleErrorCode error_code = 9;
}

enum ConfigApplicationState {
  CONFIG_APPLICATION_STATE_UNSPECIFIED = 0;
  CONFIG_APPLICATION_STATE_APPLYING = 1;
  CONFIG_APPLICATION_STATE_CONVERGED = 2;
  CONFIG_APPLICATION_STATE_BOOT_STALE = 3;
  CONFIG_APPLICATION_STATE_FAILED = 4;
}

message DrainProjection {
  string goal_id = 1;
  string intent_id = 2;
  DrainLifecycleStatus status = 3;
  int64 since_unix_ms = 4;
  int64 updated_at_unix_ms = 5;
  int64 deadline_at_unix_ms = 6;
  LifecycleErrorCode error_code = 7;
  string detail = 8;
}

enum DrainLifecycleStatus {
  DRAIN_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  DRAIN_LIFECYCLE_STATUS_ACCEPTED = 1;
  DRAIN_LIFECYCLE_STATUS_DRAINING = 2;
  DRAIN_LIFECYCLE_STATUS_FINALIZING = 3;
  DRAIN_LIFECYCLE_STATUS_FLUSHING = 4;
  DRAIN_LIFECYCLE_STATUS_DRAINED = 5;
  DRAIN_LIFECYCLE_STATUS_FAILED = 6;
}

message LifecycleSnapshot {
  string worker_session_id = 1;
  uint64 state_seq = 2;
  repeated IntentState intents = 3;
  repeated FunctionCapability capabilities = 4;
  ConfigApplication config_application = 5;
  repeated GoalReceipt goal_receipts = 6;
  DrainProjection drain = 7;
  bool full_replace = 8;
  int64 generated_at_unix_ms = 9;
}

// One complete runnable endpoint instance. `models` is the same complete
// slot-to-ref binding set carried by RunJob.
message DesiredInstance {
  string function_name = 1;
  repeated ModelBinding models = 2;
}

// One precision-ladder resolution (th#697): declared bare ref -> the concrete
// flavored ref (and/or load-time cast) the orchestrator picked for the
// worker's card.
message ModelResolution {
  string ref          = 1; // declared bare ref (canonical grammar, no #flavor)
  string resolved_ref = 2; // concrete ref to download + load (may carry #flavor)
  string cast         = 3; // load-time transform: "" | "fp8"
  // th#913: concrete execution-lane descriptor for this pick (e.g.
  // "fp8-w8a8-dynamic+compiled"). "" = unspecified (worker's own policy,
  // pre-lane behavior). Additive: old workers ignore it.
  string lane         = 4;
  // pgw#714/th#1236: true when `lane` came from an OPERATOR endpoint-pin
  // (precision resolver source=endpoint-pin). A pinned `+eager` execution
  // axis is a compile kill switch on the worker: arming (router,
  // background/foreground self-mint) is suppressed entirely, instead of
  // treating eager as merely the serving tier while a mint runs. Additive.
  bool lane_pinned    = 5;
}

// Worker -> orchestrator dynamic state. FULL-REPLACE snapshot of every field.
// Sent when a field changed (edge-triggered) AND on the periodic heartbeat
// tick (th#965 layer 2): every Hello.heartbeat_interval_ms the worker's
// control loop re-sends the current snapshot even when unchanged — receipt
// is the app-level liveness beat the hub timestamps.
message StateDelta {
  WorkerPhase phase = 1;
  repeated string available_functions = 2; // dispatchable now
  repeated string loading_functions   = 3; // present but models still materializing
  int64 free_vram_bytes = 4; // measured free VRAM; sent on material change
  // Jobs past the decode->finalize handoff (gw#516): GPU slot terminally
  // released, encode/upload tail still running, JobResult not yet shipped.
  // Drain/retire must wait for these — GPU-idle alone is NOT work-idle.
  // Additive: old workers never set it; old orchestrators ignore it.
  int32 finalizing_jobs = 5;
  // Latest desired-residency generation accepted by this worker. This is
  // observation, not convergence; ModelEvent reports best-effort outcomes.
  uint64 observed_residency_generation = 6;
  // Exact READY live pipeline objects eligible for compile-cell adoption/
  // dispatch. Full-replace with every StateDelta; object-level readiness is
  // independent of aggregate phase. A vacated/replaced object disappears
  // before its successor can be addressed.
  repeated CompileTarget compile_targets = 7;
  // th#883 pull-by-key (gw#581): every cell key this worker's runtime could
  // consume right now — candidate keys computed pre-load from endpoint
  // declarations, narrowed to the exact per-target keys once objects are
  // live. Full-replace. Store-lookup hints ONLY (boot attach rides these).
  // §4.28: nothing derives DEMAND from these — there is no mint to order.
  repeated CellLookup cell_lookups = 8;
  // th#962/pgw#610: MEASURED per-tier disk telemetry. Present in every
  // StateDelta (and thus in Hello.state). The hub budgets residency plans
  // against these measured numbers only; release-declared disk sizes are
  // pod-creation priors, never a planning budget.
  DiskUsageReport disk_usage = 9;
  // th#1087/th#1085: the config generation this worker last loaded
  // (DesiredResidency.config_generation echo) — config staleness is
  // per-worker visible state, not inference. Additive: old workers send 0.
  uint64 observed_config_generation = 10;
}

// th#962/pgw#610: storage tiers a worker measures. CONTAINER is the pod-local
// disk holding the CAS root (the only tier residency bytes land on, th#850);
// VOLUME is the attached provider volume used as a fill source; NFS is a
// shared datacenter cache mount when one is present.
enum StorageTier {
  STORAGE_TIER_UNSPECIFIED = 0;
  STORAGE_TIER_CONTAINER   = 1;
  STORAGE_TIER_VOLUME      = 2;
  STORAGE_TIER_NFS         = 3;
}

// One measured mount point (statvfs on the real path, never a declared size).
message StorageTierUsage {
  StorageTier tier  = 1;
  string mount_path = 2;
  int64 total_bytes = 3;
  int64 free_bytes  = 4;
  int64 used_bytes  = 5;
  // Bytes of ref-index entries on this tier that are inactive AND not in the
  // current desired set — exactly the disk-GC LRU's eligible set, i.e. the
  // evictions the hub may cause without touching live or desired work.
  int64 reclaimable_bytes = 6;
}

// Measured disk capacity snapshot. capacity_generation is monotonic within
// one worker process and bumps only when the measured shape materially
// changes (quantized free space, reclaimable set, tier layout). The hub
// clears an insufficient-disk target failure ONLY on an observed EVICTED
// event or a generation change — never merely because it edited desired
// state.
message DiskUsageReport {
  repeated StorageTierUsage tiers = 1;
  uint64 capacity_generation = 2;
}

// One worker-computed cell identity the hub may look up in its store. The
// hub never derives compatibility from it — the worker owns the key (§4.27)
// and the hub answers by key or misses.
message CellLookup {
  string family = 1;
  string cell_key = 2; // "ck1-<sha256hex>", computed by gen_worker.cell_key
}

// One exact live pipeline object. incarnation_id is opaque, worker-minted,
// scoped to the live object/session, and changes on setup/replacement; never
// infer it from family/ref/function.
message CompileTarget {
  string incarnation_id = 1;
  string family = 2;
  // Raw worker runtime vocabulary: "" | "fp8-hooks" | "w8a8", optionally
  // with the declared LoRA bucket suffix. Only compile-cell flavor identity
  // canonicalizes fp8-hooks to the token w8a16.
  string pipeline_weight_lane = 3;
  int32 lora_bucket = 4;
  string contract_digest = 5;
  // Current exact compiled state: empty together for eager/unavailable;
  // nonempty together only after wrap+warmup proof. Mandatory W8A8 dispatch
  // fails closed while these are empty or its exact identity is quarantined.
  string active_compile_ref = 6;
  string active_compile_snapshot_digest = 7;
  // Canonical sorted worker-proven aliases that address this exact target;
  // an omitted alias has no target proof even if it shares endpoint config.
  repeated string function_names = 8;
  // Canonical sorted exact immutable load-time bindings owned by this target.
  // This may be a strict subset of the function's/RunJob's setup bindings.
  repeated CompileTargetBinding model_bindings = 9;
  // th#883 pull-by-key (gw#581): the exact cell key this live object's
  // runtime computed for itself (gen_worker.cell_key — the ONE compatibility
  // brain). The hub serves a stored cell by this key or misses; it never
  // derives compatibility hub-side. Empty when the runtime cannot state a
  // required axis.
  string requested_cell_key = 10;
  // §4.28 / th#1751 W4 + pgw#1092: `requested_cell_axes` is RETIRED. Its ONLY
  // stated purpose was "forge mint parameters (SKU pin, torch, image digest)",
  // and there is no forge to parameterize; the hub has never read it
  // (compile_cache_delivery.go IGNORES it) and pgw has had no producer since
  // pgw#1032. §1.27(f): number and name both reserved. Wheels <= 0.112.0 may
  // still send field 11 and proto3 drops it at decode.
  reserved 11;
  reserved "requested_cell_axes";
}

message CompileTargetBinding {
  string slot = 1;
  string ref = 2;
  string snapshot_digest = 3;
}

enum WorkerPhase {
  WORKER_PHASE_UNSPECIFIED        = 0;
  WORKER_PHASE_BOOTING            = 1;
  WORKER_PHASE_DOWNLOADING_MODELS = 2;
  WORKER_PHASE_LOADING_PIPELINES  = 3;
  WORKER_PHASE_WARMING            = 4; // torch.compile graph capture / cache warmup
  WORKER_PHASE_READY              = 5;
  WORKER_PHASE_ERROR              = 6;
}

// ---------------------------------------------------------------------------
// Jobs
// ---------------------------------------------------------------------------

// Orchestrator -> worker job dispatch. Retransmitted (same attempt) until the
// worker answers with JobAccepted or a JobResult.
message RunJob {
  string request_id = 1;
  int64  attempt    = 2; // fencing token; bumped by the orchestrator on every (re)queue
  string function_name = 3;
  bytes  input_payload = 4; // canonical MessagePack input; stored Asset refs remain opaque
  int64  timeout_ms = 5;    // execution deadline; 0 = no explicit timeout
  string org     = 6;    // canonical UUID of the org that owns job outputs
  string invoker_id = 7;    // surfaced read-only as ctx.invoker_id
  string capability_token = 8; // per-job worker capability token for tensorhub HTTP calls
  OutputMode output_mode = 9;  // client's inline-vs-url preference for media outputs
  ResolvedCompute compute = 10;
  repeated ModelBinding models = 11; // slot -> ref bindings resolved by the orchestrator
  // Presigned snapshots keyed by canonical ref. Ordinary warm-local bindings
  // may be omitted; required_compile retains every exact model digest plus the
  // selected cell so the worker can revalidate immutable execution identity.
  map<string, Snapshot> snapshots = 12;
  // Unique exact current-state fence selected by Tensorhub. Multiple
  // applicable targets fail closed. Mandatory for W8A8; when present on any
  // lane the worker validates before setup/mutation and
  // immediately before execution so replacement or causal runtime revocation
  // returns typed RETRYABLE without GPU work.
  RequiredCompileExecution required_compile = 13;
  // th#913/gw#596: hub-resolved execution lane for THIS request — a concrete
  // descriptor ("fp8-w8a8-dynamic+compiled") or a coarse family
  // ("bf16"|"fp8"|"4bit") the worker expands via its ladder twin. "" = no
  // instruction (worker's own policy). A worker that cannot serve the named
  // lane answers a typed refusal naming it — never a silent fallback.
  string lane = 14;
  // Ordered, credential-free stored inputs authorized at submit. The worker
  // resolves fresh transport URLs for the exact request+attempt capability.
  repeated InputAsset input_assets = 15;
  // th#1087: the config generation this job was dispatched at. In-flight
  // jobs finish on their dispatched generation; a gen bump never rewrites
  // a running job.
  uint64 config_generation = 16;
  // th#1087 class 1: effective declared-parameter values for THIS function,
  // msgpack map name -> value. Surfaced read-only as ctx.config; workers
  // never cache them.
  bytes config_params = 17;
}

message InputAsset {
  string asset_id = 1;
  string source_ref = 2;
  string blake3 = 3;
  int64 size_bytes = 4;
  string kind = 5;
  string mime_type = 6;
}

message RequiredCompileExecution {
  string target_incarnation_id = 1;
  string cell_ref = 2;
  string cell_snapshot_digest = 3;
  string contract_digest = 4;
}

enum OutputMode {
  OUTPUT_MODE_UNSPECIFIED = 0;
  OUTPUT_MODE_URL         = 1; // upload media, return refs (default behavior)
  OUTPUT_MODE_INLINE      = 2; // small outputs inline in the result payload
}

// Resolved hardware for this invocation: accelerator gates the worker's GPU
// semaphore; gpu_index binds the CUDA context. pgw#526 cut gpu_count/vram_gb
// (and the ctx.compute org surface they fed): documented and plumbed
// through every dispatch, read by zero endpoints. Reserved so the numbers
// can't come back with different semantics.
message ResolvedCompute {
  string accelerator = 1; // "cuda" | "none"
  int32  gpu_index   = 2; // 0-based GPU ordinal picked by the per-GPU slot scheduler
}

message ModelBinding {
  string slot = 1; // model slot name declared by the endpoint
  string ref  = 2; // canonical ref string (tag/flavor/digest encoded in the ref grammar)
  // Per-request LoRA overlays riding this slot's base model (gw#393 BYOM).
  // Applied as unfused named adapters for the duration of the job and
  // removed after. Overlay refs are ordinary tensorhub-CAS refs — the hub
  // resolves them and attaches presigned snapshots in RunJob.snapshots;
  // workers never fetch upstream. Additive: old workers ignore this field.
  repeated LoraOverlay loras = 3;
  // th#767: the resolved repo's family-typed inference defaults/constraints,
  // JSON-encoded ("" = none set). Schema is per-family and versioned
  // hub-side (internal/modelfamily/inferencedefaults); pgw#520 CONTRACT.md
  // documents this exact field name for the SDK's resolution chain
  // (precedence: explicit payload value > this > endpoint fallback preset).
  // Additive: old workers ignore this field.
  string inference_defaults = 4;
  // th#980 hierarchical slots: per-component repo substitutions on the base
  // composition, component name -> canonical tensorhub ref (normal form,
  // same grammar as `ref`). The worker loads the base composition then
  // substitutes each named component from its materialized snapshot (pgw
  // companion issue). Snapshots for these refs ride RunJob.snapshots /
  // DesiredResidency exactly like base refs. Additive: old workers ignore.
  map<string, string> components = 5;
  // th#1139 (pgw#654) objective split, retiring th#1017's never-landed regime
  // field: the resolved checkpoint's stamped serving facts. objective is the
  // training objective ("epsilon" | "v_prediction" | "flow"; "" =
  // unclassified/unstamped); distilled is the orthogonal post-training value.
  // distilled_status preserves whether false is evidenced or merely the wire
  // default ("classified" | "unclassified" | "inconclusive"). Populated at dispatch from the hub's catalog
  // stamp — the SDK's scheduler construction reads them. The SDK applies the
  // objective to the per-request scheduler view and enforces the per-function
  // @worker_function declaration as a backstop; the hub gates compatibility
  // upstream. Additive.
  string objective = 6;
  bool   distilled = 7;
  string distilled_status = 8;
}

// One LoRA adapter overlay: a resolved tensorhub ref + its adapter weight.
message LoraOverlay {
  string ref    = 1; // canonical tensorhub ref of the adapter snapshot
  double weight = 2; // adapter scale; hub validates to [-4, 4], worker mirror-checks
  // th#767b / pgw#516: THIS LoRA's own family-typed inference-defaults/
  // recipe-opinion object, JSON-encoded ("" = none set) — an instance of
  // the family's LORA-kind vocabulary struct (gen_worker.families
  // `@family(name, kind="lora")`, validated hub-side against
  // `<root>.lora.schema.json`, internal/modelfamily/inferencedefaults).
  // Consumer: the SDK's `ctx.slots[slot].defaults` resolution chain applies
  // this object's non-null fields as FIELD-LEVEL overrides on the
  // checkpoint's resolved recipe, in lora order (later loras win on a
  // shared field) — NOT the whole-object repo-metadata-over-fallback
  // precedence `ModelBinding.inference_defaults` uses. Additive: old
  // workers ignore this field.
  string inference_defaults = 3;
}

// A pinned tensorhub repo snapshot with presigned download URLs. The worker
// never calls tensorhub for ref resolution; the orchestrator is the only
// resolver and ships snapshots on DesiredResidency / RunJob.
message Snapshot {
  string digest = 1; // snapshot digest the download is pinned to
  repeated SnapshotFile files = 2;
}

message SnapshotFile {
  string path       = 1;
  int64  size_bytes = 2;
  string blake3     = 3; // LEGACY (th#1303): bare blake3 hex. Deleted at phase 4.
  string url        = 4; // presigned GET for the whole file

  // th#1303 manifest v2, ADDITIVE. A v2 snapshot carries `digest` (always
  // algorithm-tagged, e.g. "sha256:<hex>") and, for files larger than
  // chunk_size_bytes, an ORDERED chunk list. `blake3`+`url` continue to
  // carry legacy snapshots for the whole dual-read window.
  //
  // For a WHOLE file (size <= chunk_size_bytes) `digest` is the CAS key and
  // the store enforced it at write time. For a CHUNKED file `digest` is the
  // WHOLE-FILE sha256 — metadata, deliberately not store-enforced — which
  // the worker verifies for free in the same pass that reassembles the
  // chunks. The chunk digests are the store-enforced keys.
  //
  // A chunked snapshot is only dispatchable to a worker that understands it;
  // that is gated by the th#1282 supported-version floor, not by a parallel
  // capability flag.
  string digest            = 5;
  int64  chunk_size_bytes  = 6;
  repeated ChunkRef chunks = 7;
}

// ChunkRef is one CAS object of a chunked file. sha256 is BARE lowercase hex
// (the algorithm is fixed by schema). len is carried explicitly so the
// cumulative offset of every chunk is readable without knowing the chunking
// policy — which is what makes "file byte range X..Y" map to exactly one
// (chunk index, offset) pair.
message ChunkRef {
  string sha256 = 1;
  string url    = 2; // presigned GET for this chunk
  int64  len    = 3;
}

// ===========================================================================
// th#1457 / pgw#891 — the ExecutionSpec surface: DELETED (th#1842, 2026-08-13).
//
// `SchedulerMessage.run_attempt` was the only thing that ever referenced it,
// and the staged dispatch cutover it was landed for is ABANDONED — th#1834
// Phase 2 replaced its role with per-entry batch resolve, and PR #1107 already
// deleted the hub-side arm authority that was to consume it. The field is gone
// and tag 7 is reserved above; these 24 declarations went with it in the SAME
// cut rather than a later one, because the file is vendored byte-for-byte by
// python-gen-worker and a second deletion would cost a second lockstep window
// for zero additional benefit.
//
// Deleted: RunAttempt, AttemptId, ExecutionSpec, EndpointRelease, Attribution,
// ExecutionLane, Arm, ArtifactIdentity, Topology, ComponentManifest,
// SlotBinding, ComponentRef, AdapterBinding, ConfigSnapshot,
// ContractIdentities, ExplorationRef, InputAssetRef, DeliveryGrant,
// PresignedSnapshot, PresignedFile, PresignedAsset, and the three enums no
// surviving field names (WeightLane, ArmShape, SteadyBackend). No `reserved`
// markers: reservation protects FIELD NUMBERS inside a live message, and a
// deleted top-level type has none to protect — the tag that needed protecting
// is `SchedulerMessage`'s 7, and it has it.
//
// TH#1457'S SCHEMA RULINGS RETIRE WITH THE SURFACE THEY RULED ON, and that is
// deliberate rather than incidental. They were: every URL and token lives in
// DeliveryGrant so grant rotation cannot move the execution digest; and there
// is NO duration field anywhere in the attempt, because a wall clock cannot
// distinguish a slow-but-advancing attempt from a wedged one (§4.24, the
// standing no-magic-timeouts rule, pgw#933). The second is NOT retired as a
// rule — it is the standing rule, it simply no longer has this schema to be
// enforced against, and `executionspec_schema_th1457_test.go` was deleted with
// its subject. Whoever next designs a dispatch message inherits both.
// ===========================================================================


// Worker -> orchestrator: dispatch acknowledged; the worker now owns
// (request_id, attempt). Stops orchestrator retransmission.
message JobAccepted {
  string request_id = 1;
  int64  attempt    = 2;
}

// Worker -> orchestrator terminal outcome. Exactly one per accepted
// (request_id, attempt). Never dropped: buffered and resent across reconnects.
message JobResult {
  string request_id = 1;
  int64  attempt    = 2;
  JobStatus status  = 3;
  // Result payload (MessagePack-encoded output struct) when status = OK.
  // Inline when small; blob_ref (uploaded via presigned PUT) above the
  // inline threshold (~64KB).
  oneof output {
    bytes  inline   = 4;
    string blob_ref = 5;
  }
  string safe_message = 6; // sanitized client-facing error text; empty when OK
  JobMetrics metrics = 7;
  // th#1139 (pgw#654): caller-visible adjustments the worker's merge/clamp
  // layer made to requested values — every divergence between a requested and
  // a served value (clamp, substitution, injection), e.g. "guidance clamped
  // 15->10 (model maximum)". The hub persists them on the request record,
  // exposes them on the request read API, and emits them on the request events
  // stream at result ingest — pod logs alone never reach the caller.
  // Adjustments warn-and-serve; catalog-LOCKED recipe fields refuse typed
  // upstream instead.
  repeated Adjustment adjustments = 8;
}

// One caller-visible adjustment: the worker served the request but modified
// a requested value. requested/applied are rendered strings (the field's
// JSON-ish spelling), reason is a short human-readable cause.
message Adjustment {
  string field     = 1;
  string requested = 2;
  string applied   = 3;
  string reason    = 4;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_OK          = 1;
  JOB_STATUS_INVALID     = 2; // bad input; never retry
  JOB_STATUS_RETRYABLE   = 3; // transient; orchestrator may requeue (bumping attempt)
  JOB_STATUS_FATAL       = 4; // permanent execution failure; do not retry
  JOB_STATUS_CANCELED    = 5; // terminal ack of CancelJob (or local deadline abort)
}

// The one metrics vehicle. Worker-observed values only; the orchestrator
// enriches with its own state (release, function, machine class) off-wire.
message JobMetrics {
  int64 runtime_ms     = 1; // handler start -> handler completion
  int64 queue_ms       = 2; // worker-local queue wait before start
  // Host RSS sampled at job completion (NOT a per-job peak: the OS gives no
  // per-process peak-RSS reset, so this is an honest instantaneous reading,
  // not a high-water mark — pgw#513). 0 = unmeasured.
  int64 rss_at_end_bytes = 3;
  // Peak VRAM during execution. torch.cuda.reset_peak_memory_stats() runs at
  // handler start (GPU jobs serialize under the worker's GPU semaphore, so
  // this IS a true per-job peak — pgw#513). 0 = unmeasured.
  int64 peak_vram_bytes = 4;
  int32 concurrency_at_start = 5; // jobs already active on the worker at admit
  // Summed MEDIA seconds of the media assets in the job's output (e.g.
  // VideoAsset.duration_s probed at save time). 0 = no media duration
  // reported. The ONLY billing source for per_output_second settlement
  // (th#572) — settlement must fail closed rather than fall back to
  // runtime_ms wall-clock.
  double output_media_duration_s = 6;
  // Typed billing usage (pgw#512) — the ONLY settlement source for
  // per_million_tokens/per_output pricing. Settlement must read these, never
  // scavenge the (possibly blob-ref'd, org-controlled) result payload.
  int64 input_tokens = 7;
  int64 input_cached_tokens = 8;
  int64 output_tokens = 9;
  int64 output_count = 10; // count of generated output Assets (images/videos/audios/files)
  // gw#516 pipelined finalize split of runtime_ms. slot_held_ms is how long
  // the job actually held the GPU slot (acquire -> terminal release);
  // finalize_wall_ms is the slotless encode/upload tail that overlapped the
  // next request's compute. slot_held_ms + finalize_wall_ms ~= runtime_ms
  // for GPU jobs. Both 0 = unmeasured (CPU job, or a pre-gw#516 worker).
  int64 slot_held_ms = 11;
  int64 finalize_wall_ms = 12;
  // th#913/gw#596: the CONCRETE lane that actually served this request
  // (e.g. "fp8-w8a8-dynamic+compiled"). "" = unmeasured (pre-lane worker).
  string lane = 13;
  // th#1051: the declared runtime formula's term feature values, evaluated
  // worker-side on the EXECUTED payload (defaults applied), keyed by
  // canonical term key (e.g. "num_inference_steps", "1"). Empty = no
  // declared formula (or a pre-formula worker) — the hub falls back to
  // evaluating terms from the raw payload + schema defaults.
  map<string, double> runtime_terms = 14;
  // th#1111: per-stage wall-clock breakdown of this request, in ms. Empty =
  // pre-th#1111 worker. Vocabulary (see gen_worker/stage_timing.py):
  //   measured stages   input_fetch, text_encode, denoise, refine,
  //                     vae_decode, image_encode, video_encode,
  //                     credential_stamp, upload, ... (endpoint brackets add
  //                     their own names via ctx.stage("name"))
  //   gpu_permit_wait   time waiting for the worker's GPU permit — the one
  //                     stage OUTSIDE runtime_ms (it precedes handler start)
  //   total.handler     == runtime_ms; the reconciliation anchor
  //   total.prep        handler start -> first denoise step
  //   total.tail        last denoise step -> handler end
  //   total.denoise     sum of the denoise-family stages
  //   class.gpu_busy    device computing / class.small_gpu / class.gpu_idle /
  //                     class.unattributed — the per-request hot-fraction
  //                     numerator is class.gpu_busy over total.handler
  //   resid.prep        prep/tail time no stage explained (for images the
  //   resid.tail        tail residual is essentially the VAE decode)
  //   resid.unattributed  handler time no stage explained
  //   resid.overlap     stages summed PAST wall clock (concurrent uploads)
  //   flag.*            0/1 booleans (flag.denoise_estimated = the denoise
  //                     window came from step marks, not an explicit bracket)
  // Invariant: measured stages + resid.unattributed == total.handler.
  map<string, int64> stage_ms = 15;
  // pgw#764/th#1293: the DIMENSIONS that make per-request latency comparable
  // across serving paths. `lane` (13) already says "fp8-w8a8-dynamic+compiled",
  // but "+compiled" is a BINARY axis platform-wide (precision.ExecCompiled /
  // lanes.EXEC_COMPILED / serving_tier): it cannot tell an AOT .pt2 replay
  // from a JIT dynamo cell, and it names no artifact. So "AOT vs JIT latency
  // on 4090s for sdxl w8a8" is unanswerable over our own production traffic
  // even though the worker knows the answer for every single request.
  //
  //   serving_mode: "eager" | "jit_cell" | "aot_cell"
  // Derived from the ARMED artifact, not from the lane string.
  string serving_mode = 16;
  // The cell ref/key that actually served, echoed back from the worker.
  // resolved_models.runtime.compile_cell_ref is the hub's dispatch INTENT and
  // is only set when RunJob.required_compile was; this is the confirmation.
  string served_cell_ref = 17;
  // TRUE when a compiled lane served THIS request eager anyway — a pgw#680
  // guard miss, a router heal/volatile verdict, or an aot_serve ingress
  // refusal. Today such a request reports lane=...+compiled, so the fallback
  // is invisible per-request and silently contaminates any compiled-vs-eager
  // latency comparison with eager samples. The fallback reason class rides
  // `fallback_reason` (guard_miss | ingress_refused | healing | volatile).
  bool   served_eager_fallback = 18;
  string fallback_reason = 19;
  // Device compute capability ("89"), matching WorkerResources.gpu_sm. The
  // SKU string is a marketing name; sm is the fact cells are keyed by, and it
  // is never persisted anywhere today.
  string sm = 20;
  // The executed shape coordinate + step count, defaults APPLIED — the axes
  // latency is a function of. runtime_terms (14) carries these only when the
  // endpoint declares a runtime formula, and the hub drops that map after
  // scaling reads it. width/height are 0 for non-spatial functions.
  int64  steps = 21;
  int64  width = 22;
  int64  height = 23;
  // th#1871 P1 (pgw#1225): the POSTURE this request was served under — the
  // conditions that decide whether two measurements of the same (release,
  // function, GPU, lane) may be compared at all. Absent = a worker that does
  // not report it, which is NOT the same as a clean posture and must never be
  // reduced as one (DESIGN-RULINGS §1.36; the ie#707 trap).
  MeasuredPosture posture = 24;
}

// th#1871 P1 — what the worker ACTUALLY did, typed. Mirrors
// internal/orchestrator/measurement.Posture field-for-field on purpose: the
// hub's Digest() is the ONE identity implementation, so the wire must need no
// translation layer to reach it. The digest is never computed worker-side.
//
// NOT named ServePosture: that message already exists below and is the
// hub -> worker operator eager-only COMMAND (§4.32). Two different objects
// under one name is how a vocabulary forks.
message MeasuredPosture {
  // The lane as RESOLVED, full descriptor. Redundant with JobMetrics.lane and
  // carried anyway: the posture is a self-contained record, and a reader that
  // has to reach outside it to know what it describes will eventually reach
  // wrong.
  string execution_lane = 1;
  // What the attention kernel ACTUALLY was (fa3 | fa2 | sdpa | xformers |
  // eager) and what was ASKED FOR. Unequal = the ie#707 degradation, silent
  // until this field existed. Empty wanted = nothing was asked on this axis,
  // which is different from asking for what you got.
  string attention_backend = 2;
  string attention_backend_wanted = 3;
  // compiled | eager, and what the lane DECLARED. The APPLIED state is not an
  // identity axis (§1.30: compile is a cache question over (execution, GPU));
  // the MISMATCH is.
  string compile_state = 4;
  string compile_state_wanted = 5;
  // Which residency rung actually ran: all_resident, or a rung that had to
  // move something off the card. UNSTATED is unknown, never "fine".
  string residency_mode = 6;
  // ORDERED — the order the worker reached for them is itself a fact about the
  // run (group_offload AFTER model_offload failed, not instead of it). Never
  // collapsed onto one token: the retired FnDegraded.ran projected
  // model_offload/group_offload/sequential onto "offload", so a 2.5x, a 3.0x
  // and a 4.0x degradation were indistinguishable.
  repeated AppliedTechnique applied = 7;
  // Per component. Unordered on the wire; the hub sorts before digesting, so a
  // worker enumerating its pipeline differently is the same posture.
  repeated ComponentPosture components = 8;
  // The quantified WHY. "Insufficient VRAM" is the old vocabulary; needed N,
  // had M, short by N-M for component X is the diagnostic (§1.36 amendment).
  ResourceShortfall shortfall = 9;
}

// One low-VRAM or compatibility lever the worker reached for.
message AppliedTechnique {
  // The lever, from the SDK's own rung vocabulary: fp8_storage, model_offload,
  // group_offload, sequential, cpu, vae_tiling, vae_slicing,
  // attention_slicing, disk_offload, attention_fallback.
  string name = 1;
  // What it was applied to ("transformer", "vae"; empty = whole pipeline).
  string component = 2;
  // What was ASKED FOR on this lever's axis, when anything was. Empty means
  // the lever was FORCED — a degradation, but not a mismatch: a mismatch
  // requires a stated expectation to violate.
  string wanted = 3;
  // Short machine-readable cause (vram_shortfall, kernel_unavailable), never
  // prose.
  string reason = 4;
  // The worker's own multiplier for this lever (2.5 = 2.5x slower). 0 =
  // unknown, never assumed 1. EXCLUDED from the digest: it is an estimate of
  // the lever, not a property of the run.
  double est_slowdown = 5;
}

// What one component ended up as. "The transformer is offloaded" is
// actionable; "the pipeline is degraded" is not.
message ComponentPosture {
  string component = 1;
  // What the weights were actually LOADED as, and what the lane BOUND. The
  // live fleet reports `applied=fp8-w8a8-dynamic ... bound=bf16-w16a16` today
  // — in prose, on a channel nothing reads.
  string applied_quant = 2;
  string bound_quant = 3;
  // resident | offloaded | cpu | disk.
  string placement = 4;
  // Reported, never keyed: a component whose footprint moved by a megabyte
  // between runs is the same posture.
  int64 bytes = 5;
}

// The typed shortfall. Magnitudes are DATA, not identity — two runs short by
// 6.1 and 6.3 GiB that reached for the same levers are one cell with two
// samples, not two cells with one each.
//
// Deliberately absent: any suggestion of a better card. The worker knows what
// it was short by; only the hub knows the catalog and the prices, so only the
// hub can name a better pair (§1.36 amendment, clause 3).
message ResourceShortfall {
  string resource = 1;   // vram | host_ram | disk
  string component = 2;
  int64 needed_bytes = 3;
  int64 available_bytes = 4;
}

// Worker -> orchestrator streaming output chunk. Ordered per (request_id,
// attempt); fanned out to attached SSE/wait subscribers, never persisted.
message JobProgress {
  string request_id = 1;
  int64  attempt    = 2;
  int64  seq        = 3; // starts at 1, strictly increasing per (request_id, attempt)
  bytes  data       = 4; // chunk bytes: UTF-8 text delta, JSON delta, or raw audio
  string content_type = 5; // e.g. "text/plain", "application/json", "audio/pcm;rate=24000"
}

// Orchestrator -> worker: abort (request_id, attempt). Worker answers with
// JobResult{status: CANCELED} (or the natural terminal result if it raced).
message CancelJob {
  string request_id = 1;
  int64  attempt    = 2;
}

// ---------------------------------------------------------------------------
// Models
// ---------------------------------------------------------------------------

// Orchestrator -> worker compile-cache adoption command. Ordinary model
// residency is declared through HelloAck.desired_residency.
message ModelOp {
  ModelOpKind op = 1;
  string ref = 2;
  // Presigned compile-cache snapshot.
  Snapshot snapshot = 3;
  // Orchestrator-minted causal identity for one hot-adoption attempt. Workers
  // echo it on its ADOPTED/adopt-FAILED terminal and retain it for at most one
  // later causal compiled-runtime FAILED. It is deliberately distinct from
  // the snapshot digest: retries may target identical bytes.
  string operation_id = 4;
  // Exact READY CompileTarget to mutate. Required for ADOPT_COMPILE_CACHE;
  // family/ref fallback is forbidden.
  string target_incarnation_id = 5;
}

enum ModelOpKind {
  MODEL_OP_KIND_UNSPECIFIED = 0;
  // Hot-adopt a torch.compile cache artifact: ref is a compile-cache flavor
  // ref (`root/family-<f>#inductor-<sku>-torch<maj.min>`). The worker
  // downloads+verifies+seeds the cache, re-wraps the already-resident modules
  // of endpoints declaring compile family <f>, runs one warmup trace, and
  // answers ModelEvent{ADOPTED, duration_ms}. ANY failure => stay eager and
  // answer ModelEvent{FAILED, error:"adopt_failed:<reason>"}. Sent only to
  // job-idle workers. Workers predating this kind ignore it silently (no
  // ModelEvent), which the orchestrator treats as not-adopted.
  MODEL_OP_KIND_ADOPT_COMPILE_CACHE = 1;
}

// Worker -> orchestrator model residency transition. The single channel for
// download progress, load/unload outcomes, VRAM footprints, and evictions —
// whether triggered by desired reconciliation, compile-cache adoption, or the
// worker's own cache policy.
message ModelEvent {
  string ref = 1;
  ModelState state = 2;
  int64 vram_bytes = 3;  // measured VRAM footprint; set when state = IN_VRAM
  string error = 4;      // set when FAILED (e.g. "oom", "url_expired", initial "adopt_failed:<reason>", later causal "adopt_failed:runtime_guard")
  int64 bytes_done = 5;  // download progress; set while state = DOWNLOADING
  int64 bytes_total = 6; // set while state = DOWNLOADING (0 = unknown)
  int64 duration_ms = 7; // op wall time; set when state = ADOPTED
  // Adoption observability (gw#391), set when state = ADOPTED for inductor
  // cells: FX-graph cache hits/misses observed during the adoption warmup and
  // the warmup wall seconds. A warmup observing ZERO hits never reports
  // ADOPTED - it rolls back to eager and reports adopt_failed:cache_miss; an
  // endpoint without warmup() cannot prove the cell and reports
  // adopt_failed:no_warmup. hits>0 with misses>0 = partial shape coverage.
  int64 cache_hits = 8;
  int64 cache_misses = 9;
  double warmup_s = 10;
  // Typed host-RAM admission evidence (pgw#548). Set on
  // FAILED{error:"insufficient_host_ram"} and HOST_CAPACITY_PROGRESS only.
  // A progress event's generation is strictly newer than the matching
  // failure, and available_after_bytes satisfies required_bytes. The worker
  // emits progress only after an observed owner/pin release increased
  // measured headroom; elapsed time alone never produces this event.
  int64 host_ram_required_bytes = 11;
  int64 host_ram_available_before_bytes = 12;
  int64 host_ram_available_after_bytes = 13;
  repeated string host_ram_evicted_refs = 14;
  // Monotonic only within one worker process. Consumers fence within the
  // active Connect stream and reset that fence when a new Hello re-baselines
  // the worker; same-process reconnects replay only satisfying generations
  // whose successful stream.write delivery has not completed yet.
  uint64 host_ram_capacity_generation = 15;
  // Immutable bytes and DesiredResidency generation for this ref transition.
  // A receiver must treat an empty digest or zero generation as identity
  // unknown. Generation fences delayed events after a tag moves or a newer
  // desired replacement is reconciled without changing protocol version.
  string snapshot_digest = 16;
  uint64 residency_generation = 17;
  // Echoes ModelOp.operation_id on ADOPTED/adopt-FAILED and at most one later
  // causal compiled-runtime FAILED. Empty on boot-attached cells and ordinary
  // snapshot/download/residency events.
  string operation_id = 18;
  // Echoes ModelOp.target_incarnation_id on ADOPTED/adopt-FAILED and at most
  // one later causal compiled-runtime FAILED; empty on boot-attached cells and
  // ordinary model events.
  string target_incarnation_id = 19;
  // th#850: cumulative bytes actually fetched over the network (the public
  // R2 source, never a local/volume CAS hit) for this DOWNLOADING operation.
  // Monotonically non-decreasing within one operation, same cadence as
  // bytes_done; set on progress events and the last one before completion is
  // authoritative. This is the minimal worker-side signal the "volume-
  // attached boot with warm blobs ⇒ R2 bytes ≈ 0" runtime assertion needs —
  // distinct from bytes_done/bytes_total, which count ALL bytes materialized
  // (including cache hits, both local disk and volume-backed CAS roots).
  int64 network_bytes = 20;
}

enum ModelState {
  MODEL_STATE_UNSPECIFIED = 0;
  MODEL_STATE_DOWNLOADING = 1; // fetch in progress; may repeat with progress
  MODEL_STATE_ON_DISK     = 2; // bytes local; not resident in RAM or VRAM
  MODEL_STATE_IN_RAM      = 3; // weights host-RAM resident (fast VRAM promote)
  MODEL_STATE_IN_VRAM     = 4; // hot; ready for inference
  MODEL_STATE_EVICTED     = 5; // removed from disk entirely
  MODEL_STATE_FAILED      = 6; // last op on this ref failed; residency unchanged
  MODEL_STATE_ADOPTED     = 7; // compile-cache ref adopted in place (not a residency tier)
  // Measured host headroom now satisfies this ref's remembered failed
  // requirement after owner/pin release. Not a residency tier.
  MODEL_STATE_HOST_CAPACITY_PROGRESS = 8;
}

// ---------------------------------------------------------------------------
// Worker activity (th#929 / gw#601)
// ---------------------------------------------------------------------------

// Worker -> orchestrator: generic progress for the worker's current internal
// job (self-mint compile, warmup, ...). Liveness contract: while an activity
// RUNS the worker keeps seq advancing — phase transitions, step advances, or
// watchdog heartbeats — and the hub enforces ONE generic stall rule on
// silence; there are no per-activity wall-clock budgets. A silent death is a
// bug by contract: terminal FAILED carries the exception. Model downloads
// keep their richer ModelEvent byte shape; the hub folds them into the same
// last-progress store. Additive proto3 oneof field: old hubs ignore it.
message ActivityUpdate {
  string kind  = 1; // "self_mint_compile" | "warmup" | ...
  string phase = 2; // e.g. "load", "inductor_compile", "warmup_forward", "seal_publish"
  int64 step        = 3; // k in "phase k/K"; 0 = not stepwise
  int64 total_steps = 4; // K; 0 = unknown
  // Monotonic per worker process across all activities. The hub records
  // last-progress on every increase; heartbeats bump it without changing
  // phase/step.
  uint64 seq = 5;
  ActivityState state = 6;
  string error  = 7; // set when state = FAILED (the typed activity_failed terminal)
  string detail = 8; // human-readable elaboration
  int64 updated_at_unix_ms = 9; // worker clock, informational; hub stamps receipt

  // gw#621/th#994: progress-registry snapshot riding the worker's 10s app
  // beat. A named monotonic counter for the current phase (download bytes,
  // watchdog evidence, warmup jobs, upload bytes). When a counter is
  // present the hub judges liveness by counter ADVANCEMENT — a heartbeat
  // with a frozen counter is not progress. Counterless updates keep
  // seq-freshness semantics (old workers). Additive: old hubs ignore.
  string counter       = 10; // name; family prefix before ":" maps to a patience window
  string counter_unit  = 11; // bytes | steps | graphs | evidence
  double counter_done  = 12; // monotonic within one counter name
  double counter_total = 13; // 0 = unknown
  double rate_per_s    = 14; // worker-computed recent rate, display only
  // Self-diagnosis (kill on confession, gw#621): the worker's own per-phase
  // window saw no counter advance for stalled_for_ms; the hub recycles the
  // pod without waiting out its own stall window.
  bool  self_stalled   = 15;
  int64 stalled_for_ms = 16;
  // th#1322: the WORKER-MEASURED duration of the work this event reports, in
  // milliseconds. A numeric column, not prose: `aot_mint_phases` and
  // `jit_compile` both carry their total here, so "how long does AOT mint take
  // vs JIT mint" is ONE grouped query over worker_activity_events instead of a
  // regex over `detail` (which cannot be indexed, cannot be percentiled, and
  // returns NULL the first time the formatting changes).
  //
  // Deliberately its OWN field rather than an overload of stalled_for_ms (that
  // one means "no counter advanced for this long" and the hub kills on it) —
  // the same separation-of-concerns as WorkerMessage.boot_phase vs liveness:
  // a measurement must not be able to satisfy or break pod condemnation.
  //
  // Semantics: the span of ONE completed unit of work, from the worker's own
  // monotonic clock. 0 = not a timed event (every pre-th#1322 worker, every
  // progress beat). Never derived from receipt timestamps — that would measure
  // stream latency and clock skew instead of work. A breakdown finer than this
  // total rides `detail`, and finer-grained SPANS ride their own events with
  // their own `phase` (per graph-class entry, per warm shape), so the
  // breakdown is groupable too.
  int64 duration_ms = 17;

  // pgw#1176 / th#1839: cell identity as TYPED FIELDS, so the hub's existing
  // `worker_activity_events.family` / `.cell_key` columns are populated from
  // the wire instead of regex-scraped out of `detail`. The measured cost of
  // the prose form: `detail LIKE 'ref=%#'||cell_key||' %'` matched one of
  // three rows correctly, because four emitters spelled identity four ways.
  //
  // `graph_class` is the pgw#1176 atom's unit — one artifact is ONE graph
  // class, so the class name is what makes a per-entry event bisectable to
  // the thing that failed. It has no column yet; carrying it on the wire is
  // what lets the hub add one without a second proto cut.
  //
  // Additive: old readers ignore all three, and an emitter that states none
  // sends empty strings, which is the honest "this event is not about a
  // cell". Never derived by the hub from `detail` — a field that can be
  // reconstructed by parsing prose is a field that silently returns NULL the
  // first time the formatting changes.
  string family      = 18;
  string cell_key    = 19; // the `ek1` ENTRY key (pgw#1176), not a cell key
  string graph_class = 20; // the entry/class name inside the declaration
}

enum ActivityState {
  ACTIVITY_STATE_UNSPECIFIED = 0;
  ACTIVITY_STATE_RUNNING     = 1;
  ACTIVITY_STATE_COMPLETED   = 2;
  ACTIVITY_STATE_FAILED      = 3;
}

// pgw#764/th#1293: ONE phase of ONE worker's boot, measured by the worker.
//
// Cold-boot time is the number the autoscaler prices every buy against
// (th#1190's composed estimate) and the number every "why is TTFR 5 minutes"
// investigation has had to hand-derive from log archaeology (th#1187's ladder
// at tracker tensorhub/progress.md:13043). The pod-level facts the hub can
// see for itself — create -> connect -> first-assign — bound the boot from
// OUTSIDE; they say nothing about which of weights fetch, cell fetch, cell
// load or warmup owns the seconds INSIDE. Only the worker knows that, and
// today it dies with the pod.
//
// Shape follows th#1269's endpoint_build_phases: a row is OPENED at phase
// start (terminal=false) and CLOSED at phase end (terminal=true), so a pod
// that dies mid-boot still shows exactly where its time went. The worker's
// own monotonic `duration_ms` is authoritative — deriving it from receipt
// timestamps would measure stream latency and clock skew instead of work.
//
// Ordering/identity: `boot_id` is one worker PROCESS boot; `ordinal` is dense
// and monotonic within it, and an open row and its close carry the SAME
// ordinal. `parent_ordinal` nests a phase inside another so durations charge
// EXCLUSIVELY to the innermost span (th#1111 stage_timing's rule) and the
// measured phases plus a residual reconcile to the whole boot window. A
// telemetry stream that does not reconcile cannot be trusted to say where the
// time went, which is the only reason it exists.
message BootPhase {
  string boot_id = 1;
  int64  ordinal = 2;
  // 0 = a top-level phase.
  int64  parent_ordinal = 3;
  // Vocabulary is wire-shared with gen_worker/boot_phases.py (PHASE_*), and
  // is exactly the eight spans the shipping path PRODUCES (pgw#924):
  //   hello | weights_fetch | pipeline_load | cell_discover | cell_fetch
  //   | cell_arm | warmup | first_request_servable
  // pgw#924 deleted the nine that had no producer or never fired
  // (process_start, env_seal, manifest_load, cache_preflight, cuda_probe,
  // cell_load, first_request, warm_complete, warmup_iteration) — a reader of
  // the old list learned a vocabulary the system cannot emit, which is the
  // C3 defect th#1562 fixed for FnUnavailable.
  // Unknown phases are stored verbatim, never rejected: an old hub must not
  // be able to refuse a newer worker's honest measurement.
  string phase = 4;
  bool   terminal = 5;
  // Worker wall clock at phase open; informational (the hub stamps receipt).
  int64  started_at_unix_ms = 6;
  // Worker monotonic span, set on the terminal row only.
  int64  duration_ms = 7;
  // Milliseconds from OS process start to this phase's open. Makes the
  // pre-first-phase cost (interpreter start, torch import) visible instead of
  // hiding it in an unexplained residual.
  int64  process_uptime_ms = 8;
  // Bytes moved by this phase (weights/cell fetch). 0 = not a byte phase.
  int64  bytes = 9;
  // Where the bytes came from: cas | volume | r2 | hf_cache | inflight_share
  // | local. The single most load-bearing boot fact after duration — the same
  // release boots in wildly different times off a warm volume vs cold R2, and
  // th#1190's weights-rate learning is keyed on exactly this distinction.
  string source = 10;
  // Model/checkpoint ref for weights phases.
  string ref = 11;
  // Cell artifact identity for cell phases: aot-inductor | trt | dynamo.
  string artifact_kind = 12;
  string artifact_key = 13;
  string function = 14;
  // ok | refused | failed | skipped. `refused` is a TYPED refusal that left
  // the worker serving something else (an unarmed cell), not an error.
  string outcome = 15;
  // The classified reason token when outcome != ok — AdoptError.reason,
  // ConstantsUnboundError.reason, a lane-gate refusal. Short and stable so it
  // is countable hub-side (the pgw#760 doctrine's `phase=reason`).
  string reason = 16;
  // Identifiers + exception, per pgw#760: ref=/key=/fn=/lane=/source=.
  string detail = 17;
  // TRUE when duration_ms is measured from PROCESS START rather than being a
  // span of its own — i.e. this row is a cumulative MILESTONE (hello,
  // first_request_servable), not a phase. Load-bearing for any consumer that
  // adds durations up: a milestone's duration covers the same wall clock the
  // spans already account for, so summing both double-counts the whole boot.
  // Reconciliation excludes cumulative rows from the sum and uses the
  // first_request_servable milestone as the boot TOTAL.
  bool   cumulative = 18;
}

// ---------------------------------------------------------------------------
// Availability / drain
// ---------------------------------------------------------------------------

// Worker -> orchestrator: this worker self-disables ONE function on itself
// because a hardware gate failed or its model download / pipeline setup
// failed terminally. Cleared implicitly by the next Hello, or by the
// function reappearing in StateDelta.available_functions.
//
// th#1867 (§1.35) removed THREE tokens from the closed set below, and each
// removal is a population that now SERVES rather than refusing — never one
// that goes quiet:
//   * `insufficient_vram` — the card is small, so the offload rung carries
//     the load and says so on FnDegraded. §1.35 clause 1 names this token
//     explicitly: it "should not exist" as a decline class.
//   * `compute_capability_unmet` — pgw#1148 had already moved every
//     SM-window verdict onto the loaders' tensor-layout contracts, so the
//     only verdict still reaching this arm was a missing quant library, for
//     which `missing_cuda_library` is the honest name. The kernel-capability
//     refusal §2.4 ruling 1 protects is unaffected: it lives at
//     `refuseLaneUnservableOnTier`, at config-write, with nothing rented.
//   * `artifact_envelope_exceeded` — th#1777/pgw#1117's pre-stage
//     precondition. Its two inputs were the release's declared `vram_gb`
//     and `strict_vram`; both are deleted, so it had no question left to
//     ask. Detecting a WRONG BINDING is still worth doing — it is a
//     catalog question, not a VRAM one (th#1913).
//   * `cuda_unavailable` — W's only trigger for it was `strict_vram` on a
//     CUDA-less pod. th#1867 first tried to KEEP this refusal by re-basing it
//     on the fact (no CUDA device), citing pgw#1212's unproven CPU serve
//     path — and the worker's own boot tests refuted that. Every gen-worker
//     harness endpoint declares `Resources(gpu=True)` and SERVES on CPU-only
//     CI, warmup forward included, so the refusal withdrew functions that
//     demonstrably work: the opposite of §1.35 amendment 2's bar. The CPU
//     rung is planned and served, behind a loud FnDegraded warning.
//     pgw#1212's protection is UNCHANGED and lives where it is true — W's
//     REACTIVE rung walk still stops one rung short of CPU
//     (`FLOOR_CPU_RUNG_UNEXECUTABLE`), so a pod that OOMs its way down
//     refuses and names our code.
//     `cuda_unavailable` still exists in `HardwareUnsuitable.reason_class`
//     (:213) — a boot DRIVER probe, a different vocabulary, untouched.
// These names are recorded HERE, outside the message body, on purpose: the
// AST gate (`test_fn_unavailable_vocabulary_th1563.py`) matches an emitted
// token against the body text, so documenting a dead token inside it would
// let the emission come back with the gate still green.
message FnUnavailable {
  string function_name = 1;
  // reason vocabulary — the CLOSED set. Every token here is a write into
  // gen-worker's `ExecutorState.unavailable` map (gen_worker/executor.py),
  // which `lifecycle._emit_unavailable` puts on this wire verbatim; nothing
  // else may appear in this field. An incomplete list here is not cosmetic:
  // O's per-reason lifetime policy (th#1100) reads these tokens, so a reason
  // the list forgot is a reason nobody checked O's handling of.
  //
  // Machine FACTS about this pod — nothing O can wait for changes them, so O
  // never re-probes them on a timer:
  //   missing_cuda_library, hardware_unmet, native_crash_streak.
  // `hardware_unmet` is HardwareUnmetError's base default: a gate subclass
  // that declares no token of its own reports under it.
  //
  // State that can change — O re-probes these with backoff:
  //   insufficient_disk, insufficient_host_ram, host_ram_capacity,
  //   setup_failed, retry_exhausted, compile_cell_failed, model_unavailable,
  //   multi_group_async_handler, cancel_unwind_stuck.
  //
  // `native_crash_streak` is not only an availability fact: W's own PROCESS
  // died by signal on this pod and W's registry refuses the function there
  // (pgw#676). It carries axes{streak, last_signal, last_kind}, and O
  // condemns the WORKER on it (th#1205) — the pod is recycled, so the
  // recovery from this one disable is the pod going away, not a re-probe.
  string reason = 2;
  string detail = 3; // human-readable elaboration for the admin availability view
  map<string, string> axes = 4; // e.g. {detected_sm: "8.9", required_sm: "10.0"}
}

// Worker -> orchestrator: this worker DOES serve function_name, but degraded —
// not at the release's native quality/speed on this card (th#683 P3 serve-time
// adaptive fit). Emitted once per connection per degraded function after
// hardware gating; re-emitted on reconnect. Observational evidence for the
// OPERATOR — every field here is MEASURED or OBSERVED, and nothing on this
// message may become an input to a placement gate (th#1867/§4.33).
//
// th#1867 deleted `recommended_vram_gb` (was field 6). It was not a
// measurement: its only source was the author's `Resources(vram_gb_hint)`,
// which §1.2 measured wrong in BOTH directions on live releases (anima
// declared 8 against a 10.6 GiB peak; sdxl declared 20 against 9.3 GiB), and
// the hub then learned a monotone buy floor from it (th#1720, deleted in
// `96229a73`). What survives is what actually happened — `wanted` vs `ran`
// and the realised slowdown — which is the loud, quantified degradation
// §1.36's amendment requires, with no declared number laundered as evidence.
message FnDegraded {
  string function_name = 1;
  string wanted = 2; // what the function declares (stored flavor, or "bf16")
  string ran = 3;    // how it actually runs: fp8_storage | emergency_quant | offload | cpu
  string reason = 4; // honest-guidance detail, incl. a better-flavor hint when one exists
  double est_latency_multiplier = 5; // realistic slowdown vs a native run
}

// Orchestrator -> worker: stop accepting work, finish in-flight jobs, ship
// results, close the stream, exit. No reply message; stream close is the ack.
message Drain {
  int64 deadline_ms = 1; // relative grace budget; 0 waits without a lifecycle deadline
}

// ---------------------------------------------------------------------------
// Credential rotation
// ---------------------------------------------------------------------------

// Orchestrator -> worker: a renewed worker JWT, pushed at ~80% of the current
// token's TTL (kubelet-style rotation). The worker replaces its stored
// credential immediately: the live connection is unaffected (identity is per
// connection) and every subsequent reconnect dials with the newest pushed
// token. No reply message. Additive proto3 field: a worker that predates this
// message ignores it (unknown oneof field) and keeps its boot-time token.
message TokenRefresh {
  string token = 1;           // replacement worker JWT
  int64  expires_at_unix = 2; // exp claim of the replacement (observability)
}

// ---------------------------------------------------------------------------
// Serve posture (DESIGN-RULINGS §4.32 item 4)
// ---------------------------------------------------------------------------

// Orchestrator -> worker: the OPERATOR's eager-only command. Paul, §4.32 item
// 4: *"The consumer should have the ability to turn off compile entirely, and
// serve-eager only, if the compile is broken or they just don't care."*
//
// It is a COMMAND, not config and not an env var (§1.17): whole-worker,
// runtime, and REVERSIBLE in both directions on a live stream — "the compile is
// broken" is discovered while serving, and so is "it was not the compile".
//
// Distinct from the other eager posture that exists, deliberately:
//   * (th#1842: the PLAN-carried `STEADY_BACKEND_EAGER_ONLY` this used to
//     contrast with went with `ExecutionSpec` when the abandoned dispatch
//     cutover was deleted. It was chosen per dispatch, before the pod was
//     serving, and reported `hub_ordered_eager`. Nothing on the live wire
//     carries a per-dispatch eager choice today — RunJob has no such field —
//     so this command is now the ONLY hub-ordered eager posture.)
//   * §4.31's sticky de-arm is AUTOMATIC and per-cell — a cell-attributable
//     failure, evidence, irreversible for the boot.
// This one is operator-explicit, whole-worker and reversible, and it reports
// its own token (`operator_eager_only`) so a suppressed pod's telemetry is
// never mistakable for a broken adopt path.
//
// No reply message; the worker emits a typed activity event on each transition.
// Additive proto3 oneof field: a worker that predates it ignores it.
message ServePosture {
  // true  = serve eager only: arm nothing, mint nothing, and answer every
  //         request from the eager forward even where a cell is already armed
  //         (the arm is NOT unwrapped, which is what makes false reversible).
  // false = release the suppression; already-armed cells serve compiled again
  //         on the next request, and later arming decisions run normally.
  bool   eager_only = 1;
  string reason     = 2; // operator's words, carried into the worker's event
  string actor      = 3; // who ordered it (admin principal / "cozy-local")
}
