# Provenance for the vendored upstream snapshots under this directory.
# THE SINGLE HOME OF THE FACT: nothing else records these revs.
#
# Why they are vendored rather than depended on (pgw#1310, ie#738):
# both PyPI projects were deleted permanently (DESIGN-RULINGS "Release policy",
# Paul 2026-08-16 — "just use a vendored version of our local library if you
# need to"), and a `[tool.uv.sources]` git pin is workspace-only metadata that
# is STRIPPED from a published wheel. So a source pin fixed this repo and left
# every consumer of the artifact unable to resolve `gen-worker` at all.
#
# The snapshots are byte-identical to upstream except for the `rewrites` listed
# per package. `tests/test_vendored_snapshot_pgw1310.py` refuses any other edit
# (per-file sha256) and separately proves the BEHAVIOUR the pinned rev exists
# for, so neither fence can pass on a stale or hand-patched tree.
#
# To re-vendor: `git archive <rev> <subdir> | tar -x` into the package
# directory (whose name is the TABLE KEY below, which is upstream's CURRENT
# package name and not necessarily `subdir`'s last component), re-apply
# `rewrites`, then regenerate the `files` tables.

[packages.tensorfs]
repo = "https://github.com/cozy-creator/tensorfs"
rev = "8bafdfbb112be57cc96c0c71c38fd987091cbf51"
subdir = "python/src/tensorfs"
# Why THIS rev and not the tip: upstream `master` is a v0.1.0 genesis restart
# that deleted this data plane outright (no `transfer`, `journal`, `chunking`);
# `8bafdfbb` is the merge of tensorfs#41, the last lineage that still carries
# `LocalCAS` + `download`/`upload` AND the pgw#1287 progress-emission fix
# (`626a3de` per-object emission + `6c1f2ab` resident objects advance too).
# A 31.6 GB snapshot reporting `0 / total` for its whole duration is what got
# correctly-downloading pods condemned by the hub's 6-minute freshness window.
#
# pgw#1308: the TRANSFER PLANE LEFT THIS SNAPSHOT and is now first-party at
# `gen_worker/transfer/`. It was never storage — `TransferGrant.from_wire`
# parses TENSORHUB's grant JSON, and the retry ladder, the fan-out width and
# the per-object progress emission are this worker's policy about this
# worker's uplink. Upstream agrees: current tensorfs has no Python transfer
# plane at all (its client is the Rust `sync.rs` pack/blob lane, which a
# pure-Python wheel cannot carry). So the two modules were pinned to a
# lineage upstream had ABANDONED, and calling that a "vendored snapshot" was
# the part that had stopped being true — a digest fence certifying fidelity
# to a rev nobody would ever fix. The `daemon` module went with them, for the
# adjacent reason: it is a FUSE client in a wheel that provably cannot mount
# (pgw#1295 — `CAP_SYS_ADMIN` absent from the container's bounding set,
# measured on a real pod), and nothing in this repo imported it.
#
# What is LEFT is genuinely storage — `LocalCAS`, the chunk manifest, refs —
# and it is byte-identical to `8bafdfbb` except for the `rewrites` below.
#
# pgw#1330: THE SNAPSHOT IS SPLIT AT TWO REVS, ON PURPOSE, PERMANENTLY (see
# the ownership ruling below), AND THIS IS THE ONLY RECORD OF IT. `project.py`, `tensors.py` and `gguf.py` come from
# `read_plane_rev` below, NOT from `rev`. They are the consumption plane the
# whole mixed-CAS cutover rests on — TFSSTUB1 render/parse, tree projection,
# and the direct tensor reader — and they DID NOT EXIST at `8bafdfbb`.
#
# Why not simply bump `rev`: the newer lineage DELETED `LocalCAS.ingest_file`,
# `LocalCAS.ingest_repository`, `LocalCAS.collect_garbage`,
# `LocalCAS.materialize` and `LocalCAS.materialize_repository`.
#
# pgw#1308 STEP 6 ANSWERED THE OWNERSHIP QUESTION, and the answer is NOT the
# one this file used to imply. It said the split ends when the chokepoint
# flips. It does not:
#
#   * `materialize_repository` — DEAD. The chokepoint projects (pgw#1308 step
#     6, `models/cozy_snapshot.py:_publish_snapshot`), so this repo has zero
#     callers. The definition below is all that is left of it, and
#     `scripts/lint_materialization_hatch.py` declares that and refuses a new
#     caller anywhere, `_vendor` included.
#   * `materialize` (single file) — KEPT, and the name is now the SHARED one.
#     The pinned rev has always called it `materialize`; upstream called the
#     same operation `extract()` until tensorfs#107 renamed it to match
#     (Paul's #1303 ruling). So the two-spelling hazard that once made the
#     hatch census read zero is gone: one name here and upstream, and
#     `.extract(` is refused outright by
#     `scripts/lint_materialization_hatch.py`. It is tier 3 of the access
#     ladder — permanent, not separately priced — and upstream's own
#     no-whole-tree-materialization fence exempts it by name. ONE live user
#     since pgw#1342 — `aot_delivery.py`, declared to the lint against
#     `docs/mixed-cas-layout.md` section 9 with an inline marker. The vendored
#     `torchcg/storage.py` was the second until its blob cutover; it untars
#     straight out of the store now and reaches no hatch.
#   * `ingest_file` / `ingest_repository` — TENSORFS'S, not ours. Admission is
#     the store's identity contract: the chunk grid, the whole-file digest,
#     the concurrent-mutation refusal. Upstream did not abandon it the way it
#     abandoned the Python transfer plane; it PORTED it to Rust
#     (`Plan`/`HashedPlan`/`AdmittedObject`/`ObjectStore`) and added
#     `TensorWriter`. Forking it first-party would put a second implementation
#     of the rule that decides hub dedup in this repo.
#   * `collect_garbage` — TENSORFS'S, same shape. Reachability over the
#     store's own ref and manifest formats; its own docstring says tensorfs
#     owns no retention policy, and the retention policy is already
#     first-party in `models/disk_gc.py`.
#
# So the split at two revs is the STEADY STATE. It ends when pgw can depend on
# a PUBLISHED, COMPILED tensorfs — upstream's successors for ingest and GC are
# the Rust extension, and pgw#1310 rules a compiled extension out of a
# source-vendored wheel. That is a release-policy decision (Paul), not a lane's.
# Do not "finish the bump": it would delete two symbols with no reachable
# successor.
#
# Why the split is SAFE rather than merely convenient: the three read-plane
# modules import nothing from `local.py` at runtime beyond `object_path`,
# `load_manifest` and `_store_lock` — all three present and unchanged at
# `8bafdfbb` — plus `manifest.py` and `refs.py`. `refs.py` is byte-identical
# across the two revs. `manifest.py` differs ONLY in that the newer rev drops
# the 64 MiB cap on a chunkless entry; the older, STRICTER parser is the one
# in force here, so nothing the read plane is handed can be a manifest the
# storage half would have refused. `tests/test_projected_tree_pgw1330.py`
# proves the pairing executes rather than asserting it from imports.
read_plane_rev = "333bb10016c328c5e3a275de2a2a314dbd0abcaf"
read_plane_files = ["gguf.py", "project.py", "tensors.py"]
rewrites = [
  "`__init__.py`: the `transfer`, `journal` and `daemon` re-exports are gone with the modules (pgw#1308), and the `project`/`tensors` re-exports are added with the read plane (pgw#1330). No other file is touched, so the remaining digests are still upstream's.",
]

[packages.torchcg]
repo = "https://github.com/cozy-creator/torchcg"
rev = "94a7872870274dc59de9be2c272ce8bdd208a3ef"
subdir = "src/torchcg"
# THE REV THAT FROZE THE ADDRESS (torchcg PR #41). Its `src/` tree is
# byte-identical to `41e38a2` — the freeze added only tests and docs — so the
# digests below are the same either way. It is recorded as the rev because
# this snapshot is only safe at ONE rev while upstream fences the identity,
# and that is the first commit where it does.
#
# ONE REV. Both grafts over the older storage half are DELETED here —
# pgw#1328's `selection_rev` and pgw#1332's `recipe_rev` — and pgw#1342/tcg#39
# is why. Each was taken because the tip carried a storage migration its own
# lane was not entitled to take; a third one would have been the same trade a
# third time.
#
# The split existed because the tip carried a storage RE-KEY that the serve-role
# lane was not entitled to take as a line item: `_REF_PREFIX` moved from
# `torch-compiled-graphs/v1` to `torchcg/v1`, `StoreResult.manifest` became
# `.artifact`, and underneath both, custody changed shape — an exact-key ref
# used to point at a one-entry `RepositoryManifest` and now points straight at
# the artifact blob (`put_file`/`verify_object` instead of
# `ingest_file`/`store_manifest`). Every one of those changes the ADDRESS a
# stored graph lives at, so bumping orphans whatever a store already holds.
#
# Paul ruled it on 2026-08-17 (tcg#39), verbatim: "you can delete all of the
# existing compiled graphs from db / filesystem if you want; we're pre-launch.
# We can also recompile everything again." So the re-key is ACCEPTED. The
# orphaned refs are cache misses, a miss re-mints on demand, and minting is a
# side effect of serving — the fleet repairs itself without anyone driving it.
#
# What makes this bump safe to leave at one rev going forward: upstream FROZE
# the identity it just moved. torchcg PR #41 pins `_REF_PREFIX`, both emitted
# ref shapes, the quarantine marker's on-disk keys and the `artifact` field on
# `StoreResult`/`StoredCompiledGraph`, with the cost written at the assertion.
# A future rev cannot re-key this store without going red upstream first, which
# is the property the two-rev split was standing in for.
#
# The bump also RETIRES a `materialize` caller: the old vendored storage half
# materialized a manifest entry to a temp file before untarring, and the new one
# untars straight out of the store. `scripts/lint_materialization_hatch.py` and
# tensorfs's own no-whole-tree-materialization exemption now cover exactly one
# caller here, `aot_delivery.py`.
rewrites = [
  "`from tensorfs import ...` -> `from ..tensorfs import ...` in cli.py, engine.py, storage.py (3 lines; upstream's own dependency, vendored beside it). Upstream itself dropped `hashrepo` for `tensorfs` at tcg#28, so this rewrite is now only the relative-import prefix.",
]

