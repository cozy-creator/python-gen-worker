# Provenance for the vendored upstream snapshots under this directory.
# THE SINGLE HOME OF THE FACT: nothing else records these revs.
#
# Why they are vendored rather than depended on (pgw#1310, ie#738):
# both PyPI projects were deleted permanently (DESIGN-RULINGS "Release policy",
# Paul 2026-08-16 — "just use a vendored version of our local library if you
# need to"), and a `[tool.uv.sources]` git pin is workspace-only metadata that
# is STRIPPED from a published wheel. So a source pin fixed this repo and left
# every consumer of the artifact unable to resolve `gen-worker` at all.
#
# The snapshots are byte-identical to upstream except for the `rewrites` listed
# per package. `tests/test_vendored_snapshot_pgw1310.py` refuses any other edit
# (per-file sha256) and separately proves the BEHAVIOUR the pinned rev exists
# for, so neither fence can pass on a stale or hand-patched tree.
#
# To re-vendor: `task vendor -- <package> <rev>` (scripts/vendor_snapshot.py).
# It extracts at the rev, re-applies the mechanical `rewrites`, regenerates the
# `files` table, and moves the SAME rev in `pyproject.toml`'s `[tool.uv.sources]`
# and in `uv.lock` — one act, because pgw#1477 is what a hand re-vendor that
# forgot the third one costs: `uv sync --locked` is the FIRST step of every CI
# job, and it dies naming neither file. Twice on 2026-08-19, 20 minutes apart.
# Packages with NON-mechanical rewrites (tensorfs: hand-written pure-Python
# ports of deleted upstream modules) are extracted by hand — `git archive <rev>
# <subdir> | tar -x` into the package directory, whose name is the TABLE KEY
# below (upstream's CURRENT package name, not necessarily `subdir`'s last
# component) — and then re-pinned with `--pins-only`, which does everything else.

[packages.tensorfs]
repo = "https://github.com/cozy-creator/tensorfs"
rev = "07f9615e0f385b4cfc12675e8845edf65bab9d06"
subdir = "python/src/tensorfs"
# ONE REV, ONE LINEAGE (pgw#1575), on Paul's release-policy ruling of
# 2026-08-20, verbatim: "it's fine if old wheels are on pypi historically. I
# just mean, get rid of the vendored copies, etc. Remove the v1's from the
# codebase fully."
#
# This file used to declare a THREE-REV split and call it "the STEADY STATE …
# a release-policy decision (Paul), not a lane's". The decision happened.
#
# What the split was, and what was wrong with it. `rev` was `8bafdfbb` — and
# that rev is not merely behind master, it shares NO ANCESTOR WITH IT AT ALL
# (`git merge-base 8bafdfbb da1f3d2` finds nothing; upstream restarted at a
# v0.1.0 genesis and the old lineage survives only on `shelf/tensorfsd`). It
# was held for exactly five methods upstream deleted — `LocalCAS.ingest_file`,
# `ingest_repository`, `collect_garbage`, `materialize`,
# `materialize_repository` — and for a `planner.py` that exists at NO upstream
# rev whatsoever. `read_plane_rev` and `contract_plane_rev` were master
# ancestors bolted on beside it because the dead rev could not supply the
# consumption plane or the contract plane.
#
# Where the five went, and none of them needed a lineage:
#
#   * `ingest_file` / `ingest_repository` — FIRST-PARTY, `gen_worker/cas/
#     admission.py`. The old argument was that admission is the store's
#     identity contract and forking it would put a second implementation of
#     the hub's dedup rule in this repo. But the identity contract is the
#     OBJECT GRID, and pgw#1365 had already forked that into `planner.py` and
#     pinned it to upstream's released `spec/v1/planner-vectors` corpus. What
#     was actually left in `local.py` was forty lines of plan, put, hash and
#     refuse-if-it-moved, calling a module this repo already owned.
#   * `collect_garbage` — FIRST-PARTY, `gen_worker/cas/retention.py`. Its own
#     upstream docstring said "TensorFS deliberately owns no retention
#     policy", and the policy was already `models/disk_gc.py`'s. Master has no
#     successor at all: the Rust `ObjectStore` collects abandoned TEMPORARIES,
#     which is a lease sweep, not a reachability pass.
#   * `materialize` — UPSTREAM'S, and it moved rather than died:
#     `TensorReader.materialize`, tier 3 of the access ladder Paul fixed on
#     2026-08-17, which upstream's own no-whole-tree-materialization fence
#     exempts by name. Two callers, `aot_delivery.py` and
#     `models/materialized_view.py`, each carrying its inline
#     `mixed-cas-hatch:` marker naming the §9 row it is priced under.
#   * `materialize_repository` — DELETED. Zero callers since pgw#1308 step 6
#     made the chokepoint PROJECT rather than materialize.
#
# `planner.py` MOVED OUT (`gen_worker/cas/planner.py`). It was never a vendored
# file: it is this repo's pure-Python port of
# `crates/tensorfs-core/src/planner/{mod,safetensors,gguf}.rs`, written because
# upstream deleted the Python chunker at `00c57c1` ("one chunker — the legacy
# Python data plane is gone") and pgw#1310 rules a compiled extension out of a
# source-vendored wheel. Carrying it under `_vendor/` made the digest table
# certify fidelity to bytes no upstream rev has. Its two knowing divergences
# are unchanged and still tested by name: `plan_chunks` cuts a >64 MiB blob on
# the fixed grid (tensorhub's single-PUT promotion cap — pgw#1366), and a
# duplicate GGUF metadata key plans as `gguf-v1` here and `blob-v1` upstream.
#
# `manifest.py` is now master's, which DROPS the 64 MiB cap on a chunkless
# entry. The old note kept `8bafdfbb`'s stricter parser deliberately; that
# reason is spent, because the stricter parser only ever refused a manifest
# this repo cannot emit — `plan_chunks` still cuts an oversized blob for the
# hub's sake, so nothing here produces a chunkless entry above the cap either
# way. Relaxing the parser removes a divergence and adds no admission.
#
# WHY IT IS STILL VENDORED AT ALL. pgw#1310 is unchanged: `[tool.uv.sources]`
# is workspace-only metadata stripped from a published wheel, so a git pin
# leaves every consumer of the artifact unable to resolve `gen-worker`.
# tensorfs is NOT on PyPI today — `https://pypi.org/pypi/tensorfs/json` is a
# 404 and the repo carries no `v*` tag — even though its release pipeline is
# built and merged (`publish.yaml` + `wheels.yaml`: six abi3 platform wheels,
# trusted publishing, a post-publish verify job) and `pyproject.toml` says
# version 0.1.0. THE DAY A `v0.1.0` TAG IS CUT, this whole directory goes and
# both rewrites below go with it, because the compiled extension becomes
# installable. That is the end state; it is a tensorfs release act, not a pgw
# lane's, and it is the only thing that retires pgw#1310.
#
# THE ONE SURVIVING REWRITE is listed under `rewrites`, and it exists because
# upstream reaches for `tensorfs.native` — a source-vendored wheel cannot carry
# the extension.
#
# pgw#1621 RE-VENDOR (2026-08-21), `51adc50` -> `afdf321` (tensorfs#151): the
# tensor-layout contract v2 hardcut. `contract.py`, `contracts.py` and the 30
# `_contracts/*.json` documents are DELETED here because they are deleted
# upstream — `spec/v1/contracts` no longer exists at any rev on master. What
# replaces them:
#
#   * `layout2.py` — NEW upstream file, and upstream wrote it FOR THIS
#     CONSUMER: its own docstring names pgw#1621 and says the sm floor is a
#     property of the RULE, not of a dtype spelling. It reads the v2 corpus for
#     IDENTITY FACTS (`rules()` -> handle, declared dtype, capability floor,
#     conventions, lossy, inverse, digest; `topologies()` -> component -> key ->
#     shape) and parses a computed `quant(topology)` header
#     (`ExpectedHeader.from_document`). It is vendored VERBATIM.
#   * `spec/v2/{rules,topologies,morphisms}` + `display-names.json` +
#     `vectors/digests.json` — the corpus itself, verbatim, 2.6 MB dominated by
#     the 21 topology records. **The wheel upstream publishes carries NO corpus**
#     (`pyproject.toml`'s maturin block makes `spec/**` sdist-only), so a
#     consumer must vendor it or supply `root=`. `layout2._root()` walks the
#     module's parents for a `spec/v2` directory and finds this one, so the
#     no-argument call works from the vendored package exactly as it does
#     upstream.
#
# THERE IS NO EVALUATOR HERE AND THERE MUST NOT BE ONE. `quant(topology)` is
# computed by the Go engine (`engine.go` + `quantrule.go`) and by nothing else —
# there is no pyo3 binding for it, deliberately (`spec/v2/README.md`: "There is
# deliberately no pyo3 binding for the decision or the evaluator"), and the v2
# change DELETED `Verdict`/`Conversion`/`Mismatch` from the Rust extension's
# typed surface. v1 shipped three copies of one matching rule and the copies
# were free to disagree about an admit decision. So this worker READS identity
# facts and ENFORCES a verdict the hub authored; it never computes a layout and
# never decides an admit. A computed header this repo must diff against is
# either binding-carried or a committed `go run ./scripts/compute_layout`
# fixture — the same posture `tensorfs/python/tests/data/layout-*.json` takes.
#
# `convert.py` (upstream's pure-Python producer against an `ExpectedHeader`),
# `native.py` and `_tensorfs.pyi` remain UNVENDORED: nothing in this repo
# consumes them, and `convert.py` is the conversion PRODUCER, which is a hub-
# priced job rather than a worker act.
#
# `local.py`, `manifest.py`, `project.py`, `refs.py`, `tensors.py`, `writer.py`
# and `gguf.py` are byte-identical between `51adc50` and `afdf321` (verified by
# `git diff --stat`), so the re-vendor touched only `__init__.py`, added
# `layout2.py` + the corpus, and removed the v1 contract plane.
#
# THE FENCE READS ONE TABLE NOW. `[packages.tensorfs.files]` is the
# path -> sha256 inventory `test_every_vendored_file_matches_its_recorded_
# digest` enforces AS A SET, and `test_the_tensorfs_snapshot_is_one_rev`
# refuses the reappearance of a second `*_rev` key. `spec/v2/vectors/digests.json`
# is the SECOND, semantic fence: it pins each document's canonical digest, so a
# file whose bytes were re-serialised but whose meaning changed cannot pass.
rewrites = [
  "`tensors.py`: `TensorReader._map` maps through a pure-Python `_MappedObject` (an `mmap` exported via PEP 688) instead of the compiled `tensorfs.native.MappedObject`, because pgw#1310 rules a compiled extension out of a source-vendored wheel. Upstream needed exactly two things from the extension at that call site — a WEAK-REFERENCEABLE handle, so `_maps` can stay the `WeakValueDictionary` that keeps an 8 GiB shard from ending up resident, and a buffer that keeps its mapping alive as long as some view of it exists. A bare `mmap.mmap` supplies neither; a py3.12 class with `__buffer__` supplies both, and py3.12 is this package's floor. Nothing else in the file is touched, so every other line is upstream's.",
]

[packages.torchcg]
repo = "https://github.com/cozy-creator/torchcg"
rev = "a58f24a08693bc448950e082a26328f692e316de"
subdir = "src/torchcg"
# pgw#1474 / tcg#61 RE-VENDOR (2026-08-19), from `6c91b83d`. `CompiledGraphCall`
# stops pre-flattening the call: the loaded package is torch's
# `AOTICompiledModel` and it re-flattens with the export's OWN `in_spec`, so it
# wants the AUTHOR'S call shape. Measured on a 4070 against sd1.5's 14 real
# minted specializations -- everything upstream of the call was correct and the
# call itself died on `Ran into a kwarg keyword mismatch`. With it, sd1.5 serves
# 26/26 unet calls through AOTI.
#
# pgw#1460 / tcg#58 RE-VENDOR (2026-08-19), from `12c99841`. The NEW FILE is
# `serve.py` — the bytes->callable half of adoption, which upstream had left as
# a seam with no implementation, so both of this repo's loaders were raw
# `aoti_load_package` calls against WEIGHTLESS artifacts. `ArtifactLoader` now
# takes the live module as a third argument and `torchcg.serve.aoti_loader` is
# the DEFAULT, which is what makes a raw loader unwritable here rather than
# merely discouraged. Also picked up in the same span: tcg#57 (`hollow.py` —
# host egress inside a trace session; the session put the tensor on the trace
# device, so the session owes the `.cpu()`), which is derive-side and lands
# here only because a vendor is taken whole.
# tcg#55/pgw#1458 RE-VENDOR (2026-08-19), from `ad399093`. Two upstream changes
# land together because they are one ruling ("torchcg does too much"):
#
#   * THE DEVICE IS TRACED, NOT RE-HOMED. hollow.py said "device-neutral" and
#     hardcoded cpu; the trace stamps a device into every node's meta, so the
#     derive emitted device-CPU artifacts and a cuda mint died inside AOTI's own
#     `Expected: cpu, Got: cuda:0`. `hollow_session(device=...)` now states a
#     device CLASS (default cuda), a fake-cuda trace needs no silicon, and
#     `RuntimeCompatibility.key()` refuses a device-class mismatch BY NAME
#     before compiling. Placement is always recorded, single-device included --
#     its absence is what left an inductor-internal assert as the only place a
#     mismatch could surface. Device is not arch: one cuda trace still serves
#     every sm.
#   * THE GRAPH INTERFACE IS DERIVED. `GraphClassSpec` takes a typed
#     `CallIngress` instead of a `graph` mapping; `constant_fqns` and
#     `literal_values` are derived in `declare()`, and `lifted_inputs` /
#     `specialization` / `pytree`'s in-out are DELETED -- a grep across both
#     repos found no reader for any of them. That dead parallel layer is what
#     pgw#1456's two-field stub was stubbing. Interface v3 -> v4 REKEYS every
#     graph class; keys are content addresses so the next derive republishes,
#     and v3 bytes refuse by name (`RetiredGraphInterface`) rather than being
#     coerced. `graph_class_identity_v3.json` is gone, `_v4.json` replaces it.
#
# Also picked up in the same span: tcg#49-#53 (the whole traced graph is kept,
# `program` is the blob digest field, semantic graph order, and the transform
# passes -- `transform.py` and `quantize.py` are NEW files here).
#
# Unchanged and depended on by pgw#1459/#1460: `Engine.export_artifact`,
# `Engine.runner`, `CompiledGraphRunner.bind`, `CallIngress`.
#
# pgw#1371 RE-VENDOR COMPLETION (2026-08-19). `af609a87`'s message says it
# repinned torchcg to `ad399093`; the TREE was never re-vendored. What was
# actually here was `66cd2f1` verbatim in every file, plus a HAND PATCH to
# `document.py` adding the `program` field — which is exactly what
# `test_every_vendored_file_matches_its_recorded_digest` caught, and it was
# right to. Provenance established before re-recording (this is completing a
# legitimate re-vendor, not rubber-stamping a patch): `ad399093` is upstream
# `tcg#51: the sink is named program_sink`, and `66cd2f1..ad399093` touches
# exactly two files, both re-copied dereferenced from `ad399093` here.
#
# ⚠️ THE HAND PATCH HAD ALREADY REVERTED A BEHAVIOUR, silently. `a671822`
# (pgw#1384, an ancestor of `ad399093`) made GRAPH ORDER SEMANTIC — the
# producer states it and the derive puts the default-parameter classes FIRST —
# by replacing `LaneGraphs.__post_init__`'s `sorted(...)` with
# `tuple(self.graphs)`. Patching the field onto `66cd2f1` kept the SORT, so
# every release document decoded through this vendor was re-sorted by
# (target, graph) and pgw#1384's guarantee was dead on arrival — including for
# pgw#1371's hole work-list, which promises document order and inherits it
# from right here. Re-vendoring restores it. A digest recorded over the patch
# would have buried it permanently.
# pgw#1372 BUMP: takes upstream's tcg#41 wave — execution lanes (`lane.py`),
# two-level identity (`graph_identity.py`), the release graph-set document
# (`document.py`), the mint-written requirements manifest + exact-env audit
# (`requirements.py`), instrumented discovery (`discovery.py`), the abstract
# `GraphStore` + `LocalGraphStore` (`store.py`, the NEW `torchcg/v2` address
# space), the pgw#1370 weights-free derive session (`hollow.py`, tcg PR #45),
# and ctx.compile's engine — the imperative adopt-first swap-in
# (`adopt.py::AdoptSession`, torchcg PR #44). These are what the adopt-only
# boot (`gen_worker/serving/`) consumes; the older cg-key surfaces below are
# untouched by the bump and still serve the pre-cutover mint path. `rev`
# above is upstream MASTER at torchcg PR #47's squash merge (the #44 adopt
# wave plus its two fix-forwards: contract-keyed AdoptSession, and hollow
# off the package root so the serve-role closure stays model-free).
# THE REV THAT FROZE THE ADDRESS AND GAVE THE METADATA VOCABULARY ITS HOME —
# torchcg PR #41 (tcg#39) then PR #42 (tcg#40). The first is why one rev is safe
# at all: upstream now fences `_REF_PREFIX`, both emitted ref shapes, the
# quarantine marker's on-disk keys and the `artifact` field, so a later rev
# cannot re-key this store without going red upstream first. The second deletes
# a rewrite instead of adding one — see below.
#
# ONE REV. Both grafts over the older storage half are DELETED here —
# pgw#1328's `selection_rev` and pgw#1332's `recipe_rev` — and pgw#1342/tcg#39
# is why. Each was taken because the tip carried a storage migration its own
# lane was not entitled to take; a third one would have been the same trade a
# third time.
#
# The split existed because the tip carried a storage RE-KEY that the serve-role
# lane was not entitled to take as a line item: `_REF_PREFIX` moved from
# `torch-compiled-graphs/v1` to `torchcg/v1`, `StoreResult.manifest` became
# `.artifact`, and underneath both, custody changed shape — an exact-key ref
# used to point at a one-entry `RepositoryManifest` and now points straight at
# the artifact blob (`put_file`/`verify_object` instead of
# `ingest_file`/`store_manifest`). Every one of those changes the ADDRESS a
# stored graph lives at, so bumping orphans whatever a store already holds.
#
# Paul ruled it on 2026-08-17 (tcg#39), verbatim: "you can delete all of the
# existing compiled graphs from db / filesystem if you want; we're pre-launch.
# We can also recompile everything again." So the re-key is ACCEPTED. The
# orphaned refs are cache misses, a miss re-mints on demand, and minting is a
# side effect of serving — the fleet repairs itself without anyone driving it.
#
# What makes this bump safe to leave at one rev going forward: upstream FROZE
# the identity it just moved. torchcg PR #41 pins `_REF_PREFIX`, both emitted
# ref shapes, the quarantine marker's on-disk keys and the `artifact` field on
# `StoreResult`/`StoredCompiledGraph`, with the cost written at the assertion.
# A future rev cannot re-key this store without going red upstream first, which
# is the property the two-rev split was standing in for.
#
# The bump also RETIRES a `materialize` caller: the old vendored storage half
# materialized a manifest entry to a temp file before untarring, and the new one
# untars straight out of the store. tensorfs's own no-whole-tree-materialization
# exemption now covers exactly one caller here, `aot_delivery.py`.
#
# AN UNDECLARED REWRITE WAS FOUND WHILE DOING THIS, AND IT IS GONE RATHER THAN
# DECLARED. pgw#1340 had added `ARTIFACT_METADATA_FIELDS` to the vendored
# `artifact.py` and `__init__.py` BY HAND and listed it nowhere; the digest fence
# passed because the digests were regenerated after the patch, so an identity
# surface was forked underneath the fence that exists to prevent exactly that.
# torchcg#42 (tcg#40) gave it its real home — the closed metadata vocabulary is
# torchcg's own, public for the same reason `REQUIRED_AXES` is — and this
# snapshot takes it from upstream like every other symbol. `fleet_cells` imports
# it because a consumer that re-declares the set reads `None` for a field TCG
# does not write, and `None` compares unequal to a real runtime fact forever
# (th#2098). The rewrite list is back to ONE row, and that row is a relative
# import.
#
# tcg#56 RE-VENDOR (2026-08-19), `d132d872` -> `8e8c5ca6`. VOCABULARY ONLY, and
# it is a REKEY. Paul: "each model has a 'graph' and then has many 'graph
# specializations'". `GraphClassSpec` -> `GraphSpecialization`,
# `GraphClassDeclaration` -> `GraphSpecializationDeclaration`, `GRAPH_CLASS_BLOCK`
# -> `GRAPH_SPECIALIZATION_BLOCK` (value `graph_class` -> `graph_specialization`),
# `class_hash`/`class_dims` -> `specialization_hash`/`specialization_dims`, and
# the display-name field is now `.name`.
#
# WHY IT REKEYS: `facts()` emits the literal key `class_dims` and the hash is
# sha256 over that JSON WITH ITS KEYS, so renaming the key moves the `graph` axis
# of every cg-key-v1 -- `680f3e1a251975b7` -> `9d08563a90465af6` on the shipped
# vector. Folded into v4 rather than cutting v5: v4 already rekeyed this week and
# specializations are content addressed, so the next derive republishes. One
# fleet-wide invalidation instead of two. `graph_witness` is UNCHANGED
# (`54ceeee7225e57c9`) -- it digests the program BODY, not the fact keys, which
# bounds the rekey to exactly the renamed key.
#
# WHY BOTH HALVES MOVE IN THIS COMMIT: `GRAPH_SPECIALIZATION_BLOCK` is read via
# `metadata.get(...)`, so a producer/consumer spelling mismatch returns `None`,
# reads as a cache MISS, and RE-MINTS THE FLEET rather than raising. The vendored
# snapshot serves the mint and the serving path; the dev pin serves the derive.
# Splitting them is money, not a warning (pgw#1299).
#
# The contract file is renamed with it:
# `contracts/graph_class_identity_v4.json` -> `graph_specialization_identity_v4.json`
# (`CONTRACT_FILES` moved too, so the old name is a loud `ValueError`, not a
# silent miss). File COUNT is unchanged at 38, as a pure rename should be.
rewrites = [
  "`from tensorfs import ...` -> `from ..tensorfs import ...` in cli.py, engine.py, storage.py, store.py (4 lines; upstream's own dependency, vendored beside it). Upstream itself dropped `hashrepo` for `tensorfs` at tcg#28, so this rewrite is now only the relative-import prefix.",
]

