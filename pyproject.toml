[tool.ruff]
line-length = 100
target-version = "py312"
# Generated and vendored modules are lint-exempt (mirrors the mypy overrides
# above). `_vendor` is byte-identical to its pinned upstream ref — a lint fix
# applied here would break the digest fence and diverge the snapshot.
extend-exclude = [
    "src/gen_worker/pb",
    "src/gen_worker/_vendor",
]

[tool.ruff.lint]
# E402: gen_worker defers heavy imports (torch, request_context, cli
# subcommands) below module-level guards on purpose so `import gen_worker` and
# `gen-worker --help` stay cheap. Not a defect.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]  # intentional public re-exports

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: network tests against real tiny HF models",
  # pgw#978. LOCAL-ONLY: CI has no GPU and no card-side anything, so a green
  # CI never reads as coverage of them.
  "localrig: the local micro-mint rig (pgw#978) — run by hand, never in CI",
  "slow: a full machinery cycle; minutes, not seconds",
]
# Prefer the working-tree source so a bare `pytest` never tests a stale wheel.
# The supported command is still `uv run --extra dev pytest` (pytest is a dev
# extra); tests/conftest.py hard-fails if gen_worker resolves outside src/.
pythonpath = ["src", "tests"]

# NOTE: the CUDA 13.0 torch pin below is uv-only — it is read by `uv sync` /
# `uv build` in this repo, NOT by `pip`. `pip install gen-worker[torch]`
# resolves torch from PyPI (a CPU or default-CUDA build) and may differ. Tenant
# images built by Tensorhub pin their own torch/CUDA build; this pin only fixes
# the local dev + CI environment and matches the managed CUDA 13.0 fleet.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
# pgw#1370: dev-only (see the dev extra) — release envs pin their own torchcg.
# pgw#1457: THIS REV AND `_vendor/VENDORED.toml`'s ARE A MATCHED PAIR, and the
# fence `test_the_dev_torchcg_pin_is_the_rev_the_snapshot_was_taken_from`
# asserts it. pgw runs two torchcg copies on purpose — the vendored snapshot
# serves the mint and the serving path, this pin serves the DERIVE, which
# imports torchcg from the env it runs in. A re-vendor that moves only the
# vendored half leaves two versions live in one tree, and the failure lands two
# tools away from the cause: the derive raised `TypeError: unexpected keyword
# 'session'` while that exact signature was verifiably present in the vendored
# tree. Bump both, re-lock, re-vendor — one change, and pgw#1477 made it one
# command: `task vendor -- torchcg <rev>`. Editing this line by hand leaves
# uv.lock behind, which breaks `uv sync --locked` — the first step of every CI
# job — for every open PR; `scripts/lint_lock_pin_agreement.py` now refuses that
# tree locally and as CI's first step.
torchcg = { git = "https://github.com/cozy-creator/torchcg", rev = "aa0517926cf527383f8e1625b279bd40719accec" }
# Saying which pins were deleted requires naming them.
# retired-name: historical rationale, not a live reference.
# pgw#1310 deleted the `hashrepo` / `torch-compiled-graphs` git pins that stood
# here. A source pin is workspace-only metadata — it is stripped from a published
# wheel — so it fixed this repo and left every consumer of the artifact broken
# (ie#738). Both packages are now vendored: src/gen_worker/_vendor/VENDORED.toml
# is the single home of the fact, revs included.
