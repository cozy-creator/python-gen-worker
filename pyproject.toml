# --- burn-down: implicit_reexport, OUR modules (7) ---
# Keyed on the EXPORTING module, not the importer. Each name means some other
# module reaches a symbol through this one instead of through the module that
# owns it (e.g. gen_worker.request_context._decode_unverified_jwt_claims read
# from three importers). Closed by importing from the owner, not by an ignore.
[[tool.mypy.overrides]]
module = [
  "gen_worker.aot_mint",
  "gen_worker.cuda_root",
  "gen_worker.fleet_cells",
  "gen_worker.hot_swap",
  "gen_worker.models.cozy_snapshot",
  "gen_worker.models.lora_lifted",
]
implicit_reexport = true

# --- NOT a burn-down: third-party stub export gaps (9) ---
# These upstream packages ship stubs whose __all__ omits attributes that are
# part of their real public surface. Nothing in this repo can fix that, and
# silencing it per-callsite with `# type: ignore` would be churn that hides the
# next genuine one. Revisit only when an upstream stub is corrected.
[[tool.mypy.overrides]]
module = [
  "diffusers.hooks",
  "diffusers.loaders.single_file",
  "diffusers.quantizers",
  "huggingface_hub.utils",
  "torch._dynamo",
  "torch._inductor.codecache",
  "torch._inductor.package",
  "torch.distributed",
  "torch.multiprocessing",
]
implicit_reexport = true

# ---------------------------------------------------------------------------
# pgw#1202 PR 2: the TEST tree is type-checked. Until this landed `mypy tests`
# did not produce a report — it REFUSED TO START ("Duplicate module named
# conftest"), so all 486 test modules had zero static coverage. That is exactly
# where the defect this mandate exists for lived: two doubles LYING ABOUT THE
# PRODUCTION CONTRACT (a recorder returning a bare outcome where production
# returns a tuple; a marker answering is_armed False on a pipeline the fixture
# called armed). A double is typed by what its author wrote, and nothing
# compared that to production.
#
# `explicit_package_bases` is what unblocks it: tests/conftest.py and
# tests/convert/conftest.py become tests.conftest and tests.convert.conftest
# instead of colliding on the basename. No __init__.py files were added — that
# would change pytest's import mode for 4,810 passing tests to buy nothing.
# ---------------------------------------------------------------------------

# Test code is exempt from the five ANNOTATION-COMPLETENESS flags. A test
# function is allowed to be `def test_x():` — demanding `-> None` on 2,207 of
# them buys nothing and would bury the diff. Everything that catches a double
# CONTRADICTING production stays on: arg-type, attr-defined, return-value,
# call-arg, assignment, union-attr.
[[tool.mypy.overrides]]
module = ["tests.*", "tests_v2.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
disallow_untyped_decorators = false
implicit_reexport = true
warn_unused_ignores = false

# --- burn-down: test modules not yet clean even at that posture ---
# 2,016 errors in 316 of 486 modules, so 170 test modules were ALREADY clean
# and are checked from this commit on. The point of naming the dirty ones
# rather than allowlisting the clean ones: a test file added tomorrow is
# CHECKED, so a new double cannot quietly lie.
