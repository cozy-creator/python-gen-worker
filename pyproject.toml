[project]
name = "gen-worker"
version = "0.113.2"
description = "A library used to build custom functions in Cozy Creator's serverless function platform."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Paul Fidika", email = "paul@fidika.com" }
]
keywords = ["serverless", "ai", "ml", "inference", "cozy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Fleet floor is py3.12 (gw#439 base-image standard); numpy 2.4 stubs need
# a 3.12+ mypy target anyway.
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.82.1",
    "msgspec>=0.18.6",
    "protobuf>=7.35.0",
    "requests>=2.32.0",
    "boto3>=1.41.0",
    "psutil>=7.0.0",
    "pyyaml>=6.0.0",
    "blake3>=1.0.0",
    "huggingface-hub>=0.26.0",
    # gen_worker.convert (GGUF quantization tooling; small, pure-python)
    "gguf>=0.10.0",
    # endpoint.lock is TOML; msgspec.toml.encode needs tomli-w at bake time.
    "tomli-w>=1.0.0",
    # C2PA Content Credentials (th#714, EU AI Act Art. 50) — core, not an
    # extra: the compliance default-ON posture must not depend on every
    # endpoint image remembering `[signing]`. Small manylinux wheel.
    "c2pa-python>=0.36",
]
# Pillow (image I/O) and numpy/soundfile (audio I/O) are lazy-imported by
# gen_worker.io and live in the [images] / [audio] extras — the base wheel
# stays lean for plain-Python (API-proxy) endpoints.

[project.urls]
Homepage = "https://github.com/cozy-creator/python-gen-worker"
Repository = "https://github.com/cozy-creator/python-gen-worker"
Issues = "https://github.com/cozy-creator/python-gen-worker/issues"

[project.scripts]
gen-worker = "gen_worker.cli:main"

[project.optional-dependencies]
torch = [
    "torch>=2.13.0",
    "safetensors>=0.8.0",
    # Emergency nf4 fit rung (gw#420) — automatic on CUDA hosts, needs bnb.
    "bitsandbytes>=0.45.0; sys_platform == 'linux' or sys_platform == 'win32'",
    # pgw#1123: the real-weight quantized loaders (models/w8a8, models/w4a4,
    # models/svdq_native) build their skeletons with
    # `accelerate.init_empty_weights`. It was an undeclared import on those
    # paths; declared here and NOT in `dependencies`, because accelerate
    # hard-requires torch>=2.0.0 and the base wheel deliberately carries none.
    # The BOOT-KEY path no longer imports it at all — `models/meta_init` owns
    # that context manager, so a family without accelerate still derives a key.
    "accelerate>=1.9",
]
vision = [
    "torchvision>=0.28.0",
]
images = [
    "Pillow>=10.0",
]
audio = [
    "soundfile>=0.12",
    "numpy>=1.24",
]
video = [
    "av>=12",
    "numpy>=1.24",
]
signing = [
    # C2PA Content Credentials (th#714) — official CAI binding over c2pa-rs.
    "c2pa-python>=0.36",
]
dev = [
    "av>=12",
    "c2pa-python>=0.36",
    "Pillow>=10.0",
    # Real tiny-pipeline residency tests (gw#417) build local diffusers pipes;
    # transformers+accelerate activate the bnb nf4 convert integration test.
    "accelerate>=1.9",
    "diffusers>=0.39.0",
    "grpcio-tools>=1.82.1",
    # 5.13 floor: the fp8+te writer keys on transformers-5 conversion_mapping /
    # core_model_loading internals; <5.5.2 has the fast-safetensors Gemma
    # key-rename bug. Producer/consumer symmetry with the serve fleet (te#45).
    "transformers>=5.13",
    "mypy>=1.10.0",
    # Real-parquet dataset-materialization tests (gw#425).
    "pyarrow>=17.0.0",
    "ruff>=0.6.0",
    "pytest>=9.0.0",
    # pgw#867: property-based tests over the decode boundaries (topology wire,
    # ref grammar, chunked-manifest entries). hypothesis rather than atheris —
    # these decoders are shallow, so libFuzzer coverage feedback buys little,
    # and `@example(...)` puts the seed corpus in the source as ordinary
    # always-run cases instead of opaque corpus blobs.
    "hypothesis>=6.100",
    # pgw#796: the suite is ~190 files of independent processes/sockets/temp
    # dirs; `--dist loadfile` keeps each file (and its module/session fixtures)
    # on one worker, so nothing shares state that did not already share it.
    "pytest-xdist>=3.8.0",
    "types-PyYAML>=6.0.12.20250915",
    "types-requests>=2.32.4.20250913",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gen_worker"]

[tool.hatch.build.targets.sdist]
include = ["src/gen_worker", "README.md", "pyproject.toml"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
# pgw#1202: the tree is STRICT BY DEFAULT. A new module is born strict; the only
# way to be exempt is to be named in a burn-down list below. Those lists shrink
# and never grow — adding a name is how this gate stops meaning anything, so a
# new name needs the same justification as deleting a test.
#
# Measured at adoption: 413 --strict errors in 101 of 266 modules, so 165 modules
# were ALREADY strict-clean and are locked here. Everything --strict implies
# beyond the four flags relaxed below — check_untyped_defs, disallow_incomplete_defs,
# strict_equality, extra_checks, disallow_subclassing_any, no_implicit_optional,
# warn_unused_ignores, warn_redundant_casts — cost ZERO errors and is simply on.
#
# A name here that no longer matches a module prints "unused section(s)" and
# exits 0 (verified), so a lane deleting a module leaves a prune breadcrumb
# rather than a red check for whoever merges next.
strict = true

# Generated protobuf modules: no source of ours to fix.
[[tool.mypy.overrides]]
module = ["gen_worker.pb.*"]
ignore_errors = true

# Modules moved verbatim from the old gen_worker.conversion carry that
# package's untyped-defs exemption (was cozy_convert's [tool.mypy] config).
# Their BODIES are now checked (strict's check_untyped_defs) and are clean.
[[tool.mypy.overrides]]
module = ["gen_worker.convert.*"]
disallow_untyped_defs = false

# --- burn-down: disallow_any_generics (285 errors, 69 modules) ---
# bare `dict`/`list`/`tuple`/`Callable` — every one is an untracked Any leak.
[[tool.mypy.overrides]]
module = [
  "gen_worker.aot_compile_child",
  "gen_worker.aot_compile_pool",
  "gen_worker.aot_declaration",
  "gen_worker.aot_mint",
  "gen_worker.aot_serve",
  "gen_worker.api.decorators",
  "gen_worker.api.derive",
  "gen_worker.api.export_contract",
  "gen_worker.api.formula",
  "gen_worker.api.progress",
  "gen_worker.api.types",
  "gen_worker.boot_key",
  "gen_worker.boot_phases",
  "gen_worker.cell_key",
  "gen_worker.cli.invoke",
  "gen_worker.cli.local_context",
  "gen_worker.cli.prefetch",
  "gen_worker.compile_cache",
  "gen_worker.compile_posture",
  "gen_worker.convert._hf_load",
  "gen_worker.convert.component",
  "gen_worker.convert.dataset",
  "gen_worker.convert.hub",
  "gen_worker.convert.produced",
  "gen_worker.convert.publish_journal",
  "gen_worker.convert.source",
  "gen_worker.convert.writer",
  "gen_worker.discovery.discover",
  "gen_worker.discovery.execution_lanes",
  "gen_worker.entrypoint",
  "gen_worker.executor",
  "gen_worker.fleet_cells",
  "gen_worker.graph_hash",
  "gen_worker.guard_closure",
  "gen_worker.host_move_guard",
  "gen_worker.hot_swap",
  "gen_worker.input_assets",
  "gen_worker.lifecycle",
  "gen_worker.models.chunk_upload",
  "gen_worker.models.cozy_snapshot",
  "gen_worker.models.disk_gc",
  "gen_worker.models.loading",
  "gen_worker.models.residency",
  "gen_worker.models.staging",
  "gen_worker.models.svdq",
  "gen_worker.models.svdq_native",
  "gen_worker.models.w4a4",
  "gen_worker.models.w8a8",
  "gen_worker.parallel.cp",
  "gen_worker.parallel.group",
  "gen_worker.parallel.runtime",
  "gen_worker.preload",
  "gen_worker.procsplit.actions",
  "gen_worker.procsplit.broker",
  "gen_worker.procsplit.child",
  "gen_worker.procsplit.parent",
  "gen_worker.registry",
  "gen_worker.request_context",
  "gen_worker.request_context._stream",
  "gen_worker.runtimes.server",
  "gen_worker.sparse_attention",
  "gen_worker.stage_timing",
  "gen_worker.supervisor",
  "gen_worker.testing",
  "gen_worker.topology",
  "gen_worker.transport",
  "gen_worker.utils.lora",
  "gen_worker.view",
  "gen_worker.warmup",
]
disallow_any_generics = false

# --- burn-down: warn_return_any (48 errors, 26 modules) ---
# a function declares a real return type and returns an Any.
[[tool.mypy.overrides]]
module = [
  "gen_worker.activity",
  "gen_worker.api.binding",
  "gen_worker.benchmarks.engine_matrix",
  "gen_worker.cli.invoke",
  "gen_worker.compile_cache",
  "gen_worker.convert.dataset",
  "gen_worker.convert.repackage",
  "gen_worker.convert.source",
  "gen_worker.executor",
  "gen_worker.families.base",
  "gen_worker.fleet_cells",
  "gen_worker.intent_registry",
  "gen_worker.io",
  "gen_worker.lifecycle",
  "gen_worker.measure_child",
  "gen_worker.models.download",
  "gen_worker.models.loading",
  "gen_worker.models.nvfp4_quant",
  "gen_worker.models.w4a4",
  "gen_worker.models.w8a8",
  "gen_worker.procsplit.parent",
  "gen_worker.request_context",
  "gen_worker.rigboot",
  "gen_worker.runtimes.llama",
  "gen_worker.testing",
  "gen_worker.transport",
]
warn_return_any = false

# --- burn-down: disallow_untyped_calls (37 errors, 20 modules) ---
# typed code calls an untyped function, laundering Any across the seam.
[[tool.mypy.overrides]]
module = [
  "gen_worker.boot_trace_child",
  "gen_worker.convert.clone",
  "gen_worker.convert.convert",
  "gen_worker.convert.source",
  "gen_worker.hardware_report",
  "gen_worker.host_canary",
  "gen_worker.hot_swap",
  "gen_worker.kernel_path",
  "gen_worker.media_transfer",
  "gen_worker.models.fp8_storage",
  "gen_worker.models.loading",
  "gen_worker.models.native_kernels",
  "gen_worker.models.staging",
  "gen_worker.models.svdq_fused",
  "gen_worker.models.w4a4",
  "gen_worker.models.w8a8",
  "gen_worker.models.w8a8_lora",
  "gen_worker.parallel.cp",
  "gen_worker.rigcheck",
  "gen_worker.transport",
]
disallow_untyped_calls = false

# --- burn-down: disallow_untyped_decorators (9 errors, 3 modules) ---
# Triton/torch JIT kernel decorators; upstream is untyped.
[[tool.mypy.overrides]]
module = [
  "gen_worker.models.nvfp4_quant",
  "gen_worker.models.svdq_awq_packed",
  "gen_worker.models.svdq_fused",
]
disallow_untyped_decorators = false

# --- burn-down: implicit_reexport, OUR modules (8) ---
# Keyed on the EXPORTING module, not the importer. Each name means some other
# module reaches a symbol through this one instead of through the module that
# owns it (e.g. gen_worker.request_context._decode_unverified_jwt_claims read
# from three importers). Closed by importing from the owner, not by an ignore.
[[tool.mypy.overrides]]
module = [
  "gen_worker.aot_mint",
  "gen_worker.cuda_root",
  "gen_worker.fleet_cells",
  "gen_worker.hot_swap",
  "gen_worker.models.chunk_upload",
  "gen_worker.models.cozy_snapshot",
  "gen_worker.models.lora_lifted",
  "gen_worker.request_context",
]
implicit_reexport = true

# --- NOT a burn-down: third-party stub export gaps (9) ---
# These upstream packages ship stubs whose __all__ omits attributes that are
# part of their real public surface. Nothing in this repo can fix that, and
# silencing it per-callsite with `# type: ignore` would be churn that hides the
# next genuine one. Revisit only when an upstream stub is corrected.
[[tool.mypy.overrides]]
module = [
  "diffusers.hooks",
  "diffusers.loaders.single_file",
  "diffusers.quantizers",
  "huggingface_hub.utils",
  "torch._dynamo",
  "torch._inductor.codecache",
  "torch._inductor.package",
  "torch.distributed",
  "torch.multiprocessing",
]
implicit_reexport = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated modules are lint-exempt (mirrors the mypy overrides above).
extend-exclude = [
    "src/gen_worker/pb",
]

[tool.ruff.lint]
# E402: gen_worker defers heavy imports (torch, request_context, cli
# subcommands) below module-level guards on purpose so `import gen_worker` and
# `gen-worker --help` stay cheap. Not a defect.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]  # intentional public re-exports

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: network tests against real tiny HF models",
  # pgw#978. LOCAL-ONLY by classification, not by accident: CI has no GPU and
  # no card-side anything, and scripts/skip_census.txt carries these rows as
  # LOCAL-ONLY so a green CI never reads as coverage of them.
  "localrig: the local micro-mint rig (pgw#978) — run by hand, never in CI",
  "slow: a full machinery cycle; minutes, not seconds",
]
# Prefer the working-tree source so a bare `pytest` never tests a stale wheel.
# The supported command is still `uv run --extra dev pytest` (pytest is a dev
# extra); tests/conftest.py hard-fails if gen_worker resolves outside src/.
pythonpath = ["src"]

# NOTE: the CUDA 13.0 torch pin below is uv-only — it is read by `uv sync` /
# `uv build` in this repo, NOT by `pip`. `pip install gen-worker[torch]`
# resolves torch from PyPI (a CPU or default-CUDA build) and may differ. Tenant
# images built by Tensorhub pin their own torch/CUDA build; this pin only fixes
# the local dev + CI environment and matches the managed CUDA 13.0 fleet.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
