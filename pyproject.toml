[project]
name = "gen-worker"
version = "0.116.0"
description = "A library used to build custom functions in Cozy Creator's serverless function platform."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Paul Fidika", email = "paul@fidika.com" }
]
keywords = ["serverless", "ai", "ml", "inference", "cozy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Fleet floor is py3.12 (gw#439 base-image standard); numpy 2.4 stubs need
# a 3.12+ mypy target anyway.
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.82.1",
    "msgspec>=0.18.6",
    "protobuf>=7.35.0",
    "requests>=2.32.0",
    "psutil>=7.0.0",
    "pyyaml>=6.0.0",
    "blake3>=1.0.0",
    "hashrepo>=0.3,<0.4",
    "huggingface-hub>=0.26.0",
    # gen_worker.convert (GGUF quantization tooling; small, pure-python)
    "gguf>=0.10.0",
    # endpoint.lock is TOML; msgspec.toml.encode needs tomli-w at bake time.
    "tomli-w>=1.0.0",
    # C2PA Content Credentials (th#714, EU AI Act Art. 50) — core, not an
    # extra: the compliance default-ON posture must not depend on every
    # endpoint image remembering `[signing]`. Small manylinux wheel.
    "c2pa-python>=0.36",
]
# Pillow (image I/O) and numpy/soundfile (audio I/O) are lazy-imported by
# gen_worker.io and live in the [images] / [audio] extras — the base wheel
# stays lean for plain-Python (API-proxy) endpoints.

[project.urls]
Homepage = "https://github.com/cozy-creator/python-gen-worker"
Repository = "https://github.com/cozy-creator/python-gen-worker"
Issues = "https://github.com/cozy-creator/python-gen-worker/issues"

[project.scripts]
gen-worker = "gen_worker.cli:main"

[project.optional-dependencies]
torch = [
    "torch>=2.13.0",
    "safetensors>=0.8.0",
    # Emergency nf4 fit rung (gw#420) — automatic on CUDA hosts, needs bnb.
    "bitsandbytes>=0.45.0; sys_platform == 'linux' or sys_platform == 'win32'",
    # pgw#1123: the real-weight quantized loaders (models/w8a8, models/w4a4,
    # models/svdq_native) build their skeletons with
    # `accelerate.init_empty_weights`. It was an undeclared import on those
    # paths; declared here and NOT in `dependencies`, because accelerate
    # hard-requires torch>=2.0.0 and the base wheel deliberately carries none.
    # The BOOT-KEY path no longer imports it at all — `models/meta_init` owns
    # that context manager, so a family without accelerate still derives a key.
    "accelerate>=1.9",
]
vision = [
    "torchvision>=0.28.0",
]
images = [
    "Pillow>=10.0",
]
audio = [
    "soundfile>=0.12",
    "numpy>=1.24",
]
video = [
    "av>=12",
    "numpy>=1.24",
]
signing = [
    # C2PA Content Credentials (th#714) — official CAI binding over c2pa-rs.
    "c2pa-python>=0.36",
]
dev = [
    "av>=12",
    "c2pa-python>=0.36",
    "Pillow>=10.0",
    # Real tiny-pipeline residency tests (gw#417) build local diffusers pipes;
    # transformers+accelerate activate the bnb nf4 convert integration test.
    "accelerate>=1.9",
    "diffusers>=0.39.0",
    "grpcio-tools>=1.82.1",
    # 5.13 floor: the fp8+te writer keys on transformers-5 conversion_mapping /
    # core_model_loading internals; <5.5.2 has the fast-safetensors Gemma
    # key-rename bug. Producer/consumer symmetry with the serve fleet (te#45).
    "transformers>=5.13",
    "mypy>=1.10.0",
    # Real-parquet dataset-materialization tests (gw#425).
    "pyarrow>=17.0.0",
    "ruff>=0.6.0",
    "pytest>=9.0.0",
    # pgw#867: property-based tests over the decode boundaries (topology wire,
    # ref grammar, chunked-manifest entries). hypothesis rather than atheris —
    # these decoders are shallow, so libFuzzer coverage feedback buys little,
    # and `@example(...)` puts the seed corpus in the source as ordinary
    # always-run cases instead of opaque corpus blobs.
    "hypothesis>=6.100",
    # pgw#796: the suite is ~190 files of independent processes/sockets/temp
    # dirs; `--dist loadfile` keeps each file (and its module/session fixtures)
    # on one worker, so nothing shares state that did not already share it.
    "pytest-xdist>=3.8.0",
    "types-PyYAML>=6.0.12.20250915",
    "types-requests>=2.32.4.20250913",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gen_worker"]

[tool.hatch.build.targets.sdist]
include = ["src/gen_worker", "README.md", "pyproject.toml"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
# pgw#1202: the tree is STRICT BY DEFAULT. A new module is born strict; the only
# way to be exempt is to be named in a burn-down list below. Those lists shrink
# and never grow — adding a name is how this gate stops meaning anything, so a
# new name needs the same justification as deleting a test.
#
# Measured at adoption: 413 --strict errors in 101 of 266 modules, so 165 modules
# were ALREADY strict-clean and are locked here. Everything --strict implies
# beyond the four flags relaxed below — check_untyped_defs, disallow_incomplete_defs,
# strict_equality, extra_checks, disallow_subclassing_any, no_implicit_optional,
# warn_unused_ignores, warn_redundant_casts — cost ZERO errors and is simply on.
#
# A name here that no longer matches a module prints "unused section(s)" and
# exits 0 (verified), so a lane deleting a module leaves a prune breadcrumb
# rather than a red check for whoever merges next.
strict = true

# pgw#1202 PR 2: without this `mypy tests` refuses to start on a duplicate
# `conftest` module name and reports nothing at all.
explicit_package_bases = true
# …and this keeps src/ modules resolving as `gen_worker.x`, not `src.gen_worker.x`,
# which is what every per-module override below is keyed on.
mypy_path = "src"

# Generated protobuf modules: no source of ours to fix.
[[tool.mypy.overrides]]
module = ["gen_worker.pb.*"]
ignore_errors = true

# Modules moved verbatim from the old gen_worker.conversion carry that
# package's untyped-defs exemption (was cozy_convert's [tool.mypy] config).
# Their BODIES are now checked (strict's check_untyped_defs) and are clean.
[[tool.mypy.overrides]]
module = ["gen_worker.convert.*"]
disallow_untyped_defs = false

# --- burn-down: disallow_any_generics (285 errors, 69 modules) ---
# bare `dict`/`list`/`tuple`/`Callable` — every one is an untracked Any leak.
