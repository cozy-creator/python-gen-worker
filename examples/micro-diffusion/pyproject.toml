[project]
name = "micro-diffusion"
version = "0.2.0"
description = "The fleet's smallest REAL endpoint family — three export entries over a deterministically generated toy checkpoint, so a full AOT mint cycle costs minutes"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Hard-pinned per th#1098 fleet policy: compile cells verify() EXACT on
    # the gen-worker version, so a range would make an adopted cell's identity
    # depend on what the build happened to resolve.
    #
    # ⚠️ THIS FAMILY'S SERVE PATH REQUIRES pgw#994 (`2165c2d5`): it declares a
    # `repeat=` container input with a plain input after it, and on <0.93.4 the
    # cell MINTS and SEALS and then refuses at ingress on its first served
    # call. Never pin below that.
    #
    # This example is outside the `inference-endpoints` relock train, so the pin
    # is moved here by hand at each cut to keep the micro gauntlet on the SAME
    # wheel the fleet serves — which is the whole reason the gauntlet is a
    # usable probe. Floor facts still in force: pgw#1059's four-axis `ck1`
    # (0.97.0), so every cell minted from this pin is a live-scheme cell.
    "gen-worker==0.112.0",
    "msgspec>=0.18",
    "safetensors>=0.4",
    "pillow",
]

# NO diffusers, NO transformers, NO accelerate. The whole point of this family
# is that its image is small and its boot is short; a dependency it does not
# use would cost both on every cycle.
#
# The FLOOR is 0.106.0 BECAUSE of pgw#1123: on 0.97.0-0.105.0
# `models/structure_only` imported `accelerate`, so on THIS image the boot-key
# derivation refused, no `/v1/worker/compiled-graphs/resolve` was ever issued, and the pod
# self-minted forever — measured on pods `ykwoaiqub6ktt3` and `3o09rf9ehnc4ym`,
# and it is what silenced the first paid reuse-circle proof. 0.106.0 owns the
# meta-init (`gen_worker.models.meta_init`), which `pipeline.py` uses. Adding
# `accelerate` here instead would have fixed this one image and left the SDK
# defect in place for every other family, which is why it is NOT here.
#
# The pin is 0.111.0 because the reuse circle cannot close below it: pgw#1141
# (`0dbf68e5`) deletes the warmup barrier that DISARMED every boot-adopted cell
# on 0.106.0 (POD PROOF #3, twice, identically), and pgw#1132 (`8867baac`) arms
# the lifted forward in the boot-key loop. Below 0.111.0 an adopting pod resolves,
# materializes and then throws the cell away.

[dependency-groups]
local = [
    "torch>=2.11.0",
]
dev = [
    "mypy>=1.10.0",
    "pytest>=9.0.3",
]

[tool.gen_worker]
main = "micro_diffusion.main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micro_diffusion"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
