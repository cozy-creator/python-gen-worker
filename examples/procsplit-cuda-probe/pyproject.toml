[project]
name = "procsplit_cuda_probe"
version = "1.0.0"
description = "pgw#763 stage 4: witness CUDA-context re-establishment after a compute-child death"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gen-worker>=0.77",
    "torch>=2.6",
    "msgspec>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procsplit_cuda_probe"]

[tool.gen_worker]
main = "procsplit_cuda_probe.main"

[tool.uv.sources]
gen-worker = { path = "../..", editable = true }
