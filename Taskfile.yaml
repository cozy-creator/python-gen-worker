version: '3'
dotenv: ['.env']

tasks:
  build:
    desc: Build package
    cmds:
      - rm -rf dist/
      - uv build

  # THERE IS NO `task publish`, deliberately (pgw#1140, 2026-08-12). PyPI
  # publication is the TAG PUSH: `.github/workflows/publish.yaml` refuses to ship
  # a tree no CI run has proven, and a local `uv publish` walks around that gate.
  # One procedure, and it lives in docs/releasing.md. Do not re-add this task.
  #
  # The task deleted here also carried pgw#978's "run `task rig:mint` first",
  # which Paul's 2026-08-10 hard cut (all mints on remote machines only)
  # superseded — a release instruction that told the next cutter to break a
  # standing rule on the shared box.

  rig:mint:
    desc: |
      ⚠️ REMOTE ONLY (Paul, 2026-08-10 hard cut): this runs a REAL inductor/AOTI
      compile. Run it on a micro pod, never on the shared box. The older
      "local-inference carve-out" this task used to claim no longer covers mints.

      pgw#978 — the whole mint machinery against a toy model: resolve ->
      MintSlot handoff -> child spawn -> load -> warmup_forward -> torch.export
      + AOTInductor -> seal -> publish to a local hub -> a SECOND process
      adopting the cell. Seconds per iteration instead of the
      publish->build->buy loop. It is NOT a release gate — see docs/releasing.md.
    cmds:
      - nice -n 10 uv run python scripts/micro_mint_rig.py {{.CLI_ARGS}}

  rig:micro:
    desc: |
      ⚠️ REMOTE ONLY — a real AOTI compile, same as `rig:mint`.

      pgw#997 — the same full cycle against `examples/micro-diffusion`, the
      org-worker-shaped endpoint: 3 export entries (two fork arms + a second
      target), CONTAINER inputs with a plain input after them so every cycle
      re-proves pgw#993/pgw#994, deterministically GENERATED weights, and a
      parity check that arms the adopted cell and compares every arm to eager.

      This is the vehicle a mint-path change should be proven against;
      `task rig:mint` is the cheaper one-entry plumbing toy.
    cmds:
      - nice -n 10 uv run python scripts/micro_mint_rig.py --vehicle micro {{.CLI_ARGS}}

  rig:gauntlet:
    desc: |
      ⚠️ REMOTE ONLY — every variant is a real compile. "Cardless" is not
      "local": cardless still runs inductor, which the 2026-08-10 cut forbids
      on the shared box.

      pgw#1014 — EVERY mint shape the fleet runs, in one command, with a table.
      Each variant is a full production cycle (spawn, export+AOTI, seal,
      publish, second-process adopt + parity) on a model that compiles in
      under a minute.

      Variants declare the outcome they EXPECT, because some exist to
      demonstrate a REFUSAL — so the gauntlet reports agreement, and a flip in
      either direction is news. Exit 0 = every variant matched.

      Cardless by default. For the GPU lane (real sm_89, no synthetic probe):
        eval "$(./scripts/rig_gpu_env.sh --export-only)"
        task rig:gauntlet -- --device cuda --python "$GEN_WORKER_RIG_GPU_PYTHON"
    cmds:
      - nice -n 10 uv run python scripts/rig_gauntlet.py {{.CLI_ARGS}}

  rig:gpu:
    desc: |
      pgw#983 — one rig cycle on the REAL card. Builds/refreshes the isolated
      cu126 interpreter (see scripts/rig_gpu_env.sh: cu128 has no torch
      2.13.0, cu126 does) and runs with --device cuda, so the cell carries a
      MEASURED sm_89 instead of a supplied one.

      The repo's own .venv and the cu130 pin are untouched; this is a second
      interpreter, selected explicitly, never a default.
    cmds:
      - ./scripts/rig_gpu_env.sh > /dev/null
      - |
        eval "$(./scripts/rig_gpu_env.sh --export-only)"
        nice -n 10 "$GEN_WORKER_RIG_GPU_PYTHON" scripts/micro_mint_rig.py \
          --device cuda {{.CLI_ARGS}}

  rig:test:
    desc: |
      pgw#978 — the rig as a pytest row, including the full cycle (opt-in via
      PGW978_RIG so CI's cardless runner never reads it as coverage; classified
      LOCAL-ONLY in scripts/skip_census.txt).
    env:
      PGW978_RIG: '1'
    cmds:
      - nice -n 10 uv run --extra dev pytest tests/test_micro_mint_rig_pgw978.py -p no:randomly -rs

  probe:sync:
    desc: |
      pgw#980 — rsync src/gen_worker onto a held probe pod and respawn its
      compute child. Code only; weights stay pod-side.
      Usage: task probe-sync -- <ssh-target>
      See docs/probe-worker.md — buy ONE pod, hold it, iterate, terminate.
    cmds:
      - scripts/probe_sync.sh {{.CLI_ARGS}}

  proto-vendor:
    desc: |
      pgw#944 — resync proto/worker_scheduler.proto from tensorhub (which owns
      the canonical copy) and regenerate src/gen_worker/pb/.
      Usage: task proto-vendor -- ~/cozy/tensorhub
    cmds:
      - scripts/vendor-proto.sh {{.CLI_ARGS}}

  worker-value-contract-check:
    desc: |
      pgw#1237 — pin the public worker-value carrier locally. Tensorhub vendors
      the corpus and runs the meaningful Hub -> public-PGW byte comparison, so
      the coupled-cut direction is PGW LANDS FIRST.
    cmds:
      - uv run python scripts/check_worker_value_contracts_digest.py

  hub-worker-boundary-check:
    desc: |
      pgw#1239 / th#1914 — pin the public Hub-to-worker launch ABI carrier.
      Tensorhub performs the meaningful private-Hub -> public-PGW comparison,
      so the coupled-cut direction is PGW LANDS FIRST.
    cmds:
      - uv run python scripts/check_hub_worker_boundary_contracts_digest.py
      - scripts/hub-worker-boundary-drift.sh

  cozy-runtime-env-check:
    desc: |
      pgw#1237 / cl#56 — pin the public Cozy runtime-env carrier locally.
      cozy-local runs the meaningful private-consumer -> public-PGW byte
      comparison, so the coupled-cut direction is PGW LANDS FIRST.
    cmds:
      - uv run python scripts/check_cozy_runtime_env_digest.py

  proto-check:
    desc: |
      pgw#944 — fail if the VENDORED contract was hand-edited: the local
      proto/worker_scheduler.proto must hash to proto/PROTO_DIGEST, the same
      digest tensorhub commits. Gated in CI by
      .github/workflows/proto-contract.yaml on PRs into dev AND master.
    cmds:
      - PROTO_SKIP_PEER=1 scripts/proto-drift-check.sh

  formula-vector-check:
    desc: |
      pgw#1236 / th#1914 — pin this repo's shared formula corpus offline.
      Tensorhub performs the peer comparison; PGW lands first.
    cmds:
      - uv run python scripts/check_formula_corpus_digest.py
      - scripts/formula-vector-drift.sh

  proto:
    desc: Regenerate src/gen_worker/pb/ from proto/ (grpcio-tools codegen)
    cmds:
      - >-
        uv run --extra dev python -m grpc_tools.protoc
        -Iproto
        --python_out=src/gen_worker/pb
        --grpc_python_out=src/gen_worker/pb
        --pyi_out=src/gen_worker/pb
        proto/worker_scheduler.proto

  lint:
    desc: The `fast gates` job, locally — same commands, same hardness
    # pgw#1202: this task is named like the CI gate, so it must be able to fail
    # like the CI gate. It could not, twice over, and both halves cost a real
    # cycle (pgw#718's red was `tests/test_entry_blast_radius_pgw1208.py:156` —
    # a file this task did not even look at):
    #
    #   1. WRONG SCOPE. It ran `mypy src/gen_worker` while CI runs
    #      `mypy src/gen_worker tests tests_v2`, so it omitted the 486 test
    #      modules pgw#1202 PR 2 brought under type-checking — exactly where the
    #      doubles that lie about production contracts live.
    #   2. COULD NOT GO RED. `ignore_error: true` on the mypy line, annotated as
    #      "matched by continue-on-error in CI". That was never true of mypy:
    #      CI's mypy step is a hard gate and has been since gw#497. It is true
    #      of RUFF, whose CI step really does carry continue-on-error — so the
    #      flag was correct for one of the two commands it covered and the
    #      shared comment made the wrong one look deliberate.
    #
    # So: mypy runs the CI command VERBATIM and fails. Ruff keeps ignore_error,
    # which genuinely matches its CI step, and now says so on its own line.
    # A gate that runs a different command under the same name is a different
    # gate wearing its clothes.
    cmds:
      - cmd: uv run --extra dev mypy src/gen_worker tests tests_v2
      - cmd: uv run --extra dev ruff check src/gen_worker
        # Advisory, and this one IS matched by continue-on-error in CI:
        # pre-existing debt, mostly in worker.py, which is being rewritten.
        ignore_error: true
      # Hard gate (matches CI): gw#467 HTTP timeout guard.
      - cmd: uv run python scripts/lint_http_timeouts.py
      # Hard gate (matches CI): pgw#849 guard 2 — public surface in the
      # aot/mint/serve packages with no caller on the pod's production path.
      # Ratcheted against scripts/unreached_surface_baseline.txt: new entries
      # fail, and so does a baseline line that is now wired up.
      - cmd: uv run python scripts/lint_unreached_surface.py
      # Hard gate (matches CI): pgw#1013 / th#1662 — an external length prefix
      # may not size a read unless a validator bounds it or a
      # `# bound-justified:` comment says why none is needed.
      - cmd: uv run python scripts/lint_unbounded_reads.py
      # pgw#1202: the eleven below were in CI's `fast gates` and NOT here, so
      # `task lint` was green on a tree that CI would refuse. Each is a hard
      # gate there and a hard gate here; all eleven run in seconds. The one CI
      # gate deliberately NOT in this list is `lint_skip_census.py --ci`, which
      # reads the .skip-census-*.json that only a full pytest run produces —
      # it belongs to `task test`, not to a static lint pass.
      - cmd: uv run python scripts/lint_mypy_ratchet.py
      - cmd: uv run python scripts/lint_config_reads.py
      - cmd: uv run python scripts/lint_settings_writers.py
      - cmd: uv run python scripts/lint_layout_declarations.py
      - cmd: uv run python scripts/lint_cell_key_layout_fence.py
      - cmd: uv run python scripts/check_registry_contract.py
      - cmd: uv run python scripts/check_cozy_runtime_env_digest.py
      - cmd: uv run python scripts/check_worker_value_contracts_digest.py
      - cmd: uv run python scripts/lint_credential_identity.py
      - cmd: uv run python scripts/lint_arm_state_feeders.py
      - cmd: uv run python scripts/lint_ambient_census.py
      - cmd: uv run python scripts/lint_post_connect_resolution.py
      - cmd: uv run python scripts/assemble_changelog.py --check

  test:
    desc: Run tests (both suites, as CI does)
    # pgw#796 / TEST-SYSTEM-DESIGN.md §7: four workers, distributed by FILE so a
    # module/session fixture and everything that shares its process stay
    # together. Override with `task test WORKERS=1` to debug serially.
    #
    # pgw#808: `tests_v2/` runs as its own step, mirroring ci.yaml — a suite CI
    # gates on but `task test` skips is the same dead weight in a slower form.
    vars:
      WORKERS: '{{.WORKERS | default "4"}}'
    cmds:
      - uv run --extra dev pytest tests/ -n {{.WORKERS}} --dist loadfile
      - uv run --extra dev pytest tests_v2/ -n {{.WORKERS}} --dist loadfile

  test:v2:
    desc: Run the zero-based suite only (pgw#808)
    vars:
      WORKERS: '{{.WORKERS | default "4"}}'
    cmds:
      - uv run --extra dev pytest tests_v2/ -n {{.WORKERS}} --dist loadfile
