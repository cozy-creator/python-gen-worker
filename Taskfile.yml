version: '3'
dotenv: ['.env']

tasks:
  build:
    desc: Build package
    cmds:
      - rm -rf dist/
      - uv build

  publish:
    desc: |
      Publish to PyPI (uses UV_PUBLISH_TOKEN from .env).

      pgw#978 — the ORDER matters. Paul, 2026-08-06: "we want to release new
      versions of python-gen-worker to pypi only after we've proven they work."
      Run `task rig:mint` first; a version that has never completed a local
      machinery cycle has not been proven by anything.
    deps: [build]
    cmds:
      - sh -c 'unset UV_PUBLISH_USERNAME; uv publish'

  rig:mint:
    desc: |
      pgw#978 — run the whole mint machinery locally against a toy model:
      resolve -> MintSlot handoff -> child spawn -> load -> warmup_forward ->
      torch.export + AOTInductor -> seal -> publish to a local hub -> a SECOND
      process adopting the cell.

      Seconds per iteration instead of the publish->build->buy loop. Bounded by
      the workspace policy's local-inference carve-out (generated weights under
      500 MB, a 4 GiB budget split across processes, nice, a load gate at 24,
      and GEN_WORKER_HOST_MOVE_GUARD untouched) — the driver enforces all five.
    cmds:
      - nice -n 10 uv run python scripts/micro_mint_rig.py {{.CLI_ARGS}}

  rig:test:
    desc: |
      pgw#978 — the rig as a pytest row, including the full cycle (opt-in via
      PGW978_RIG so CI's cardless runner never reads it as coverage; classified
      LOCAL-ONLY in scripts/skip_census.txt).
    env:
      PGW978_RIG: '1'
    cmds:
      - nice -n 10 uv run --extra dev pytest tests/test_micro_mint_rig_pgw978.py -p no:randomly -rs

  probe:sync:
    desc: |
      pgw#980 — rsync src/gen_worker onto a held probe pod and respawn its
      compute child. Code only; weights stay pod-side.
      Usage: task probe-sync -- <ssh-target>
      See docs/probe-worker.md — buy ONE pod, hold it, iterate, terminate.
    cmds:
      - scripts/probe_sync.sh {{.CLI_ARGS}}

  proto-vendor:
    desc: |
      pgw#944 — resync proto/worker_scheduler.proto from tensorhub (which owns
      the canonical copy) and regenerate src/gen_worker/pb/.
      Usage: task proto-vendor -- ~/cozy/tensorhub
    cmds:
      - scripts/vendor-proto.sh {{.CLI_ARGS}}

  proto-check:
    desc: |
      pgw#944 — fail if the VENDORED contract was hand-edited: the local
      proto/worker_scheduler.proto must hash to proto/PROTO_DIGEST, the same
      digest tensorhub commits. Gated in CI by
      .github/workflows/proto-contract.yml on PRs into dev AND master.
    cmds:
      - PROTO_SKIP_PEER=1 scripts/proto-drift-check.sh

  proto:
    desc: Regenerate src/gen_worker/pb/ from proto/ (grpcio-tools codegen)
    cmds:
      - >-
        uv run --extra dev python -m grpc_tools.protoc
        -Iproto
        --python_out=src/gen_worker/pb
        --grpc_python_out=src/gen_worker/pb
        --pyi_out=src/gen_worker/pb
        proto/worker_scheduler.proto

  lint:
    desc: Type check (mypy) + lint (ruff)
    # Both carry pre-existing advisory debt (matched by continue-on-error in CI):
    # they run independently and report, so neither masks the other. Tighten to
    # hard gates once the dead-code sweeps + v2 rewrites land.
    cmds:
      - cmd: uv run --extra dev mypy src/gen_worker
        ignore_error: true
      - cmd: uv run --extra dev ruff check src/gen_worker
        ignore_error: true
      # Hard gate (matches CI): gw#467 HTTP timeout guard.
      - cmd: uv run python scripts/lint_http_timeouts.py
      # Hard gate (matches CI): pgw#849 guard 2 — public surface in the
      # aot/mint/serve packages with no caller on the pod's production path.
      # Ratcheted against scripts/unreached_surface_baseline.txt: new entries
      # fail, and so does a baseline line that is now wired up.
      - cmd: uv run python scripts/lint_unreached_surface.py

  test:
    desc: Run tests (both suites, as CI does)
    # pgw#796 / TEST-SYSTEM-DESIGN.md §7: four workers, distributed by FILE so a
    # module/session fixture and everything that shares its process stay
    # together. Override with `task test WORKERS=1` to debug serially.
    #
    # pgw#808: `tests_v2/` runs as its own step, mirroring ci.yml — a suite CI
    # gates on but `task test` skips is the same dead weight in a slower form.
    vars:
      WORKERS: '{{.WORKERS | default "4"}}'
    cmds:
      - uv run --extra dev pytest tests/ -n {{.WORKERS}} --dist loadfile
      - uv run --extra dev pytest tests_v2/ -n {{.WORKERS}} --dist loadfile

  test:v2:
    desc: Run the zero-based suite only (pgw#808)
    vars:
      WORKERS: '{{.WORKERS | default "4"}}'
    cmds:
      - uv run --extra dev pytest tests_v2/ -n {{.WORKERS}} --dist loadfile
